<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══ TOKENS GLOBAIS ══════════════════════════════════ */
:root {
  /* Base fria — carbono azulado, não cinza neutro */
  --bg:#07090d; --s0:#0a0e13; --s1:#0e131a; --s2:#131922; --s3:#1a222d;
  --bd:#202a36; --bd2:#151d27;
  --grid:rgba(150,185,225,.070);   /* textura de malha do fundo */
  --rule:rgba(150,185,225,.16);    /* linhas de régua */
  /* tx3 sobe para ~4,6:1 nos cartões (antes 2,4:1); tx2 sobe junto para manter a hierarquia */
  --tx:#dbe4ee; --tx2:#8796a8; --tx3:#74859a;

  /* Geometria dura — instrumento, não cartão */
  --r:2px; --r2:2px;

  /* Espanhol */
  --es:    #e8c547;
  --es-a:  rgba(232,197,71,.12);
  --es-b:  rgba(232,197,71,.28);

  /* Francês */
  --fr:    #4f8ef7;
  --fr-a:  rgba(79,142,247,.12);
  --fr-b:  rgba(79,142,247,.28);

  /* Mandarim */
  --zh:    #e84c3d;
  --zh-a:  rgba(232,76,61,.12);
  --zh-b:  rgba(232,76,61,.28);
  --zh2:   #d4a843;

  /* Fase cores */
  --p1:#7c6dfa;--p1a:rgba(124,109,250,.10);--p1b:rgba(124,109,250,.28);
  --p2:#e8c547;--p2a:rgba(232,197,71,.10); --p2b:rgba(232,197,71,.28);
  --p3:#3ecf8e;--p3a:rgba(62,207,142,.10); --p3b:rgba(62,207,142,.28);
  --p4:#f87171;--p4a:rgba(248,113,113,.10);--p4b:rgba(248,113,113,.28);
  --p5:#fb923c;--p5a:rgba(251,146,60,.10); --p5b:rgba(251,146,60,.28);
  --p6:#a78bfa;--p6a:rgba(167,139,250,.10);--p6b:rgba(167,139,250,.28);

  /* Cor ativa (muda via JS) */
  --accent:    var(--es);
  --accent-a:  var(--es-a);
  --accent-b:  var(--es-b);

  /* Elevação / sombra (só visível no claro) */
  --shadow-sm: none;
  --shadow-md: none;

  /* Escala tipográfica */
  --fs-2xs: 9px;   --fs-xs: 10.5px; --fs-sm: 12px;  --fs-md: 13px;
  --fs-lg: 15px;   --fs-xl: 17.5px; --fs-2xl: 21px; --fs-display: 32px;

  color-scheme: dark;
}

/* ═══════════════════════════════════════════════════════
   TEMA CLARO
   Paleta recalibrada — não é inversão, é contraste real.
   Cores neon escurecidas para legibilidade sobre branco.
═══════════════════════════════════════════════════════ */
[data-theme="light"] {
  --bg:#eef1f5;  --s0:#e6eaf0; --s1:#ffffff; --s2:#f6f8fb; --s3:#ffffff;
  --bd:#ccd4de;  --bd2:#e2e8ef;
  --grid:rgba(30,60,95,.055);
  --rule:rgba(30,60,95,.12);
  --tx:#0d151f;  --tx2:#4a5a6b; --tx3:#5f6e7f;

  /* Idiomas — tons mais fechados p/ contraste em fundo claro (texto ≥ 4,5:1 sobre branco) */
  --es:   #806200;
  --es-a: rgba(128,98,0,.10);
  --es-b: rgba(128,98,0,.30);

  --fr:   #275fc4;
  --fr-a: rgba(39,95,196,.10);
  --fr-b: rgba(39,95,196,.30);

  --zh:   #cf3123;
  --zh-a: rgba(207,49,35,.10);
  --zh-b: rgba(207,49,35,.30);
  --zh2:  #a8801f;

  /* Fases */
  --p1:#5c4be0; --p1a:rgba(92,75,224,.09);  --p1b:rgba(92,75,224,.30);
  --p2:#8a6600; --p2a:rgba(138,102,0,.09);  --p2b:rgba(138,102,0,.30);
  --p3:#0e7a4a; --p3a:rgba(14,122,74,.09);  --p3b:rgba(14,122,74,.30);
  --p4:#d24343; --p4a:rgba(210,67,67,.09);  --p4b:rgba(210,67,67,.30);
  --p5:#a85400; --p5a:rgba(168,84,0,.09);   --p5b:rgba(168,84,0,.30);
  --p6:#7a55ee; --p6a:rgba(122,85,238,.09); --p6b:rgba(122,85,238,.30);

  --shadow-sm: 0 1px 2px rgba(22,22,42,.05);
  --shadow-md: 0 2px 10px rgba(22,22,42,.07);

  color-scheme: light;
}

/* Elevação real dos cartões no tema claro */
[data-theme="light"] .card,
[data-theme="light"] .fcard,
[data-theme="light"] .acc,
[data-theme="light"] .rot,
[data-theme="light"] .stat,
[data-theme="light"] #analysis-out { box-shadow: var(--shadow-sm); }
[data-theme="light"] #topbar { box-shadow: var(--shadow-md); }
[data-theme="light"] #toast  { box-shadow: 0 6px 24px rgba(22,22,42,.14); }
[data-theme="light"] .btn-p  { box-shadow: 0 1px 3px rgba(22,22,42,.14); }

/* Botão primário no claro precisa de texto branco */
[data-theme="light"] .btn-p { color:#ffffff; }

/* ═══ BASE ════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;font-size:var(--fs-md);line-height:1.6;overflow:hidden;height:100vh;-webkit-text-size-adjust:100%;text-size-adjust:100%}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}

/* ═══ APP SHELL ═══════════════════════════════════════ */
#app{display:flex;flex-direction:column;height:100vh}
#shell-body{display:flex;flex:1;min-height:0}

/* ── TOPBAR ──────────────────────────────────────────── */
#topbar{
  flex:0 0 56px;background:var(--s1);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;padding:0 14px;gap:10px;z-index:50;
  overflow:hidden;width:100%;max-width:100vw;
}

/* Seletor de idioma */
.lang-switcher{display:flex;gap:3px;flex-shrink:0}
.lang-btn{
  font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--fs-xs);letter-spacing:.06em;
  padding:5px 10px;border-radius:var(--r2);border:1px solid var(--bd);
  background:none;color:var(--tx3);cursor:pointer;transition:all .18s;
  white-space:nowrap;
}
.lang-btn:hover{color:var(--tx);border-color:var(--tx3)}
.lang-btn.active-es{color:var(--es);border-color:var(--es-b);background:var(--es-a)}
.lang-btn.active-fr{color:var(--fr);border-color:var(--fr-b);background:var(--fr-a)}
.lang-btn.active-zh{color:var(--zh);border-color:var(--zh-b);background:var(--zh-a)}
.lang-btn.planned{opacity:.45;cursor:default}
.lang-btn.planned:hover{color:var(--tx3);border-color:var(--bd);background:none}
/* Label spans: long on desktop, short on mobile */
.lb-long{display:inline}
.lb-short{display:none}

.t-sep{width:1px;height:22px;background:var(--bd);flex-shrink:0}

/* Barra de fases dinâmica */
.t-track{flex:1;display:flex;flex-direction:column;gap:4px;overflow:hidden;min-width:0}
.t-pips{display:flex;gap:3px;height:5px}
.t-pip{height:5px;border-radius:2px;transition:opacity .3s;flex:1}
.t-pip.dim{opacity:.18}
.t-labels{display:flex;justify-content:space-between}
.t-lbl{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--fs-2xs);color:var(--tx3);letter-spacing:.04em;white-space:nowrap}

.t-badge{
  font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--fs-xs);
  padding:4px 12px;border-radius:2px;white-space:nowrap;flex-shrink:0;
  border:1px solid var(--accent-b);background:var(--accent-a);color:var(--accent);
  transition:all .3s;
}

/* Hamburger */
.t-ham{display:none;align-items:center;justify-content:center;cursor:pointer;background:none;border:none;padding:6px;margin-left:auto;width:30px;height:30px}
.t-ham i{position:relative;display:block;width:18px;height:2px;background:var(--tx2);border-radius:1px;box-shadow:0 -6px 0 var(--tx2),0 6px 0 var(--tx2)}

/* Botão de tema claro/escuro */
.t-theme{
  display:flex;align-items:center;justify-content:center;
  width:32px;height:32px;flex-shrink:0;
  background:none;border:1px solid var(--bd);border-radius:var(--r2);
  color:var(--tx2);cursor:pointer;padding:0;
  transition:color .18s,border-color .18s,background .18s;
}
.t-theme:hover{color:var(--tx);border-color:var(--tx3);background:var(--s2)}
.t-theme svg{width:16px;height:16px}
.t-theme .ic-sun{display:none}
.t-theme .ic-moon{display:block}
[data-theme="light"] .t-theme .ic-sun{display:block}
[data-theme="light"] .t-theme .ic-moon{display:none}

/* ── SIDEBAR ─────────────────────────────────────────── */
#sidebar{
  flex:0 0 220px;background:var(--s0);border-right:1px solid var(--bd);
  overflow-y:auto;display:flex;flex-direction:column;padding:10px 0 20px;
  -webkit-overflow-scrolling:touch;
}
.s-sec{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--fs-2xs);letter-spacing:.14em;color:var(--tx3);text-transform:uppercase;padding:14px 16px 5px}
.s-item{
  display:flex;align-items:center;gap:10px;padding:9px 16px;
  background:none;border:none;width:100%;text-align:left;color:var(--tx2);
  font-family:'Inter',sans-serif;font-size:var(--fs-md);cursor:pointer;position:relative;
  transition:background .14s,color .14s;
}
.s-item:hover{background:var(--s2);color:var(--tx)}
.s-item.on{background:var(--s2);color:var(--tx)}
.s-item.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);border-radius:0 2px 2px 0;transition:background .3s}
.s-ico{width:15px;height:15px;opacity:.55;flex-shrink:0;transition:opacity .14s}
.s-item:hover .s-ico,.s-item.on .s-ico{opacity:1}

/* Idioma inativo na sidebar */
.sidebar-lang-label{
  font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--fs-2xs);letter-spacing:.1em;
  text-transform:uppercase;padding:3px 8px;border-radius:2px;border:1px solid;
  flex-shrink:0;margin-left:auto;
}

/* ── CONTENT ─────────────────────────────────────────── */
#content{flex:1;min-width:0;overflow-y:auto;background:var(--bg);padding:28px 32px 48px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.inner{max-width:820px}
.pg{display:none}
.pg.on{display:block;animation:fi .16s ease}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pg-h{margin-bottom:22px}
.pg-title{font-family:'Space Grotesk',sans-serif;font-size:var(--fs-2xl);font-weight:700;color:var(--tx);margin-bottom:3px}
.pg-sub{font-size:var(--fs-md);color:var(--tx2)}

/* ═══ CARDS ═══════════════════════════════════════════ */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:20px;margin-bottom:14px}
.card-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-title{font-family:'Space Grotesk',sans-serif;font-size:var(--fs-lg);font-weight:600;color:var(--tx)}
.card-sub{font-size:var(--fs-md);color:var(--tx2);margin-bottom:14px;line-height:1.55}

/* ═══ TAGS ════════════════════════════════════════════ */
.tag{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--fs-2xs);letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:2px;border:1px solid;flex-shrink:0}
.ta{color:var(--accent);border-color:var(--accent-b);background:var(--accent-a)}
.t1{color:var(--p1);border-color:var(--p1b);background:var(--p1a)}
.t2{color:var(--p2);border-color:var(--p2b);background:var(--p2a)}
.t3{color:var(--p3);border-color:var(--p3b);background:var(--p3a)}
.t4{color:var(--p4);border-color:var(--p4b);background:var(--p4a)}
.t5{color:var(--p5);border-color:var(--p5b);background:var(--p5a)}
.t6{color:var(--p6);border-color:var(--p6b);background:var(--p6a)}

/* ═══ GRIDS ═══════════════════════════════════════════ */
.g2{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px}
.g2>*{flex:1 1 calc(50% - 7px);min-width:0}
.g3{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.g3>*{flex:1 1 calc(33.333% - 8px);min-width:0}
.gn{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
@media(max-width:680px){.g2>*,.g3>*,.gn>*{flex:1 1 100%}}

/* ═══ STAT TILES ══════════════════════════════════════ */
.stat{background:var(--s2);border:1px solid var(--bd2);border-radius:var(--r);padding:16px;text-align:center}
.stat-v{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--fs-2xl);font-weight:700;color:var(--accent);margin-bottom:4px;line-height:1;transition:color .3s}
.stat-l{font-size:var(--fs-xs);color:var(--tx3);letter-spacing:.03em}

/* ═══ ITEM LISTS ══════════════════════════════════════ */
.ilist{list-style:none}
.ilist li{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd2);font-size:var(--fs-md);line-height:1.55}
.ilist li:last-child{border-bottom:none}
.dot{width:6px;height:6px;border-radius:50%;margin-top:6px;flex-shrink:0}
.da{background:var(--accent)}
.d1{background:var(--p1)}.d2{background:var(--p2)}.d3{background:var(--p3)}
.d4{background:var(--p4)}.d5{background:var(--p5)}.d6{background:var(--p6)}
.dg{background:var(--tx3)}

/* ═══ ALERT ═══════════════════════════════════════════ */
.alert{background:var(--accent-a);border:1px solid var(--accent-b);border-radius:var(--r2);padding:11px 15px;font-size:var(--fs-md);margin-bottom:14px;line-height:1.55;transition:background .3s,border-color .3s}
.alert strong{color:var(--accent);transition:color .3s}

/* ═══ ACCORDIONS ═══════════════════════════════════════ */
.acc{border:1px solid var(--bd);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.acc-head{display:flex;align-items:center;gap:12px;padding:13px 17px;cursor:pointer;user-select:none;background:var(--s1);transition:background .14s}
.acc-head:hover{background:var(--s2)}
.acc-num{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--fs-xs);font-weight:700;padding:3px 9px;border-radius:2px;flex-shrink:0}
.acc-name{font-family:'Space Grotesk',sans-serif;font-size:var(--fs-md);font-weight:600;flex:1}
.acc-meta{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--fs-xs);color:var(--tx3);white-space:nowrap}
.acc-chev{color:var(--tx3);font-size:var(--fs-xs);transition:transform .2s;flex-shrink:0}
.acc.open .acc-chev{transform:rotate(90deg)}
.acc-body{display:none;padding:0 17px 15px;background:var(--s0);border-top:1px solid var(--bd)}
.acc.open .acc-body{display:block}
.acc-desc{font-size:var(--fs-md);color:var(--tx2);margin:12px 0 10px;line-height:1.55}
.acc-marco{margin-top:12px;padding:10px 13px;border-radius:var(--r2);border:1px solid;font-size:var(--fs-sm);line-height:1.55}

/* Accordion phase colors aplicados via classe de fase */
.ph1 .acc-num{background:var(--p1a);color:var(--p1);border:1px solid var(--p1b)}
.ph2 .acc-num{background:var(--p2a);color:var(--p2);border:1px solid var(--p2b)}
.ph3 .acc-num{background:var(--p3a);color:var(--p3);border:1px solid var(--p3b)}
.ph4 .acc-num{background:var(--p4a);color:var(--p4);border:1px solid var(--p4b)}
.ph5 .acc-num{background:var(--p5a);color:var(--p5);border:1px solid var(--p5b)}
.ph6 .acc-num{background:var(--p6a);color:var(--p6);border:1px solid var(--p6b)}
.ph1 .acc-marco{border-color:var(--p1b);background:var(--p1a);color:var(--tx2)}.ph1 .acc-marco strong{color:var(--p1)}
.ph2 .acc-marco{border-color:var(--p2b);background:var(--p2a);color:var(--tx2)}.ph2 .acc-marco strong{color:var(--p2)}
.ph3 .acc-marco{border-color:var(--p3b);background:var(--p3a);color:var(--tx2)}.ph3 .acc-marco strong{color:var(--p3)}
.ph4 .acc-marco{border-color:var(--p4b);background:var(--p4a);color:var(--tx2)}.ph4 .acc-marco strong{color:var(--p4)}
.ph5 .acc-marco{border-color:var(--p5b);background:var(--p5a);color:var(--tx2)}.ph5 .acc-marco strong{color:var(--p5)}
.ph6 .acc-marco{border-color:var(--p6b);background:var(--p6a);color:var(--tx2)}.ph6 .acc-marco strong{color:var(--p6)}

/* ═══ ROTINAS ═════════════════════════════════════════ */
.rot{border:1px solid var(--bd);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.rot-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer}
.rot-head.rc{background:rgba(62,207,142,.08);border-bottom:1px solid rgba(62,207,142,.18)}
.rot-head.rp{background:rgba(232,197,71,.08);border-bottom:1px solid rgba(232,197,71,.18)}
.rot-head.rm{background:rgba(248,113,113,.08);border-bottom:1px solid rgba(248,113,113,.18)}
.rot-label{font-family:'Space Grotesk',sans-serif;font-size:var(--fs-md);font-weight:600}
.rot-head.rc .rot-label{color:var(--p3)}.rot-head.rp .rot-label{color:var(--p2)}.rot-head.rm .rot-label{color:var(--p4)}
.rot-meta{display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--fs-xs);color:var(--tx3)}
.rot-chev{font-size:var(--fs-xs);transition:transform .2s}
.rot.open .rot-chev{transform:rotate(90deg)}
.rot-body{display:none;padding:13px 15px;background:var(--s2)}
.rot.open .rot-body{display:block}

.trow{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd2);font-size:var(--fs-md);line-height:1.5;align-items:flex-start}
.trow:last-child{border-bottom:none}
.tslot{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--fs-2xs);color:var(--tx3);width:70px;flex-shrink:0;padding-top:3px;letter-spacing:.06em;text-transform:uppercase}
.tpill{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--fs-2xs);padding:2px 7px;border-radius:2px;flex-shrink:0;height:fit-content;margin-top:2px}
.tp-at{background:var(--p1a);color:var(--p1)}.tp-dr{background:var(--p2a);color:var(--p2)}
.tp-or{background:var(--p3a);color:var(--p3)}.tp-au{background:var(--p5a);color:var(--p5)}
.tp-lv{background:rgba(72,72,96,.25);color:var(--tx3)}.tp-rv{background:var(--p4a);color:var(--p4)}
.tp-sk{background:var(--p6a);color:var(--p6)}

/* ═══ PROTOCOLO STEPS ════════════════════════════════ */
.steps{counter-reset:s}
.step{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--bd2);counter-increment:s}
.step:last-child{border-bottom:none}
.step-n{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--fs-md);font-weight:700;color:var(--accent);width:20px;flex-shrink:0;transition:color .3s}
.step-n::before{content:counter(s)}
.step-title{font-family:'Space Grotesk',sans-serif;font-size:var(--fs-md);font-weight:600;margin-bottom:2px}
.step-desc{font-size:var(--fs-sm);color:var(--tx2);line-height:1.5}

/* ═══ CHECKIN FORM ═══════════════════════════════════ */
.fg{display:flex;flex-direction:column;gap:6px}
.fg label{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--fs-2xs);letter-spacing:.1em;color:var(--tx3);text-transform:uppercase}
.frow{display:flex;flex-wrap:wrap;gap:14px}
.frow>*{flex:1 1 calc(50% - 7px);min-width:0}
@media(max-width:580px){.frow>*{flex:1 1 100%}}

input[type="number"],input[type="text"],input[type="password"],select,textarea{
  width:100%;background:var(--s2);border:1px solid var(--bd);color:var(--tx);
  font-family:'Inter',sans-serif;font-size:var(--fs-md);padding:9px 12px;
  border-radius:var(--r2);outline:none;transition:border-color .18s;
  -webkit-appearance:none;appearance:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:68px}
select option{background:var(--s2)}

.rng-wrap{display:flex;align-items:center;gap:12px;min-height:16px}
input[type="range"]{
  flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;
  border:none;padding:0;margin:0;cursor:pointer;display:block;
  background:linear-gradient(var(--accent),var(--accent)) no-repeat var(--bd);
  background-size:40% 100%;transition:background-color .3s;
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;background:var(--accent);
  border-radius:50%;cursor:pointer;box-shadow:0 0 0 3px var(--accent-a);
}
input[type="range"]::-moz-range-thumb{
  width:16px;height:16px;background:var(--accent);border-radius:50%;border:none;cursor:pointer;
}

.fcard{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.fcard-head{display:flex;align-items:center;gap:10px;padding:11px 17px;border-bottom:1px solid var(--bd);background:var(--s0)}
.fcard-title{font-family:'Space Grotesk',sans-serif;font-size:var(--fs-md);font-weight:600}
.fcard-body{padding:15px 17px;display:flex;flex-direction:column;gap:13px}

/* ═══ BUTTONS ════════════════════════════════════════ */
.btns{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.btn{font-family:'Space Grotesk',sans-serif;font-size:var(--fs-md);font-weight:600;padding:10px 20px;border:none;border-radius:var(--r2);cursor:pointer;transition:all .15s;letter-spacing:.03em}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.btn-p{background:var(--accent);color:#0c0c10;transition:background .3s}
.btn-p:hover{filter:brightness(1.12)}
.btn-g{background:none;border:1px solid var(--bd);color:var(--tx2)}
.btn-g:hover{border-color:var(--tx2);color:var(--tx)}

/* ═══ ANÁLISE OUTPUT ════════════════════════════════ */
#analysis-out{display:none;margin-top:14px;background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
#analysis-out.vis{display:block}
.ao-sec{padding:14px 17px;border-bottom:1px solid var(--bd2);font-size:var(--fs-md);line-height:1.72}
.ao-sec:last-child{border-bottom:none}
.ao-lbl{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--fs-2xs);letter-spacing:.12em;color:var(--accent);text-transform:uppercase;margin-bottom:6px;transition:color .3s}
.ao-txt{white-space:pre-line}
.btn-xs{padding:5px 9px;font-size:var(--fs-2xs)}
.hist-acoes{white-space:nowrap}
.hist-acoes .btn + .btn{margin-left:6px}
.ao-loading{padding:20px 17px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--fs-sm);color:var(--tx3)}
.ao-loading::after{content:'';animation:ell 1.4s infinite}
@keyframes ell{0%{content:'.'}34%{content:'..'}67%{content:'...'}}

/* ═══ TABLE ══════════════════════════════════════════ */
.ev-table{width:100%;border-collapse:collapse;font-size:var(--fs-md)}
.ev-table th{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--fs-2xs);letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);padding:9px 13px;border-bottom:1px solid var(--bd);text-align:left}
.ev-table td{padding:10px 13px;border-bottom:1px solid var(--bd2)}
.ev-table tr:last-child td{border-bottom:none}
.ev-table tr:hover td{background:var(--s2)}
.ev-pill{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--fs-2xs);padding:3px 8px;border-radius:2px}
.ev-pend{color:var(--tx3);background:rgba(72,72,96,.2)}
.ev-done{color:var(--p3);background:var(--p3a)}

/* ═══ TIMELINE ═══════════════════════════════════════ */
.tl{position:relative;padding-left:26px}
.tl::before{content:'';position:absolute;left:8px;top:8px;bottom:8px;width:1px;background:var(--bd)}
.tl-item{position:relative;display:flex;gap:16px;align-items:flex-start;margin-bottom:20px}
.tl-item:last-child{margin-bottom:0}
.tl-dot{position:absolute;left:-22px;top:5px;width:9px;height:9px;border-radius:50%;border:2px solid var(--bg);flex-shrink:0}
.tl-day{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--fs-2xl);font-weight:700;line-height:1;min-width:58px;padding-top:2px;flex-shrink:0}
.tl-h{font-family:'Space Grotesk',sans-serif;font-size:var(--fs-md);font-weight:600;margin-bottom:2px}
.tl-p{font-size:var(--fs-sm);color:var(--tx2);line-height:1.5}

/* ═══ METRICS BAR ════════════════════════════════════ */
.mrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd2)}
.mrow:last-child{border-bottom:none}
.mrow-lbl{font-size:var(--fs-md);min-width:200px}
.mrow-lbl small{display:block;font-size:var(--fs-xs);color:var(--tx3);margin-top:1px}
.mrow-track{flex:1;height:4px;background:var(--bd);border-radius:2px;overflow:hidden}
.mrow-fill{height:100%;border-radius:2px}
.mrow-target{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--fs-xs);color:var(--tx3);white-space:nowrap}

/* ═══ TOAST ══════════════════════════════════════════ */
#toast{position:fixed;bottom:24px;right:24px;background:var(--s3);border:1px solid var(--bd);color:var(--tx);font-size:var(--fs-md);padding:10px 16px;border-radius:var(--r2);opacity:0;transform:translateY(10px);transition:all .24s;z-index:999;pointer-events:none;max-width:280px}
#toast.show{opacity:1;transform:none}
#toast.ok{border-left:3px solid var(--p3)}
#toast.err{border-left:3px solid var(--p4)}

/* ═══ MISC ═══════════════════════════════════════════ */
.divider{height:1px;background:var(--bd);margin:18px 0}
.planned-banner{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:40px 24px;text-align:center}
.planned-banner h2{font-family:'Space Grotesk',sans-serif;font-size:var(--fs-xl);font-weight:600;margin-bottom:8px}
.planned-banner p{font-size:var(--fs-md);color:var(--tx2);line-height:1.6}
.planned-icon{font-size:var(--fs-display);margin-bottom:16px}

/* ═══ MOBILE ═════════════════════════════════════════ */
@media(max-width:768px){
  /* Sidebar como overlay deslizante */
  #sidebar{
    position:fixed;left:0;top:56px;bottom:0;width:220px;
    z-index:40;transform:translateX(-100%);
    transition:transform .24s;border-right:1px solid var(--bd);
  }
  #sidebar.open{transform:none;box-shadow:8px 0 32px rgba(0,0,0,.5)}

  /* Topbar: esconder elementos pesados, mostrar só lang + badge + ham */
  .t-ham{display:flex}
  .t-track{display:none}
  .t-sep{display:none}

  /* Botões de idioma viram só sigla */
  .lb-long{display:none}
  .lb-short{display:inline}
  .lang-btn{padding:5px 8px;font-size:var(--fs-xs);letter-spacing:.04em}

  /* Badge compacto */
  .t-badge{font-size:var(--fs-xs);padding:4px 8px}

  /* Conteúdo */
  #content{padding:16px 14px 56px}

  /* Tipografia responsiva */
  .pg-title{font-size:var(--fs-xl)}
  .acc-name{font-size:var(--fs-md)}
  .acc-meta{display:none} /* esconde "D1-120 · 4 ciclos" em telas < 768 */
  .tl{padding-left:20px}
  .tl-day{font-size:var(--fs-xl);min-width:44px}
  .mrow-lbl{min-width:120px}
  .mrow-lbl strong{font-size:var(--fs-sm)}
  .mrow-lbl small{font-size:var(--fs-xs)}
  .card{padding:14px}
  .fcard-body{padding:13px 14px}
}

/* Telas muito pequenas (iPhone SE, 375px) */
@media(max-width:400px){
  #topbar{padding:0 10px;gap:6px}
  .lang-btn{padding:4px 6px;font-size:var(--fs-2xs)}
  .t-badge{font-size:var(--fs-2xs);padding:3px 7px}
  .card{padding:12px}
  .ilist li{font-size:var(--fs-sm)}
  .trow{font-size:var(--fs-sm)}
  .step-title{font-size:var(--fs-sm)}
  .step-desc{font-size:var(--fs-xs)}
}


/* ═══════════════════════════════════════════════════════
   POLIMENTO UX/UI
═══════════════════════════════════════════════════════ */

/* ── Transição suave ao trocar de tema ─────────────── */
body, #topbar, #sidebar, #content,
.card, .fcard, .acc, .acc-head, .acc-body,
.rot, .rot-body, .stat, .alert, #analysis-out,
input, select, textarea, .btn, .tag, .ev-table td, .ev-table th {
  transition: background-color .22s ease, border-color .22s ease, color .22s ease;
}

/* ── Seleção de texto ──────────────────────────────── */
::selection { background: var(--accent-b); color: var(--tx); }

/* ── Foco visível (teclado) sem poluir o clique ────── */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r2);
}
input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-a);
}

/* ── Remove flash azul no toque (mobile) ───────────── */
a, button, .acc-head, .rot-head, .s-item, .lang-btn {
  -webkit-tap-highlight-color: transparent;
}

/* ── Backdrop do menu lateral (mobile) ─────────────── */
#backdrop {
  position: fixed; inset: 56px 0 0 0;
  background: rgba(0,0,0,.5);
  opacity: 0; pointer-events: none;
  transition: opacity .24s ease;
  z-index: 35;
}
#backdrop.show { opacity: 1; pointer-events: auto; }
@media(min-width:769px){ #backdrop{ display:none; } }

/* ── Feedback de toque nos itens interativos ───────── */
.s-item:active, .acc-head:active, .rot-head:active { opacity: .75; }

/* ── Estado desabilitado mais claro ────────────────── */
.btn:disabled { filter: grayscale(.4); }

/* ── Scroll suave dentro do conteúdo ───────────────── */
#content { scroll-behavior: smooth; }

/* ── Cartões: leve realce ao passar o mouse ────────── */
@media(hover:hover){
  .card:hover, .fcard:hover { border-color: var(--bd); }
  .acc-head:hover .acc-chev, .rot-head:hover .rot-chev { color: var(--accent); }
}

/* ── Área de toque mínima 44px no mobile ───────────── */
@media(max-width:768px){
  .s-item      { padding: 12px 16px; min-height: 44px; }
  .lang-btn    { min-height: 34px; }
  .t-theme     { width: 34px; height: 34px; }
  .t-ham       { width: 40px; height: 40px; }
  .btn         { min-height: 44px; padding: 11px 18px; }
  .acc-head    { min-height: 52px; }
  .rot-head    { min-height: 48px; }
  input, select, textarea { font-size:16px; } /* iOS exige ≥16px para não dar zoom ao focar — manter literal */
}

/* ── Tabelas roláveis em telas estreitas ───────────── */
@media(max-width:600px){
  .card > .ev-table,
  .card table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; white-space: nowrap; }
}

/* ── Impressão ─────────────────────────────────────── */
@media print{
  #topbar, #sidebar, #backdrop, .btns, .t-theme, .t-ham { display: none !important; }
  #content { overflow: visible; padding: 0; }
  body { overflow: visible; height: auto; background: #fff; color: #000; }
}


/* ═══════════════════════════════════════════════════════
   IDENTIDADE — MISSION CONTROL
   Malha, réguas, cantos técnicos e instrumentação.
═══════════════════════════════════════════════════════ */

/* ── Malha de fundo: papel milimetrado do console ─── */
#content{
  background-color: var(--bg);
  background-image:
    repeating-linear-gradient(to bottom,
      var(--grid), var(--grid) 1px, transparent 1px, transparent 34px),
    repeating-linear-gradient(to right,
      var(--grid), var(--grid) 1px, transparent 1px, transparent 34px);
  background-position: 0 0;
}

/* ── Régua fina sob a topbar ───────────────────────── */
#topbar{ border-bottom:1px solid var(--bd); position:relative; }
#topbar::after{
  content:''; position:absolute; left:0; right:0; bottom:-3px; height:2px;
  background:repeating-linear-gradient(90deg,
    var(--rule) 0 1px, transparent 1px 8px);
  pointer-events:none;
}

/* ── Painéis com cantos técnicos ───────────────────── */
.card, .fcard, .acc, .rot, #analysis-out{
  position:relative;
  background-image:linear-gradient(180deg, rgba(255,255,255,.012), transparent 40%);
}
.card::before, .fcard::before, #analysis-out::before,
.card::after,  .fcard::after,  #analysis-out::after{
  content:''; position:absolute; width:7px; height:7px;
  border-color:var(--accent); opacity:.55; pointer-events:none;
  transition:border-color .3s;
}
.card::before, .fcard::before, #analysis-out::before{
  top:-1px; left:-1px; border-top:1.5px solid; border-left:1.5px solid;
}
.card::after, .fcard::after, #analysis-out::after{
  bottom:-1px; right:-1px; border-bottom:1.5px solid; border-right:1.5px solid;
}

/* ── Cabeçalho de seção da sidebar: régua inline ──── */
.s-sec{
  display:flex; align-items:center; gap:8px;
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:var(--fs-2xs); font-weight:600; letter-spacing:.18em;
}
.s-sec::after{
  content:''; flex:1; height:1px;
  background:repeating-linear-gradient(90deg, var(--rule) 0 2px, transparent 2px 5px);
}

/* ── Item de navegação: marcador de instrumento ───── */
.s-item{ font-family:'JetBrains Mono',ui-monospace,monospace; font-size:var(--fs-sm); letter-spacing:.02em; }
.s-item.on::before{ width:3px; background:var(--accent); }
.s-item.on::after{
  content:'▸'; margin-left:auto; color:var(--accent);
  font-size:var(--fs-xs); opacity:.8;
}

/* ── Contador de dia: mostrador do painel ─────────── */
.t-badge{
  font-weight:600; letter-spacing:.08em;
  border-width:1px; position:relative;
}
.t-badge::before{
  content:''; position:absolute; left:5px; top:50%; transform:translateY(-50%);
  width:4px; height:4px; border-radius:50%;
  background:var(--accent); box-shadow:0 0 5px var(--accent);
  animation:pulse 2.6s ease-in-out infinite;
}
.t-badge{ padding-left:15px; }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
@media(prefers-reduced-motion:reduce){ .t-badge::before{animation:none} }

/* ── Números grandes: leitura de telemetria ──────── */
.stat-v{
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-weight:700; letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;
}
.stat{ position:relative; border-left:2px solid var(--accent); }
.stat-l{
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:var(--fs-2xs); letter-spacing:.11em; text-transform:uppercase;
}

/* ── Títulos de página: prefixo de sistema ────────── */
.pg-title{ position:relative; padding-left:18px; letter-spacing:-.01em; }
.pg-title::before{
  content:'▚'; position:absolute; left:0; top:1px;
  color:var(--accent); font-size:var(--fs-md); opacity:.85;
}
.pg-sub{
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:var(--fs-xs); letter-spacing:.02em;
}

/* ── Título de painel ──────────────────────────────── */
.card-title, .fcard-title{ letter-spacing:.01em; }

/* ── Etiquetas: colchetes de instrumentação ───────── */
.tag{ font-weight:600; letter-spacing:.13em; border-radius:1px; }

/* ── Fase: numeração tabular ───────────────────────── */
.acc-num{ font-variant-numeric:tabular-nums; border-radius:1px; }
.acc-meta{ font-variant-numeric:tabular-nums; letter-spacing:.05em; }

/* ── Tabelas: leitura de log ───────────────────────── */
.ev-table th{ font-weight:600; letter-spacing:.13em; }
.ev-table td{ font-variant-numeric:tabular-nums; }
.ev-pill{ border-radius:1px; letter-spacing:.06em; }

/* ── Barras de métrica: escala graduada ───────────── */
.mrow-track{ position:relative; border-radius:0; }
.mrow-track::after{
  content:''; position:absolute; inset:0;
  background:repeating-linear-gradient(90deg,
    transparent 0 calc(25% - 1px), var(--rule) calc(25% - 1px) 25%);
  pointer-events:none;
}
.mrow-fill{ border-radius:0; }
.mrow-target{ font-variant-numeric:tabular-nums; letter-spacing:.04em; }

/* ── Timeline: eixo de missão ─────────────────────── */
.tl-day{ font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
.tl-dot{ border-radius:1px; transform:rotate(45deg); }

/* ── Blocos de rotina ──────────────────────────────── */
.tslot{ font-weight:600; letter-spacing:.1em; }
.tpill{ border-radius:1px; font-weight:600; letter-spacing:.05em; }

/* ── Protocolo: passos numerados ──────────────────── */
.step-n{
  font-variant-numeric:tabular-nums;
  position:relative;
}
.step-n::after{
  content:''; position:absolute; left:0; bottom:-3px; width:11px; height:1px;
  background:var(--accent); opacity:.5;
}

/* ── Saída da análise: cabeçalho de relatório ─────── */
.ao-lbl{ font-weight:600; letter-spacing:.16em; }
.ao-sec{ position:relative; }
.ao-sec::before{
  content:''; position:absolute; left:0; top:14px; width:2px; height:9px;
  background:var(--accent); opacity:.6;
}
.ao-sec{ padding-left:20px; }

/* ── Botões: comandos ─────────────────────────────── */
.btn{
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:var(--fs-sm); font-weight:600; letter-spacing:.07em;
  text-transform:uppercase; border-radius:1px;
}

/* ── Campos de formulário ─────────────────────────── */
.fg label{ font-weight:600; letter-spacing:.12em; }
input[type="number"], input[type="text"], input[type="password"], select{
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-variant-numeric:tabular-nums;
  border-radius:1px;
}
textarea{ border-radius:1px; }

/* ── Seletor de idioma: chaves de canal ───────────── */
.lang-btn{ font-weight:600; border-radius:1px; }

/* ── Alerta: faixa de aviso ───────────────────────── */
.alert{
  border-radius:1px; border-left-width:2px;
  position:relative; padding-left:16px;
}

/* ── Botão de tema ────────────────────────────────── */
.t-theme{ border-radius:1px; }

/* ── Toast: mensagem de sistema ───────────────────── */
#toast{
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:var(--fs-sm); letter-spacing:.03em; border-radius:1px;
}


/* ═══════════════════════════════════════════════════════
   BOTTOM NAV — mobile
═══════════════════════════════════════════════════════ */
#bottom-nav{
  display:none; position:fixed; left:0; right:0; bottom:0; z-index:45;
  height:calc(58px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--s1); border-top:1px solid var(--bd);
  box-shadow:0 -4px 20px rgba(0,0,0,.25);
}
[data-theme="light"] #bottom-nav{ box-shadow:0 -2px 12px rgba(22,22,42,.08); }
.bn-item{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  background:none; border:none; color:var(--tx3); cursor:pointer; padding:6px 4px 4px;
  font-family:'JetBrains Mono',ui-monospace,monospace; font-size:var(--fs-2xs); letter-spacing:.06em;
  text-transform:uppercase; transition:color .15s; position:relative;
  -webkit-tap-highlight-color:transparent; min-height:52px;
}
.bn-item svg{ width:20px; height:20px; }
.bn-item.on{ color:var(--accent); }
.bn-item.on::before{
  content:''; position:absolute; top:0; left:20%; right:20%; height:2px;
  background:var(--accent); box-shadow:0 0 6px var(--accent);
}
.bn-item:active{ opacity:.7; }

@media(max-width:768px){
  #bottom-nav{ display:flex; }
  #content{ padding-bottom:calc(58px + 24px + env(safe-area-inset-bottom)) !important; }
  #sidebar{ bottom:calc(58px + env(safe-area-inset-bottom)); }
  #backdrop{ bottom:calc(58px + env(safe-area-inset-bottom)); }
  /* hambúrguer do topo vira redundante: esconde */
  .t-ham{ display:none !important; }
  /* toast sobe acima da barra */
  #toast{ bottom:calc(70px + env(safe-area-inset-bottom)); }
}

/* ── Indicador de rascunho ──────────────────────────── */
#draft-indicator{
  display:none; align-items:center; gap:6px;
  font-family:'JetBrains Mono',ui-monospace,monospace; font-size:var(--fs-xs);
  letter-spacing:.08em; color:var(--tx3); text-transform:uppercase;
}
#draft-indicator::before{
  content:''; width:6px; height:6px; border-radius:50%;
  background:var(--p2); animation:pulse 2s ease-in-out infinite;
}

/* ── Botão perigoso (confirmação) ──────────────────── */
.btn-danger{ background:var(--p4) !important; color:#fff !important; border-color:var(--p4) !important; }

/* ── Modo rápido do check-in ───────────────────────── */
.ci-detalhes{ transition:opacity .2s; }
body.ci-rapido .ci-detalhes{ display:none; }
.ci-rapido-toggle{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:10px 14px; margin-bottom:10px;
  background:var(--s2); border:1px solid var(--bd); border-radius:var(--r2);
  font-family:'JetBrains Mono',ui-monospace,monospace; font-size:var(--fs-xs); letter-spacing:.04em;
  cursor:pointer; user-select:none;
}
.ci-rapido-toggle strong{ color:var(--accent); }
.ci-rapido-toggle .sw{
  width:36px; height:20px; border-radius:10px; background:var(--bd); position:relative; flex-shrink:0;
  transition:background .2s;
}
.ci-rapido-toggle .sw::after{
  content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
  background:var(--tx2); transition:transform .2s, background .2s;
}
body.ci-rapido .ci-rapido-toggle .sw{ background:var(--accent); }
body.ci-rapido .ci-rapido-toggle .sw::after{ transform:translateX(16px); background:#0c0c10; }

/* ── Atalhos: dica discreta no desktop ─────────────── */
kbd{
  font-family:'JetBrains Mono',ui-monospace,monospace; font-size:var(--fs-xs);
  padding:1px 5px; border:1px solid var(--bd); border-bottom-width:2px;
  border-radius:2px; background:var(--s2); color:var(--tx2);
}
.kbd-hint{ margin-left:auto; opacity:.5; }
@media(max-width:768px){ .kbd-hint{ display:none; } }

/* ═══ TABLET (769–1024px) ════════════════════════════ */
@media(min-width:769px) and (max-width:1024px){
  #sidebar{flex:0 0 190px}
  #content{padding:20px 20px 40px}
  .inner{max-width:100%}
  .mrow-lbl{min-width:160px}
  .acc-meta{font-size:var(--fs-2xs)}
}

/* ═══ SAFE AREA (notch / home bar) ══════════════════ */
@supports(padding-bottom:env(safe-area-inset-bottom)){
  #content{padding-bottom:calc(48px + env(safe-area-inset-bottom))}
}
@supports(padding-bottom:env(safe-area-inset-bottom)){
  @media(max-width:768px){
    #content{padding-bottom:calc(56px + env(safe-area-inset-bottom))}
    #topbar{padding-left:max(14px, env(safe-area-inset-left));padding-right:max(14px, env(safe-area-inset-right))}
  }
}

/* ═══ PREVENT HORIZONTAL SCROLL ═════════════════════ */
html,body{max-width:100%;overflow-x:hidden}
#app,#shell-body,#content,#topbar{max-width:100%}
/* Roteiro semanal */
.im-route #app { height: 100vh; height: 100dvh; }
.im-route .lang-btn.planned { opacity: 1; cursor: pointer; color: var(--tx2); }
.im-layout { display: grid; gap: 12px; max-width: 820px; font-size: 14px; line-height: 1.55; }
.im-layout [hidden] { display: none !important; }
.im-layout :is(h1, h2, h3, p, ul, ol, dl, dd) { margin: 0; }
.im-layout p { overflow-wrap: anywhere; }
.im-layout :is(a, button, input, select, textarea, summary):focus-visible { outline: 2px solid var(--tx); outline-offset: 2px; }
.im-layout :is([role="tabpanel"], h2, h3, button, input) { scroll-margin-top: 58px; }
.im-layout a { color: var(--tx); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; font-weight: 600; }
.im-layout a:hover { text-decoration-thickness: 2px; }
.im-kicker, .im-progress-label, .im-progress-foot, .im-task-time, .im-rail-info, .im-session-time {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: .025em;
  color: var(--tx2);
}
.im-layout .im-kicker { text-transform: uppercase; margin-bottom: 4px; }
.im-muted { color: var(--tx2); }
.im-hero {
  display: grid; grid-template-columns: 1fr minmax(275px, 1fr); align-items: center; gap: 16px;
  padding: clamp(12px, 2.5vw, 22px); border: 1px solid var(--bd); border-top: 2px solid var(--accent);
  background: linear-gradient(120deg, var(--accent-a), var(--s1) 68%); border-radius: var(--r);
}
.im-hero h1 { font: 700 clamp(24px, 4vw, 34px)/1.07 'Space Grotesk', system-ui, sans-serif; letter-spacing: -.035em; }
.im-progress { min-width: 0; padding: 8px 10px; background: var(--s0); border: 1px solid var(--bd); }
.im-progress-label, .im-progress-foot { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 2px 8px; }
.im-progress-label strong { font-size: 17px; color: var(--tx); }
.im-progress progress { display: block; width: 100%; height: 5px; margin: 5px 0; appearance: none; accent-color: var(--accent); border: 0; background: var(--s3); }
.im-progress progress::-webkit-progress-bar { background: var(--s3); }
.im-progress progress::-webkit-progress-value { background: var(--accent); }
.im-progress progress::-moz-progress-bar { background: var(--accent); }
.im-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; position: sticky; top: 0; z-index: 3; background: var(--s0); padding: 3px; border: 1px solid var(--bd); }
.im-tabs button {
  min-width: 0; min-height: 44px; padding: 4px; border: 1px solid transparent;
  background: transparent; color: var(--tx); cursor: pointer; font: 600 13px/1.2 system-ui, sans-serif;
}
.im-tabs button[aria-selected="true"] { background: var(--accent-a); border-bottom: 2px solid var(--accent); }
.im-tabs button:focus-visible { outline-offset: -3px; }
.im-pane { display: grid; gap: 10px; min-width: 0; }
.im-actions, .im-subnav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.im-subnav { justify-content: space-between; }
.im-subnav .im-actions { flex: 1; justify-content: end; }
.im-panel { min-width: 0; border: 1px solid var(--bd); border-radius: var(--r); background: var(--s1); }
.im-panel-content, .im-week, .im-session { padding: clamp(10px, 2.25vw, 16px); }
.im-panel > h2 { padding: 10px clamp(10px, 2.25vw, 16px); border-bottom: 1px solid var(--bd); font-size: 18px; }
.im-heading-meta { color: var(--tx2); font-size: 12px; font-weight: 400; }
.im-panel > summary { padding: 10px clamp(10px, 2.25vw, 16px); font-weight: 700; }
.im-panel[open] > summary { border-bottom: 1px solid var(--bd); }
.im-panel-content, .im-vocab-groups, .im-barrel-folders { display: grid; gap: 10px; }
.im-week-nav { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; margin-bottom: 9px; }
.im-layout select, .im-layout input, .im-layout textarea {
  width: 100%; min-width: 0; min-height: 42px; padding: 7px 9px; color: var(--tx);
  background: var(--s0); border: 1px solid var(--bd); border-radius: var(--r); font: inherit;
}
.im-button, .im-text-button {
  cursor: pointer; min-height: 44px; padding: 6px 9px; font: 600 13px/1.25 system-ui, sans-serif;
  color: var(--tx); background: var(--s2); border: 1px solid var(--bd); border-radius: var(--r);
}
.im-button:hover:not(:disabled, [aria-disabled="true"]) { border-color: var(--accent); }
.im-button:disabled { cursor: default; opacity: .5; }
.im-button[aria-disabled="true"] { cursor: default; color: var(--tx2); }
.im-primary, .im-button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-a); }
.im-text-button { background: transparent; border: 0; padding-inline: 0; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.im-week-title, .im-session-top { display: flex; align-items: center; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; }
.im-week-title h2, .im-session-top h3 { font: 700 clamp(18px, 3vw, 23px)/1.18 'Space Grotesk', system-ui, sans-serif; }
.im-week-title label { display: flex; align-items: center; gap: 5px; color: var(--tx2); font-size: 12px; }
.im-week-title select { width: auto; min-height: 38px; }
.im-rail-info { margin: 8px 0 4px; }
.im-day-rail { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; }
.im-day-chip { display: flex; align-items: center; gap: 3px; justify-content: center; padding: 3px; }
.im-chip-status { color: var(--tx2); }
.im-chip-done .im-chip-status { color: var(--tx); }
.im-brief { margin-top: 8px; }
.im-brief-content { display: grid; gap: 7px; border-top: 1px solid var(--bd); padding: 10px; }
.im-session-top { margin-bottom: 6px; }
.im-session-time { white-space: nowrap; background: var(--s2); padding: 4px 7px; }
.im-tasks, .im-items, .im-word-list, .im-resources, .im-day-words ul { list-style: none; padding: 0; }
.im-tasks li { display: grid; grid-template-columns: 47px minmax(0, 1fr); gap: 6px; border-top: 1px solid var(--bd2); padding: 8px 0; }
.im-tasks p { margin-top: 2px; }
.im-task-actions { margin-top: 3px; }
.im-session-footer { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.im-session-footer > .im-button { flex: 1 1 155px; }
.im-complete-done { border-color: var(--p3); }
.im-subpanel { min-width: 0; border: 1px solid var(--bd); background: var(--s0); }
.im-layout summary { cursor: pointer; }
.im-subpanel > summary { display: list-item; padding: 8px 10px; font-weight: 600; min-height: 40px; }
.im-subpanel > :is(ul, p, .im-reading) { border-top: 1px solid var(--bd); padding: 8px 10px; }
.im-reading { display: grid; gap: 6px; }
.im-items li, .im-word-list li, .im-resources li { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; }
.im-items li + li, .im-word-list li + li, .im-resources li + li { border-top: 1px solid var(--bd2); }
.im-items li > div:first-child, .im-word-list li > div, .im-resources li > div { min-width: 0; overflow-wrap: anywhere; }
.im-items li small, .im-word-list li small { display: block; color: var(--tx2); }
.im-core { display: inline-block; font-size: 10px; margin-left: 3px; padding: 0 4px; background: var(--accent-a); }
.im-day-words li + li { margin-top: 4px; }
.im-form { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
.im-form label { display: grid; align-content: start; gap: 3px; }
.im-form :is(h3, fieldset, label:has(textarea), .im-actions) { grid-column: 1 / -1; }
.im-edit-form { border-top: 1px solid var(--bd); padding-top: 8px; }
.im-minute-fields { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 6px; padding: 7px; border: 1px solid var(--bd); }
.im-minute-fields legend { padding: 0 4px; }
/* ── Leitor de texto ── */
.lt { display: grid; gap: 10px; margin: 8px 0 4px; }
.lt-ajustes { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.lt-campo { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--tx2); }
.lt-campo select { max-width: min(260px, 60vw); }
.lt-check { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--tx2); cursor: pointer; }
/* A caixinha não herda o tamanho dos campos de texto da Imersão */
.im-layout .lt-check input[type="checkbox"] { width: 20px; height: 20px; min-height: 0; padding: 0; flex-shrink: 0; accent-color: var(--accent); }
.lt-status { font-size: var(--fs-sm); color: var(--tx2); min-height: 1.5em; margin: 0; }
.lt-frase { cursor: pointer; border-radius: 3px; padding: 1px 2px; margin: 0 -2px; transition: background-color .15s, box-shadow .15s; }
.lt-frase:hover { background: var(--accent-a); }
.lt-frase:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.lt-frase.lt-atual { background: var(--accent-b); color: var(--tx); box-shadow: 0 0 0 2px var(--accent-b); }
.lt-dica { font-size: var(--fs-xs); }
.lt-botoes { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }
.lt-ouvir { min-width: 44px; }
@media (prefers-reduced-motion: reduce) { .lt-frase { transition: none; } }
.im-flash { display: grid; gap: 8px; justify-items: start; border: 1px solid var(--bd); padding: 9px; margin-top: 6px; background: var(--s0); overflow-wrap: anywhere; }
.im-flash p { white-space: pre-wrap; }
.im-method-list { display: grid; gap: 8px; }
.im-method-list dt { font-weight: 700; }
.im-sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.im-copy-dialog { width: min(560px, 92vw); margin: auto; padding: 16px; color: var(--tx); background: var(--s1); border: 1px solid var(--bd); }
.im-copy-dialog::backdrop { background: rgba(0,0,0,.65); }
.im-copy-dialog textarea { display: block; margin: 8px 0; }
@media (max-width: 600px) {
  .im-layout { gap: 8px; }
  .im-hero, .im-form { grid-template-columns: minmax(0,1fr); }
  .im-hero { gap: 6px; }
  .im-hero-title { display: flex; align-items: baseline; flex-wrap: wrap-reverse; flex-direction: row-reverse; justify-content: space-between; gap: 2px 8px; }
  .im-hero-title .im-kicker { margin: 0; }
  .im-minute-fields { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .im-subnav .im-actions { min-width: 100%; justify-content: start; }
}
@media (max-width: 420px) {
  .im-tabs button { font-size: 12px; }
  .im-day-rail { gap: 3px; }
  .im-day-chip { gap: 1px; font-size: 11px; }
  .im-items li { flex-wrap: wrap; }
}


/* ═══════════════════════════════════════════════════════
   MODO VIAGEM (V0) — mapa, trechos e passaporte
═══════════════════════════════════════════════════════ */
.jn-vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
#toast.jn{border-left-color:var(--es)}
.t-track.jn{padding:2px 0 0 1px}
.t-track.jn .t-pip{position:relative}
.t-track.jn .t-pip::before{content:'';position:absolute;left:-1px;top:50%;width:9px;height:9px;border-radius:50%;background:inherit;transform:translateY(-50%)}
.t-track.jn .t-lbl.on{color:var(--accent)}
.jn-guia{display:flex;gap:12px;align-items:flex-start;background:var(--s2);border:1px solid var(--bd2);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.jn-guia-av{width:32px;height:32px;border-radius:50%;border:1px solid var(--accent-b);background:var(--accent-a);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.jn-guia-av svg{width:17px;height:17px}
.jn-guia p{margin:0;font-size:var(--fs-md);line-height:1.55;color:var(--tx)}
.jn-guia small{display:block;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--fs-2xs);letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);margin-bottom:2px}
.jn-linha{list-style:none;margin:4px 0 0;padding:0}
.jn-est{position:relative;margin-left:8px;padding:0 0 20px 22px;border-left:3px solid var(--fc)}
.jn-est:last-child{padding-bottom:2px;border-left-color:transparent}
.jn-est::before{content:'';position:absolute;left:-10px;top:2px;width:17px;height:17px;box-sizing:border-box;border-radius:50%;border:3px solid var(--fc);background:var(--s1)}
.jn-est.jn-aqui::before{background:var(--fc)}
.jn-est.jn-futura{border-left-style:dashed}
.jn-est.jn-futura .jn-est-head,.jn-est.jn-futura .jn-trechos{opacity:.5}
.jn-est-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.jn-est-cod{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--fs-xs);letter-spacing:.1em;color:var(--fc)}
.jn-est-nome{font-family:'Space Grotesk',sans-serif;font-size:var(--fs-lg);font-weight:600;color:var(--tx)}
.jn-est-fase{font-size:var(--fs-sm);color:var(--tx2)}
.jn-est-aqui{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--fs-2xs);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent-b);background:var(--accent-a);padding:2px 6px;border-radius:2px}
.jn-est-resumo{margin-left:auto;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--fs-xs);color:var(--tx3)}
.jn-trechos{list-style:none;display:flex;flex-wrap:wrap;gap:14px 9px;margin:0;padding:12px 0 2px}
.jn-t{position:relative;display:block;flex-shrink:0;width:14px;height:14px;box-sizing:border-box;border-radius:50%;border:1.5px solid var(--tx3)}
.jn-t.aceso{background:var(--fc);border-color:var(--fc)}
.jn-t.futuro{border-style:dashed;border-color:var(--tx3)}
.jn-t.atual{outline:2px solid var(--tx);outline-offset:2px}
.jn-t.rt{box-shadow:0 0 0 2px var(--s1),0 0 0 4px var(--es)}
.jn-t.av::after{content:'';position:absolute;left:50%;top:-9px;width:5px;height:5px;background:var(--tx2);transform:translateX(-50%) rotate(45deg)}
.jn-legenda{display:flex;flex-wrap:wrap;gap:12px 18px;margin-top:18px;padding-top:14px;border-top:1px solid var(--bd2);font-size:var(--fs-xs);color:var(--tx2);--fc:var(--tx2)}
.jn-legenda span{display:inline-flex;align-items:center;gap:8px}
.jn-pass{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:14px 10px;margin:6px 0 0;padding:0}
.jn-cb{width:100%;max-width:100px;aspect-ratio:1;justify-self:center;box-sizing:border-box;border-radius:50%;border:1.5px dashed var(--tx3);color:var(--tx2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:8px;text-align:center;font-family:'JetBrains Mono',ui-monospace,monospace;line-height:1.2;transform:rotate(var(--rot,0deg))}
.jn-cb svg{width:18px;height:18px;flex-shrink:0;margin-bottom:3px}
.jn-cb-t{font-size:var(--fs-xs);font-weight:600}
.jn-cb-d{font-size:var(--fs-2xs);color:var(--tx3)}
/* Carimbos especiais na cor do idioma: dourado no espanhol, azul no francês, vermelho de selo no mandarim */
.jn-cb-esp{border:3px double var(--accent);color:var(--accent)}
.jn-cb-p{font-size:var(--fs-2xs);font-style:italic;opacity:.85}
.jn-cb-t:lang(zh-Hans){font-size:var(--fs-sm);letter-spacing:.08em}
.jn-est-local{font-size:var(--fs-sm);color:var(--tx2)}
.jn-cb-hoje{border-style:solid;border-color:var(--accent);color:var(--accent)}
.jn-cb-novo{animation:jn-carimbo .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes jn-carimbo{from{opacity:0;transform:rotate(var(--rot,0deg)) scale(1.4)}to{opacity:1;transform:rotate(var(--rot,0deg)) scale(1)}}
@media(prefers-reduced-motion:reduce){.jn-cb-novo{animation:none}}
.jn-cnt{margin-left:auto;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--fs-xs);color:var(--tx3)}
.jn-nota{margin:16px 0 0;font-size:var(--fs-sm);line-height:1.55;color:var(--tx2)}
.jn-outra{margin-top:14px;padding-top:12px;border-top:1px solid var(--bd2)}
.jn-outra summary{cursor:pointer;font-size:var(--fs-md);color:var(--tx2)}
.jn-outra summary:hover{color:var(--tx)}
.jn-outra[open] summary{margin-bottom:12px}
.jn-rodape{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;font-size:var(--fs-sm);color:var(--tx3)}
.jn-sep{height:1px;background:var(--bd);margin:28px 0 26px}
.jn-off{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--s2);border:1px dashed var(--bd);border-radius:var(--r);padding:12px 14px;margin-bottom:18px;font-size:var(--fs-md);color:var(--tx2)}
</style>
</head>

    metodo: () => `
      <div class="pg-h"><div class="pg-title">Método</div><div class="pg-sub">Protocolos fixos para Fluency Academy, Drops e prática oral.</div></div>
      <div class="card">
        <div class="card-row"><span class="tag ta">Protocolo</span><div class="card-title">Fluency Academy — sequência obrigatória</div></div>
        <p class="card-sub">Siga esta ordem em toda aula, sem pular etapas:</p>
        <div class="steps">
          <div class="step"><div class="step-n"></div><div><div class="step-title">Escuta global sem tradução</div><div class="step-desc">Ouça toda a aula ou trecho uma vez. Não pause. Não traduza. Anote o que entendeu.</div></div></div>
          <div class="step"><div class="step-n"></div><div><div class="step-title">Nova escuta com transcrição em espanhol</div><div class="step-desc">Leia a transcrição em espanhol enquanto ouve. Identifique onde estava falhando.</div></div></div>
          <div class="step"><div class="step-n"></div><div><div class="step-title">Consulta pontual ao português</div><div class="step-desc">Só traduza o que bloqueia a compreensão. Não traduza tudo. Priorize sentido geral.</div></div></div>
          <div class="step"><div class="step-n"></div><div><div class="step-title">Repetição em voz alta</div><div class="step-desc">Repita as expressões e frases do trecho em voz alta, com entonação natural.</div></div></div>
          <div class="step"><div class="step-n"></div><div><div class="step-title">Shadowing</div><div class="step-desc">Fale junto com o áudio, sobrepondo sua voz à original. Foque no ritmo e no som.</div></div></div>
          <div class="step"><div class="step-n"></div><div><div class="step-title">Uso em frases pessoais</div><div class="step-desc">Use as expressões aprendidas em 3–5 frases suas, sobre sua própria vida ou rotina.</div></div></div>
        </div>
      </div>
      <div class="card">
        <div class="card-row"><span class="tag t3">Permanente</span><div class="card-title">Módulo de desportuguesização</div></div>
        <ul class="ilist">
          <li><span class="dot d3"></span><div><strong>Sons:</strong> RR vs R, vogais abertas, LL/Y, H mudo, J/G (jota espanhola), -ción vs -ção</div></li>
          <li><span class="dot d3"></span><div><strong>Falsos cognatos:</strong> embarazada ≠ envergonhada · borracha ≠ bêbada · eventualmente ≠ às vezes</div></li>
          <li><span class="dot d3"></span><div><strong>Construções:</strong> "eu gosto de" ≠ "me gusta" · artigos · verbos irregulares — não assumir igual ao português</div></li>
          <li><span class="dot d3"></span><div><strong>Portunhol:</strong> Não improvisar — buscar o bloco real. "Estoy bien" não "estoy bueno"</div></li>
          <li><span class="dot d3"></span><div><strong>Acento tônico:</strong> Espanhol tem acento marcado e previsível — treinar perceber e reproduzir</div></li>
        </ul>
      </div>
      <div class="g2">
        <div class="card">
          <div class="card-title" style="margin-bottom:12px">Técnicas de produção oral</div>
          <ul class="ilist">
            <li><span class="dot da"></span><div><strong>Shadowing</strong> — desde o Dia 1</div></li>
            <li><span class="dot da"></span><div><strong>Substituição</strong> — mudar elementos em frases-modelo</div></li>
            <li><span class="dot da"></span><div><strong>Descrição da rotina</strong> — 3–5 frases diárias</div></li>
            <li><span class="dot da"></span><div><strong>Respostas pessoais</strong> — responder em 1ª pessoa</div></li>
            <li><span class="dot da"></span><div><strong>Resumos</strong> — recontar episódio ou podcast</div></li>
            <li><span class="dot da"></span><div><strong>Gravações</strong> — registrar e ouvir para autopercepção</div></li>
            <li><span class="dot da"></span><div><strong>Improviso</strong> — 2–10 min sem roteiro sobre qualquer tema</div></li>
          </ul>
        </div>
        <div class="card">
          <div class="card-title" style="margin-bottom:12px">Protocolo Drops</div>
          <ul class="ilist">
            <li><span class="dot da"></span>Prioridade: cotidiano, trabalho, transporte, alimentação, lazer, sentimentos, viagem, música, cinema, jogos</li>
            <li><span class="dot da"></span>Palavra isolada ≠ domínio da língua</li>
            <li><span class="dot da"></span>Após cada sessão: 2–3 palavras usadas em frases orais</li>
            <li><span class="dot da"></span>Revisão semanal: reutilizar palavras antigas espontaneamente</li>
          </ul>
          <div class="divider"></div>
          <div class="card-title" style="margin-bottom:10px">Tipos de exposição</div>
          <ul class="ilist">
            <li><span class="dot d1"></span><div><strong>Estudo ativo:</strong> Fluency Academy (atenção concentrada, protocolo fixo)</div></li>
            <li><span class="dot d2"></span><div><strong>Escuta extensiva:</strong> momentos ociosos e banho — Dreaming Spanish, Easy Spanish, El Español y yo, podcasts leves</div></li>
            <li><span class="dot d3"></span><div><strong>Revisão:</strong> Episódios já vistos, músicas já ouvidas, aulas revisitadas</div></li>
            <li><span class="dot d4"></span><div><strong>Prática oral:</strong> Shadowing, gravações, improviso, descrição de rotina</div></li>
            <li><span class="dot d5"></span><div><strong>Exposição leve:</strong> Séries antes de dormir, vídeos no feed, reacts em espanhol</div></li>
          </ul>
        </div>
      </div>`,

          <ul class="ilist">
            <li><span class="dot d1"></span>Fluency Academy: unidades iniciais com foco em pronúncia e ritmo</li>

            <li><span class="dot d1"></span>Fonética ativa: /y/, /ʁ/, nasais, liaison inicial, apagamento do "e" caduco</li>
            <li><span class="dot d1"></span>Oral: shadowing intensivo, repetição com foco no sotaque, 3 frases pessoais por dia</li>
            <li><span class="dot d1"></span>Gramática mínima: ser/estar (être), artigos definidos e indefinidos, gênero</li>

      </div>
      <div class="acc ph2" onclick="toggleAcc(this)">
        <div class="acc-head"><span class="acc-num">T1·F2</span><span class="acc-name">Estrutura Básica</span><span class="acc-meta">Dias 61–120 · 2 ciclos</span><span class="acc-chev">▶</span></div>

          <ul class="ilist">
            <li><span class="dot d2"></span>Fluency Academy: estruturas de presente, perguntas, negação, verbos irregulares comuns</li>
            <li><span class="dot d2"></span>Drops: trabalho, transporte, compras, sentimentos, lazer</li>
            <li><span class="dot d2"></span>Fonética: enchaînement, ritmo de grupo rítmico, acento de frase</li>
            <li><span class="dot d2"></span>Liaison: obrigatória vs opcional — praticar em contexto, não como regra isolada</li>
            <li><span class="dot d2"></span>Oral: substituição em frases-modelo, respostas pessoais, 2–3 min sem roteiro</li>

        </div>
      </div>
      <div class="acc ph3" onclick="toggleAcc(this)">
        <div class="acc-head"><span class="acc-num">T1·F3</span><span class="acc-name">Autonomia A2</span><span class="acc-meta">Dias 121–180 · 2 ciclos</span><span class="acc-chev">▶</span></div>

            <li><span class="dot d3"></span>Fluency Academy: passé composé, imparfait, futur proche, conditionnel básico</li>
            <li><span class="dot d3"></span>Drops: viagem, saúde, emoções, descrições, opiniões</li>
            <li><span class="dot d3"></span>Escuta extensiva: InnerFrench (nível A2/B1), Coffee Break French, RFI Français Facile</li>
            <li><span class="dot d3"></span>Fonética: distinção u/ou em velocidade natural, redução de vogais átonas</li>

      <div style="margin:16px 0 10px"><span class="tag t4" style="margin-right:8px">TEMPORADA 2</span><span style="font-size:13px;color:var(--tx2)">Dias 181–365 · Objetivo: B1 funcional e estável</span></div>

          <div class="acc-marco"><strong>MARCO — DIA 330:</strong> 70–75% compreensão em fala nativa. Manter conversa fluente por 10+ min. Pouquíssima dependência de tradução.</div>

      <div class="acc ph6" onclick="toggleAcc(this)">
        <div class="acc-head"><span class="acc-num">T2·F3</span><span class="acc-name">B1 Funcional e Estável</span><span class="acc-meta">Dias 331–365 · 1 ciclo</span><span class="acc-chev">▶</span></div>
        <div class="acc-body">

            <li><span class="dot d6"></span>Conteúdo nativo: filmes, séries, podcasts de interesse real em francês</li>

            <li><span class="dot d6"></span>Identificação de lacunas remanescentes: pronúncia, vocabulário, gramática</li>

          </ul>
          <div class="acc-marco"><strong>MARCO — DIA 365:</strong> B1 funcional e estável. 75%+ compreensão auditiva. Comunicação autônoma em contextos do cotidiano. Base sólida para eventual B2.</div>
        </div>
      </div>`,

          <div class="trow"><div class="tslot">Noite</div><span class="tpill tp-or">ORAL</span><div>10 min · Descrição da rotina do dia em francês · Atenção à pronúncia</div></div>

        <div class="rot-body">

      <div class="card" style="margin-top:4px">
        <div class="card-title" style="margin-bottom:12px">Módulo de Dessaportuguesização — 8 eixos</div>
        <ul class="ilist">
          <li><span class="dot da"></span><div><strong>Vogais nasais:</strong> /ɛ̃/ /ɑ̃/ /ɔ̃/ /œ̃/ — não fechar a boca como em português; treinar com vin, dans, bon, un</div></li>
          <li><span class="dot da"></span><div><strong>U vs OU:</strong> "tu" ≠ "tou" — /y/ exige lábios em "u" com língua em posição de "i"; treinar pares mínimos</div></li>
          <li><span class="dot da"></span><div><strong>Consoantes finais:</strong> quase sempre mudas — "chat", "est", "Paris" — exceção: C, R, F, L (CaReFuL)</div></li>
          <li><span class="dot da"></span><div><strong>Liaison:</strong> ligação entre palavras em contexto específico — "les amis" /lezami/ — praticar em grupo rítmico</div></li>
          <li><span class="dot da"></span><div><strong>Enchaînement:</strong> consoante final pronunciada passa para a vogal seguinte — "une amie" /ynamiː/ — treinar fluidez</div></li>

          <li><span class="dot da"></span><div><strong>Falsos cognatos:</strong> actuellement ≠ atualmente (= de fato) · sensible ≠ sensível (= sensato) · assister ≠ assistir (= estar presente)</div></li>
          <li><span class="dot da"></span><div><strong>Escrita vs fala:</strong> "beaucoup" escrito ≠ /boku/ falado — treinar reconhecer a palavra oral sem depender da ortografia</div></li>
        </ul>
      </div>`,

    metodo: () => `
      <div class="pg-h"><div class="pg-title">Método</div><div class="pg-sub">Protocolo de escuta, fonética ativa e prática oral para o francês.</div></div>
      <div class="card">
        <div class="card-row"><span class="tag ta">Protocolo</span><div class="card-title">Fluency Academy — sequência com fonética integrada</div></div>
        <p class="card-sub">Núcleo idêntico ao do espanhol, com etapa de fonética ativa inserida após o shadowing. Adapte se a aula tiver estrutura diferente.</p>
        <div class="steps">
          <div class="step"><div class="step-n"></div><div><div class="step-title">Escuta global sem tradução</div><div class="step-desc">Ouça o trecho inteiro sem parar. Foque no ritmo e na melodia da frase, não nas palavras.</div></div></div>
          <div class="step"><div class="step-n"></div><div><div class="step-title">Nova escuta com transcrição em francês</div><div class="step-desc">Leia a transcrição em francês enquanto ouve. Identifique onde a pronúncia difere do que você esperava.</div></div></div>
          <div class="step"><div class="step-n"></div><div><div class="step-title">Consulta pontual ao português</div><div class="step-desc">Traduza apenas o que bloqueia. Priorize o sentido geral antes de palavras isoladas.</div></div></div>
          <div class="step"><div class="step-n"></div><div><div class="step-title">Repetição em voz alta</div><div class="step-desc">Repita frases inteiras com atenção ao enchaînement, liaison e ritmo silábico.</div></div></div>
          <div class="step"><div class="step-n"></div><div><div class="step-title">Shadowing</div><div class="step-desc">Fale junto com o áudio. Priorize o ritmo e o som do /ʁ/ e das nasais sobre a precisão lexical.</div></div></div>
          <div class="step"><div class="step-n"></div><div><div class="step-title">Fonética ativa</div><div class="step-desc">Identifique 1 som-problema do trecho. Repita isoladamente, depois em contexto, depois em frase própria.</div></div></div>
          <div class="step"><div class="step-n"></div><div><div class="step-title">Frases pessoais</div><div class="step-desc">Use 3–5 estruturas da aula em frases sobre sua rotina. Grave se possível.</div></div></div>
        </div>
      </div>
      <div class="card">
        <div class="card-row"><span class="tag t3">IPA</span><div class="card-title">Sons que o português não tem — referência rápida</div></div>
        <ul class="ilist">
          <li><span class="dot da"></span><div><strong>/y/</strong> — "u" francês · Arredonde lábios para "u", posicione língua para "i" · <em>tu, rue, lune, sur</em></div></li>
          <li><span class="dot da"></span><div><strong>/ø/</strong> — "eu" fechado · Lábios arredondados + boca levemente aberta · <em>feu, deux, veux, bleu</em></div></li>
          <li><span class="dot da"></span><div><strong>/œ/</strong> — "eu" aberto · Mais aberto que /ø/ · <em>peur, cœur, seul, heure</em></div></li>
          <li><span class="dot da"></span><div><strong>/ʁ/</strong> — "r" uvular · Fricção na garganta, língua plana · <em>rouge, Paris, frère, merci</em></div></li>
          <li><span class="dot da"></span><div><strong>/ɛ̃/</strong> — nasal de "ain/in" · <em>vin, pain, main, bien</em></div></li>
          <li><span class="dot da"></span><div><strong>/ɑ̃/</strong> — nasal de "an/en" · <em>dans, enfant, France, blanc</em></div></li>
          <li><span class="dot da"></span><div><strong>/ɔ̃/</strong> — nasal de "on" · <em>bon, mon, maison, chanson</em></div></li>
        </ul>
      </div>`,
