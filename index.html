<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Políglota — Painel de Idiomas</title>
<!-- ── PWA & ícones ─────────────────────────────────── -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0c10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Políglota">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="apple-touch-icon" sizes="144x144" href="icon-144.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icon-16.png">
<link rel="shortcut icon" href="favicon.ico">
<!-- ── Fontes ─────────────────────────────────────────── -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══ TOKENS GLOBAIS ══════════════════════════════════ */
:root {
  --bg:#0c0c10;--s0:#101015;--s1:#15151c;--s2:#1b1b24;--s3:#22222e;
  --bd:#252532;--bd2:#1c1c28;
  --tx:#e2e2ee;--tx2:#8888a0;--tx3:#484860;
  --r:6px;--r2:3px;

  /* Espanhol */
  --es:    #e8c547;
  --es-a:  rgba(232,197,71,.12);
  --es-b:  rgba(232,197,71,.28);

  /* Francês */
  --fr:    #4f8ef7;
  --fr-a:  rgba(79,142,247,.12);
  --fr-b:  rgba(79,142,247,.28);

  /* Mandarim */
  --zh:    #e84c3d;
  --zh-a:  rgba(232,76,61,.12);
  --zh-b:  rgba(232,76,61,.28);
  --zh2:   #d4a843;

  /* Fase cores */
  --p1:#7c6dfa;--p1a:rgba(124,109,250,.10);--p1b:rgba(124,109,250,.28);
  --p2:#e8c547;--p2a:rgba(232,197,71,.10); --p2b:rgba(232,197,71,.28);
  --p3:#3ecf8e;--p3a:rgba(62,207,142,.10); --p3b:rgba(62,207,142,.28);
  --p4:#f87171;--p4a:rgba(248,113,113,.10);--p4b:rgba(248,113,113,.28);
  --p5:#fb923c;--p5a:rgba(251,146,60,.10); --p5b:rgba(251,146,60,.28);
  --p6:#a78bfa;--p6a:rgba(167,139,250,.10);--p6b:rgba(167,139,250,.28);

  /* Cor ativa (muda via JS) */
  --accent:    var(--es);
  --accent-a:  var(--es-a);
  --accent-b:  var(--es-b);
}

/* ═══ BASE ════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;font-size:14px;line-height:1.6;overflow:hidden;height:100vh;-webkit-text-size-adjust:100%;text-size-adjust:100%}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}

/* ═══ APP SHELL ═══════════════════════════════════════ */
#app{display:flex;flex-direction:column;height:100vh}
#shell-body{display:flex;flex:1;min-height:0}

/* ── TOPBAR ──────────────────────────────────────────── */
#topbar{
  flex:0 0 56px;background:var(--s1);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;padding:0 14px;gap:10px;z-index:50;
  overflow:hidden;width:100%;max-width:100vw;
}

/* Seletor de idioma */
.lang-switcher{display:flex;gap:3px;flex-shrink:0}
.lang-btn{
  font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.06em;
  padding:5px 10px;border-radius:var(--r2);border:1px solid var(--bd);
  background:none;color:var(--tx3);cursor:pointer;transition:all .18s;
  white-space:nowrap;
}
.lang-btn:hover{color:var(--tx);border-color:var(--tx3)}
.lang-btn.active-es{color:var(--es);border-color:var(--es-b);background:var(--es-a)}
.lang-btn.active-fr{color:var(--fr);border-color:var(--fr-b);background:var(--fr-a)}
.lang-btn.active-zh{color:var(--zh);border-color:var(--zh-b);background:var(--zh-a)}
.lang-btn.planned{opacity:.45;cursor:default}
.lang-btn.planned:hover{color:var(--tx3);border-color:var(--bd);background:none}
/* Label spans: long on desktop, short on mobile */
.lb-long{display:inline}
.lb-short{display:none}

.t-sep{width:1px;height:22px;background:var(--bd);flex-shrink:0}

/* Barra de fases dinâmica */
.t-track{flex:1;display:flex;flex-direction:column;gap:4px;overflow:hidden;min-width:0}
.t-pips{display:flex;gap:3px;height:5px}
.t-pip{height:5px;border-radius:2px;transition:opacity .3s;flex:1}
.t-pip.dim{opacity:.18}
.t-labels{display:flex;justify-content:space-between}
.t-lbl{font-family:'Space Mono',monospace;font-size:8px;color:var(--tx3);letter-spacing:.04em;white-space:nowrap}

.t-badge{
  font-family:'Space Mono',monospace;font-size:11px;
  padding:4px 12px;border-radius:2px;white-space:nowrap;flex-shrink:0;
  border:1px solid var(--accent-b);background:var(--accent-a);color:var(--accent);
  transition:all .3s;
}

/* Hamburger */
.t-ham{display:none;align-items:center;justify-content:center;cursor:pointer;background:none;border:none;padding:6px;margin-left:auto;width:30px;height:30px}
.t-ham i{position:relative;display:block;width:18px;height:2px;background:var(--tx2);border-radius:1px;box-shadow:0 -6px 0 var(--tx2),0 6px 0 var(--tx2)}

/* ── SIDEBAR ─────────────────────────────────────────── */
#sidebar{
  flex:0 0 220px;background:var(--s0);border-right:1px solid var(--bd);
  overflow-y:auto;display:flex;flex-direction:column;padding:10px 0 20px;
  -webkit-overflow-scrolling:touch;
}
.s-sec{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.14em;color:var(--tx3);text-transform:uppercase;padding:14px 16px 5px}
.s-item{
  display:flex;align-items:center;gap:10px;padding:9px 16px;
  background:none;border:none;width:100%;text-align:left;color:var(--tx2);
  font-family:'Inter',sans-serif;font-size:13px;cursor:pointer;position:relative;
  transition:background .14s,color .14s;
}
.s-item:hover{background:var(--s2);color:var(--tx)}
.s-item.on{background:var(--s2);color:var(--tx)}
.s-item.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);border-radius:0 2px 2px 0;transition:background .3s}
.s-ico{width:15px;height:15px;opacity:.55;flex-shrink:0;transition:opacity .14s}
.s-item:hover .s-ico,.s-item.on .s-ico{opacity:1}

/* Idioma inativo na sidebar */
.sidebar-lang-label{
  font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 8px;border-radius:2px;border:1px solid;
  flex-shrink:0;margin-left:auto;
}

/* ── CONTENT ─────────────────────────────────────────── */
#content{flex:1;min-width:0;overflow-y:auto;background:var(--bg);padding:28px 32px 48px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.inner{max-width:820px}
.pg{display:none}
.pg.on{display:block;animation:fi .16s ease}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pg-h{margin-bottom:22px}
.pg-title{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:var(--tx);margin-bottom:3px}
.pg-sub{font-size:13px;color:var(--tx2)}

/* ═══ CARDS ═══════════════════════════════════════════ */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:20px;margin-bottom:14px}
.card-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-title{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;color:var(--tx)}
.card-sub{font-size:13px;color:var(--tx2);margin-bottom:14px;line-height:1.55}

/* ═══ TAGS ════════════════════════════════════════════ */
.tag{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:2px;border:1px solid;flex-shrink:0}
.ta{color:var(--accent);border-color:var(--accent-b);background:var(--accent-a)}
.t1{color:var(--p1);border-color:var(--p1b);background:var(--p1a)}
.t2{color:var(--p2);border-color:var(--p2b);background:var(--p2a)}
.t3{color:var(--p3);border-color:var(--p3b);background:var(--p3a)}
.t4{color:var(--p4);border-color:var(--p4b);background:var(--p4a)}
.t5{color:var(--p5);border-color:var(--p5b);background:var(--p5a)}
.t6{color:var(--p6);border-color:var(--p6b);background:var(--p6a)}

/* ═══ GRIDS ═══════════════════════════════════════════ */
.g2{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px}
.g2>*{flex:1 1 calc(50% - 7px);min-width:0}
.g3{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.g3>*{flex:1 1 calc(33.333% - 8px);min-width:0}
.gn{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
@media(max-width:680px){.g2>*,.g3>*,.gn>*{flex:1 1 100%}}

/* ═══ STAT TILES ══════════════════════════════════════ */
.stat{background:var(--s2);border:1px solid var(--bd2);border-radius:var(--r);padding:16px;text-align:center}
.stat-v{font-family:'Space Mono',monospace;font-size:22px;font-weight:700;color:var(--accent);margin-bottom:4px;line-height:1;transition:color .3s}
.stat-l{font-size:11px;color:var(--tx3);letter-spacing:.03em}

/* ═══ ITEM LISTS ══════════════════════════════════════ */
.ilist{list-style:none}
.ilist li{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd2);font-size:13px;line-height:1.55}
.ilist li:last-child{border-bottom:none}
.dot{width:6px;height:6px;border-radius:50%;margin-top:6px;flex-shrink:0}
.da{background:var(--accent)}
.d1{background:var(--p1)}.d2{background:var(--p2)}.d3{background:var(--p3)}
.d4{background:var(--p4)}.d5{background:var(--p5)}.d6{background:var(--p6)}
.dg{background:var(--tx3)}

/* ═══ ALERT ═══════════════════════════════════════════ */
.alert{background:var(--accent-a);border:1px solid var(--accent-b);border-radius:var(--r2);padding:11px 15px;font-size:13px;margin-bottom:14px;line-height:1.55;transition:background .3s,border-color .3s}
.alert strong{color:var(--accent);transition:color .3s}

/* ═══ ACCORDIONS ═══════════════════════════════════════ */
.acc{border:1px solid var(--bd);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.acc-head{display:flex;align-items:center;gap:12px;padding:13px 17px;cursor:pointer;user-select:none;background:var(--s1);transition:background .14s}
.acc-head:hover{background:var(--s2)}
.acc-num{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;padding:3px 9px;border-radius:2px;flex-shrink:0}
.acc-name{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;flex:1}
.acc-meta{font-family:'Space Mono',monospace;font-size:10px;color:var(--tx3);white-space:nowrap}
.acc-chev{color:var(--tx3);font-size:11px;transition:transform .2s;flex-shrink:0}
.acc.open .acc-chev{transform:rotate(90deg)}
.acc-body{display:none;padding:0 17px 15px;background:var(--s0);border-top:1px solid var(--bd)}
.acc.open .acc-body{display:block}
.acc-desc{font-size:13px;color:var(--tx2);margin:12px 0 10px;line-height:1.55}
.acc-marco{margin-top:12px;padding:10px 13px;border-radius:var(--r2);border:1px solid;font-size:12px;line-height:1.55}

/* Accordion phase colors aplicados via classe de fase */
.ph1 .acc-num{background:var(--p1a);color:var(--p1);border:1px solid var(--p1b)}
.ph2 .acc-num{background:var(--p2a);color:var(--p2);border:1px solid var(--p2b)}
.ph3 .acc-num{background:var(--p3a);color:var(--p3);border:1px solid var(--p3b)}
.ph4 .acc-num{background:var(--p4a);color:var(--p4);border:1px solid var(--p4b)}
.ph5 .acc-num{background:var(--p5a);color:var(--p5);border:1px solid var(--p5b)}
.ph6 .acc-num{background:var(--p6a);color:var(--p6);border:1px solid var(--p6b)}
.ph1 .acc-marco{border-color:var(--p1b);background:var(--p1a);color:var(--tx2)}.ph1 .acc-marco strong{color:var(--p1)}
.ph2 .acc-marco{border-color:var(--p2b);background:var(--p2a);color:var(--tx2)}.ph2 .acc-marco strong{color:var(--p2)}
.ph3 .acc-marco{border-color:var(--p3b);background:var(--p3a);color:var(--tx2)}.ph3 .acc-marco strong{color:var(--p3)}
.ph4 .acc-marco{border-color:var(--p4b);background:var(--p4a);color:var(--tx2)}.ph4 .acc-marco strong{color:var(--p4)}
.ph5 .acc-marco{border-color:var(--p5b);background:var(--p5a);color:var(--tx2)}.ph5 .acc-marco strong{color:var(--p5)}
.ph6 .acc-marco{border-color:var(--p6b);background:var(--p6a);color:var(--tx2)}.ph6 .acc-marco strong{color:var(--p6)}

/* ═══ ROTINAS ═════════════════════════════════════════ */
.rot{border:1px solid var(--bd);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.rot-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer}
.rot-head.rc{background:rgba(62,207,142,.08);border-bottom:1px solid rgba(62,207,142,.18)}
.rot-head.rp{background:rgba(232,197,71,.08);border-bottom:1px solid rgba(232,197,71,.18)}
.rot-head.rm{background:rgba(248,113,113,.08);border-bottom:1px solid rgba(248,113,113,.18)}
.rot-label{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600}
.rot-head.rc .rot-label{color:var(--p3)}.rot-head.rp .rot-label{color:var(--p2)}.rot-head.rm .rot-label{color:var(--p4)}
.rot-meta{display:flex;align-items:center;gap:10px;font-family:'Space Mono',monospace;font-size:10px;color:var(--tx3)}
.rot-chev{font-size:10px;transition:transform .2s}
.rot.open .rot-chev{transform:rotate(90deg)}
.rot-body{display:none;padding:13px 15px;background:var(--s2)}
.rot.open .rot-body{display:block}

.trow{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd2);font-size:13px;line-height:1.5;align-items:flex-start}
.trow:last-child{border-bottom:none}
.tslot{font-family:'Space Mono',monospace;font-size:9px;color:var(--tx3);width:70px;flex-shrink:0;padding-top:3px;letter-spacing:.06em;text-transform:uppercase}
.tpill{font-family:'Space Mono',monospace;font-size:9px;padding:2px 7px;border-radius:2px;flex-shrink:0;height:fit-content;margin-top:2px}
.tp-at{background:var(--p1a);color:var(--p1)}.tp-dr{background:var(--p2a);color:var(--p2)}
.tp-or{background:var(--p3a);color:var(--p3)}.tp-au{background:var(--p5a);color:var(--p5)}
.tp-lv{background:rgba(72,72,96,.25);color:var(--tx3)}.tp-rv{background:var(--p4a);color:var(--p4)}
.tp-sk{background:var(--p6a);color:var(--p6)}

/* ═══ PROTOCOLO STEPS ════════════════════════════════ */
.steps{counter-reset:s}
.step{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--bd2);counter-increment:s}
.step:last-child{border-bottom:none}
.step-n{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--accent);width:20px;flex-shrink:0;transition:color .3s}
.step-n::before{content:counter(s)}
.step-title{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;margin-bottom:2px}
.step-desc{font-size:12px;color:var(--tx2);line-height:1.5}

/* ═══ CHECKIN FORM ═══════════════════════════════════ */
.fg{display:flex;flex-direction:column;gap:6px}
.fg label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--tx3);text-transform:uppercase}
.frow{display:flex;flex-wrap:wrap;gap:14px}
.frow>*{flex:1 1 calc(50% - 7px);min-width:0}
@media(max-width:580px){.frow>*{flex:1 1 100%}}

input[type="number"],input[type="text"],input[type="password"],select,textarea{
  width:100%;background:var(--s2);border:1px solid var(--bd);color:var(--tx);
  font-family:'Inter',sans-serif;font-size:13px;padding:9px 12px;
  border-radius:var(--r2);outline:none;transition:border-color .18s;
  -webkit-appearance:none;appearance:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:68px}
select option{background:var(--s2)}

.rng-wrap{display:flex;align-items:center;gap:12px;min-height:16px}
input[type="range"]{
  flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;
  border:none;padding:0;margin:0;cursor:pointer;display:block;
  background:linear-gradient(var(--accent),var(--accent)) no-repeat var(--bd);
  background-size:40% 100%;transition:background-color .3s;
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;background:var(--accent);
  border-radius:50%;cursor:pointer;box-shadow:0 0 0 3px var(--accent-a);
}
input[type="range"]::-moz-range-thumb{
  width:16px;height:16px;background:var(--accent);border-radius:50%;border:none;cursor:pointer;
}

.fcard{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.fcard-head{display:flex;align-items:center;gap:10px;padding:11px 17px;border-bottom:1px solid var(--bd);background:var(--s0)}
.fcard-title{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600}
.fcard-body{padding:15px 17px;display:flex;flex-direction:column;gap:13px}

/* ═══ BUTTONS ════════════════════════════════════════ */
.btns{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.btn{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;padding:10px 20px;border:none;border-radius:var(--r2);cursor:pointer;transition:all .15s;letter-spacing:.03em}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.btn-p{background:var(--accent);color:#0c0c10;transition:background .3s}
.btn-p:hover{filter:brightness(1.12)}
.btn-g{background:none;border:1px solid var(--bd);color:var(--tx2)}
.btn-g:hover{border-color:var(--tx2);color:var(--tx)}

/* ═══ ANÁLISE OUTPUT ════════════════════════════════ */
#analysis-out{display:none;margin-top:14px;background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
#analysis-out.vis{display:block}
.ao-sec{padding:14px 17px;border-bottom:1px solid var(--bd2);font-size:13px;line-height:1.72}
.ao-sec:last-child{border-bottom:none}
.ao-lbl{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase;margin-bottom:6px;transition:color .3s}
.ao-loading{padding:20px 17px;font-family:'Space Mono',monospace;font-size:12px;color:var(--tx3)}
.ao-loading::after{content:'';animation:ell 1.4s infinite}
@keyframes ell{0%{content:'.'}34%{content:'..'}67%{content:'...'}}

/* ═══ TABLE ══════════════════════════════════════════ */
.ev-table{width:100%;border-collapse:collapse;font-size:13px}
.ev-table th{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);padding:9px 13px;border-bottom:1px solid var(--bd);text-align:left}
.ev-table td{padding:10px 13px;border-bottom:1px solid var(--bd2)}
.ev-table tr:last-child td{border-bottom:none}
.ev-table tr:hover td{background:var(--s2)}
.ev-pill{font-family:'Space Mono',monospace;font-size:9px;padding:3px 8px;border-radius:2px}
.ev-pend{color:var(--tx3);background:rgba(72,72,96,.2)}
.ev-done{color:var(--p3);background:var(--p3a)}

/* ═══ TIMELINE ═══════════════════════════════════════ */
.tl{position:relative;padding-left:26px}
.tl::before{content:'';position:absolute;left:8px;top:8px;bottom:8px;width:1px;background:var(--bd)}
.tl-item{position:relative;display:flex;gap:16px;align-items:flex-start;margin-bottom:20px}
.tl-item:last-child{margin-bottom:0}
.tl-dot{position:absolute;left:-22px;top:5px;width:9px;height:9px;border-radius:50%;border:2px solid var(--bg);flex-shrink:0}
.tl-day{font-family:'Space Mono',monospace;font-size:20px;font-weight:700;line-height:1;min-width:58px;padding-top:2px;flex-shrink:0}
.tl-h{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;margin-bottom:2px}
.tl-p{font-size:12px;color:var(--tx2);line-height:1.5}

/* ═══ METRICS BAR ════════════════════════════════════ */
.mrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd2)}
.mrow:last-child{border-bottom:none}
.mrow-lbl{font-size:13px;min-width:200px}
.mrow-lbl small{display:block;font-size:11px;color:var(--tx3);margin-top:1px}
.mrow-track{flex:1;height:4px;background:var(--bd);border-radius:2px;overflow:hidden}
.mrow-fill{height:100%;border-radius:2px}
.mrow-target{font-family:'Space Mono',monospace;font-size:10px;color:var(--tx3);white-space:nowrap}

/* ═══ TOAST ══════════════════════════════════════════ */
#toast{position:fixed;bottom:24px;right:24px;background:var(--s3);border:1px solid var(--bd);color:var(--tx);font-size:13px;padding:10px 16px;border-radius:var(--r2);opacity:0;transform:translateY(10px);transition:all .24s;z-index:999;pointer-events:none;max-width:280px}
#toast.show{opacity:1;transform:none}
#toast.ok{border-left:3px solid var(--p3)}
#toast.err{border-left:3px solid var(--p4)}

/* ═══ MISC ═══════════════════════════════════════════ */
.divider{height:1px;background:var(--bd);margin:18px 0}
.planned-banner{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:40px 24px;text-align:center}
.planned-banner h2{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:600;margin-bottom:8px}
.planned-banner p{font-size:13px;color:var(--tx2);line-height:1.6}
.planned-icon{font-size:32px;margin-bottom:16px}

/* ═══ MOBILE ═════════════════════════════════════════ */
@media(max-width:768px){
  /* Sidebar como overlay deslizante */
  #sidebar{
    position:fixed;left:0;top:56px;bottom:0;width:220px;
    z-index:40;transform:translateX(-100%);
    transition:transform .24s;border-right:1px solid var(--bd);
  }
  #sidebar.open{transform:none;box-shadow:8px 0 32px rgba(0,0,0,.5)}

  /* Topbar: esconder elementos pesados, mostrar só lang + badge + ham */
  .t-ham{display:flex}
  .t-track{display:none}
  .t-sep{display:none}

  /* Botões de idioma viram só sigla */
  .lb-long{display:none}
  .lb-short{display:inline}
  .lang-btn{padding:5px 8px;font-size:10px;letter-spacing:.04em}

  /* Badge compacto */
  .t-badge{font-size:10px;padding:4px 8px}

  /* Conteúdo */
  #content{padding:16px 14px 56px}

  /* Tipografia responsiva */
  .pg-title{font-size:17px}
  .acc-name{font-size:13px}
  .acc-meta{display:none} /* esconde "D1-120 · 4 ciclos" em telas < 768 */
  .tl{padding-left:20px}
  .tl-day{font-size:17px;min-width:44px}
  .mrow-lbl{min-width:120px}
  .mrow-lbl strong{font-size:12px}
  .mrow-lbl small{font-size:10px}
  .card{padding:14px}
  .fcard-body{padding:13px 14px}
}

/* Telas muito pequenas (iPhone SE, 375px) */
@media(max-width:400px){
  #topbar{padding:0 10px;gap:6px}
  .lang-btn{padding:4px 6px;font-size:9px}
  .t-badge{font-size:9px;padding:3px 7px}
  .card{padding:12px}
  .ilist li{font-size:12px}
  .trow{font-size:12px}
  .step-title{font-size:12px}
  .step-desc{font-size:11px}
}

/* ═══ TABLET (769–1024px) ════════════════════════════ */
@media(min-width:769px) and (max-width:1024px){
  #sidebar{flex:0 0 190px}
  #content{padding:20px 20px 40px}
  .inner{max-width:100%}
  .mrow-lbl{min-width:160px}
  .acc-meta{font-size:9px}
}

/* ═══ SAFE AREA (notch / home bar) ══════════════════ */
@supports(padding-bottom:env(safe-area-inset-bottom)){
  #content{padding-bottom:calc(48px + env(safe-area-inset-bottom))}
}
@supports(padding-bottom:env(safe-area-inset-bottom)){
  @media(max-width:768px){
    #content{padding-bottom:calc(56px + env(safe-area-inset-bottom))}
    #topbar{padding-left:max(14px, env(safe-area-inset-left));padding-right:max(14px, env(safe-area-inset-right))}
  }
}

/* ═══ PREVENT HORIZONTAL SCROLL ═════════════════════ */
html,body{max-width:100%;overflow-x:hidden}
#app,#shell-body,#content,#topbar{max-width:100%}

    metodo: () => `
      <div class="pg-h"><div class="pg-title">Método</div><div class="pg-sub">Protocolos fixos para Fluency Academy, Drops e prática oral.</div></div>
      <div class="card">
        <div class="card-row"><span class="tag ta">Protocolo</span><div class="card-title">Fluency Academy — sequência obrigatória</div></div>
        <p class="card-sub">Siga esta ordem em toda aula, sem pular etapas:</p>
        <div class="steps">
          <div class="step"><div class="step-n"></div><div><div class="step-title">Escuta global sem tradução</div><div class="step-desc">Ouça toda a aula ou trecho uma vez. Não pause. Não traduza. Anote o que entendeu.</div></div></div>
          <div class="step"><div class="step-n"></div><div><div class="step-title">Nova escuta com transcrição em espanhol</div><div class="step-desc">Leia a transcrição em espanhol enquanto ouve. Identifique onde estava falhando.</div></div></div>
          <div class="step"><div class="step-n"></div><div><div class="step-title">Consulta pontual ao português</div><div class="step-desc">Só traduza o que bloqueia a compreensão. Não traduza tudo. Priorize sentido geral.</div></div></div>
          <div class="step"><div class="step-n"></div><div><div class="step-title">Repetição em voz alta</div><div class="step-desc">Repita as expressões e frases do trecho em voz alta, com entonação natural.</div></div></div>
          <div class="step"><div class="step-n"></div><div><div class="step-title">Shadowing</div><div class="step-desc">Fale junto com o áudio, sobrepondo sua voz à original. Foque no ritmo e no som.</div></div></div>
          <div class="step"><div class="step-n"></div><div><div class="step-title">Uso em frases pessoais</div><div class="step-desc">Use as expressões aprendidas em 3–5 frases suas, sobre sua própria vida ou rotina.</div></div></div>
        </div>
      </div>
      <div class="card">
        <div class="card-row"><span class="tag t3">Permanente</span><div class="card-title">Módulo de desportuguesização</div></div>
        <ul class="ilist">
          <li><span class="dot d3"></span><div><strong>Sons:</strong> RR vs R, vogais abertas, LL/Y, H mudo, J/G (jota espanhola), -ción vs -ção</div></li>
          <li><span class="dot d3"></span><div><strong>Falsos cognatos:</strong> embarazada ≠ envergonhada · borracha ≠ bêbada · eventualmente ≠ às vezes</div></li>
          <li><span class="dot d3"></span><div><strong>Construções:</strong> "eu gosto de" ≠ "me gusta" · artigos · verbos irregulares — não assumir igual ao português</div></li>
          <li><span class="dot d3"></span><div><strong>Portunhol:</strong> Não improvisar — buscar o bloco real. "Estoy bien" não "estoy bueno"</div></li>
          <li><span class="dot d3"></span><div><strong>Acento tônico:</strong> Espanhol tem acento marcado e previsível — treinar perceber e reproduzir</div></li>
        </ul>
      </div>
      <div class="g2">
        <div class="card">
          <div class="card-title" style="margin-bottom:12px">Técnicas de produção oral</div>
          <ul class="ilist">
            <li><span class="dot da"></span><div><strong>Shadowing</strong> — desde o Dia 1</div></li>
            <li><span class="dot da"></span><div><strong>Substituição</strong> — mudar elementos em frases-modelo</div></li>
            <li><span class="dot da"></span><div><strong>Descrição da rotina</strong> — 3–5 frases diárias</div></li>
            <li><span class="dot da"></span><div><strong>Respostas pessoais</strong> — responder em 1ª pessoa</div></li>
            <li><span class="dot da"></span><div><strong>Resumos</strong> — recontar episódio ou podcast</div></li>
            <li><span class="dot da"></span><div><strong>Gravações</strong> — registrar e ouvir para autopercepção</div></li>
            <li><span class="dot da"></span><div><strong>Improviso</strong> — 2–10 min sem roteiro sobre qualquer tema</div></li>
          </ul>
        </div>
        <div class="card">
          <div class="card-title" style="margin-bottom:12px">Protocolo Drops</div>
          <ul class="ilist">
            <li><span class="dot da"></span>Prioridade: cotidiano, trabalho, transporte, alimentação, lazer, sentimentos, viagem, música, cinema, jogos</li>
            <li><span class="dot da"></span>Palavra isolada ≠ domínio da língua</li>
            <li><span class="dot da"></span>Após cada sessão: 2–3 palavras usadas em frases orais</li>
            <li><span class="dot da"></span>Revisão semanal: reutilizar palavras antigas espontaneamente</li>
          </ul>
          <div class="divider"></div>
          <div class="card-title" style="margin-bottom:10px">Tipos de exposição</div>
          <ul class="ilist">
            <li><span class="dot d1"></span><div><strong>Estudo ativo:</strong> Fluency Academy (atenção concentrada, protocolo fixo)</div></li>
            <li><span class="dot d2"></span><div><strong>Escuta extensiva:</strong> Uber/banho — Dreaming Spanish, Easy Spanish, El Español y yo, podcasts leves</div></li>
            <li><span class="dot d3"></span><div><strong>Revisão:</strong> Episódios já vistos, músicas já ouvidas, aulas revisitadas</div></li>
            <li><span class="dot d4"></span><div><strong>Prática oral:</strong> Shadowing, gravações, improviso, descrição de rotina</div></li>
            <li><span class="dot d5"></span><div><strong>Exposição leve:</strong> Séries antes de dormir, vídeos no feed, reacts em espanhol</div></li>
          </ul>
        </div>
      </div>`,

    metodo: () => `
      <div class="pg-h"><div class="pg-title">Método</div><div class="pg-sub">Protocolo de escuta, fonética ativa e prática oral para o francês.</div></div>
      <div class="card">
        <div class="card-row"><span class="tag ta">Protocolo</span><div class="card-title">Fluency Academy — sequência com fonética integrada</div></div>
        <p class="card-sub">Núcleo idêntico ao do espanhol, com etapa de fonética ativa inserida após o shadowing. Adapte se a aula tiver estrutura diferente.</p>
        <div class="steps">
          <div class="step"><div class="step-n"></div><div><div class="step-title">Escuta global sem tradução</div><div class="step-desc">Ouça o trecho inteiro sem parar. Foque no ritmo e na melodia da frase, não nas palavras.</div></div></div>
          <div class="step"><div class="step-n"></div><div><div class="step-title">Nova escuta com transcrição em francês</div><div class="step-desc">Leia a transcrição em francês enquanto ouve. Identifique onde a pronúncia difere do que você esperava.</div></div></div>
          <div class="step"><div class="step-n"></div><div><div class="step-title">Consulta pontual ao português</div><div class="step-desc">Traduza apenas o que bloqueia. Priorize o sentido geral antes de palavras isoladas.</div></div></div>
          <div class="step"><div class="step-n"></div><div><div class="step-title">Repetição em voz alta</div><div class="step-desc">Repita frases inteiras com atenção ao enchaînement, liaison e ritmo silábico.</div></div></div>
          <div class="step"><div class="step-n"></div><div><div class="step-title">Shadowing</div><div class="step-desc">Fale junto com o áudio. Priorize o ritmo e o som do /ʁ/ e das nasais sobre a precisão lexical.</div></div></div>
          <div class="step"><div class="step-n"></div><div><div class="step-title">Fonética ativa</div><div class="step-desc">Identifique 1 som-problema do trecho. Repita isoladamente, depois em contexto, depois em frase própria.</div></div></div>
          <div class="step"><div class="step-n"></div><div><div class="step-title">Frases pessoais</div><div class="step-desc">Use 3–5 estruturas da aula em frases sobre sua rotina. Grave se possível.</div></div></div>
        </div>
      </div>
      <div class="card">
        <div class="card-row"><span class="tag t3">IPA</span><div class="card-title">Sons que o português não tem — referência rápida</div></div>
        <ul class="ilist">
          <li><span class="dot da"></span><div><strong>/y/</strong> — "u" francês · Arredonde lábios para "u", posicione língua para "i" · <em>tu, rue, lune, sur</em></div></li>
          <li><span class="dot da"></span><div><strong>/ø/</strong> — "eu" fechado · Lábios arredondados + boca levemente aberta · <em>feu, deux, veux, bleu</em></div></li>
          <li><span class="dot da"></span><div><strong>/œ/</strong> — "eu" aberto · Mais aberto que /ø/ · <em>peur, cœur, seul, heure</em></div></li>
          <li><span class="dot da"></span><div><strong>/ʁ/</strong> — "r" uvular · Fricção na garganta, língua plana · <em>rouge, Paris, frère, merci</em></div></li>
          <li><span class="dot da"></span><div><strong>/ɛ̃/</strong> — nasal de "ain/in" · <em>vin, pain, main, bien</em></div></li>
          <li><span class="dot da"></span><div><strong>/ɑ̃/</strong> — nasal de "an/en" · <em>dans, enfant, France, blanc</em></div></li>
          <li><span class="dot da"></span><div><strong>/ɔ̃/</strong> — nasal de "on" · <em>bon, mon, maison, chanson</em></div></li>
        </ul>
      </div>`,

/* ═══════════════════════════════════════════════════════
   VERSÃO E STORAGE — polyglot.{lang}.{key}
═══════════════════════════════════════════════════════ */
const APP_VERSION = '2.1.0';

/* Chave com prefixo polyglot + lang + key
   Exemplo: polyglot.es.checkins */
function storageKey(lang, key) {
  return 'polyglot.' + lang + '.' + key;
}

function getStore(lang, key) {
  try {
    const raw = localStorage.getItem(storageKey(lang, key));
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function setStore(lang, key, value) {
  try {
    localStorage.setItem(storageKey(lang, key), JSON.stringify(value));
    return true;
  } catch(e) { return false; }
}

/* ── Migração completa e silenciosa ─────────────────────
   Roda uma única vez no init. Detecta todos os formatos
   anteriores e migra para polyglot.{lang}.{key}.
   Registra a versão após migração para não rodar novamente.
─────────────────────────────────────────────────────── */
function runMigrations() {
  const migratedKey = 'polyglot.meta.migratedVersion';
  const already = localStorage.getItem(migratedKey);
  if (already === APP_VERSION) return;

  /* v1 → v2: chave 'checkins' sem namespace (espanhol original) */
  try {
    const v1 = localStorage.getItem('checkins');
    if (v1) {
      const data = JSON.parse(v1);
      if (Array.isArray(data) && data.length > 0) {
        const dest = storageKey('es', 'checkins');
        if (!localStorage.getItem(dest)) {
          localStorage.setItem(dest, v1);
        }
      }
      localStorage.removeItem('checkins');
    }
  } catch(e) {}

  /* v2 → v2.1: chave '{lang}.{key}' sem prefixo polyglot */
  ['es', 'fr', 'zh'].forEach(lang => {
    ['checkins', 'currentDay', 'evaluations', 'metrics', 'settings'].forEach(key => {
      const oldKey = lang + '.' + key;
      const newKey = storageKey(lang, key);
      try {
        const old = localStorage.getItem(oldKey);
        if (old && !localStorage.getItem(newKey)) {
          localStorage.setItem(newKey, old);
        }
        if (old) localStorage.removeItem(oldKey);
      } catch(e) {}
    });
  });

  localStorage.setItem(migratedKey, APP_VERSION);
  localStorage.setItem('polyglot.meta.firstSeen', new Date().toISOString());
}

   PAINEL DE INTELIGÊNCIA — builder de UI

function buildPainel(lang) {
  const p = PROGRAMS[lang];
  const d = calcAccumulated(lang);

  if (!d.totalCheckins) {
    return `
      <div class="pg-h">
        <div class="pg-title">Painel de Inteligência</div>
        <div class="pg-sub">Coach linguístico automático — baseado nos seus check-ins salvos.</div>
      </div>
      <div class="planned-banner">
        <div class="planned-icon">🧠</div>
        <h2>Nenhum dado ainda</h2>
        <p>Salve pelo menos um check-in para ativar o painel.<br>Os dados são calculados automaticamente a partir do seu histórico.</p>
      </div>`;
  }

  /* ── Cores de risco ─────────────────────────────── */
  const riscoColor = { baixo:'var(--p3)', médio:'var(--p2)', alto:'var(--p4)' };
  const riscoC = riscoColor[d.riscoAbandono] || 'var(--p3)';

  /* ── Mini sparkline de compreensão (SVG inline) ─── */
  function sparkline(points) {
    if (!points.length) return '<span style="color:var(--tx3);font-size:12px">sem dados</span>';
    const vals = points.map(p => p.val);
    const min = Math.min(...vals), max = Math.max(...vals);
    const range = max - min || 1;
    const w = 120, h = 32, pad = 2;
    const pts = vals.map((v, i) => {
      const x = pad + (i / Math.max(vals.length-1,1)) * (w - pad*2);
      const y = pad + (1 - (v - min) / range) * (h - pad*2);
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    const last = vals[vals.length-1];
    const trend = vals.length > 1 ? (last > vals[0] ? '↗' : last < vals[0] ? '↘' : '→') : '·';
    const trendColor = trend === '↗' ? 'var(--p3)' : trend === '↘' ? 'var(--p4)' : 'var(--tx3)';
    return `<svg width="${w}" height="${h}" style="vertical-align:middle">
      <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="${+pts.split(' ').pop().split(',')[0]}" cy="${+pts.split(' ').pop().split(',')[1]}" r="3" fill="var(--accent)"/>
    </svg> <span style="color:${trendColor};font-family:'Space Mono',monospace;font-size:12px">${trend} ${last}%</span>`;
  }

  /* ── Barra de progresso inline ─────────────────── */
  const pct = d.diasEstudados > 0 ? Math.min(100, Math.round((Math.max(...(getStore(lang,'checkins')||[]).map(c=>c.dia||0)) / p.totalDays)*100)) : 0;

  /* ── Pontos fortes / fracos como tags ────────────── */
  const tagStrong = d.pontosFortres.map(t =>
    `<span style="display:inline-block;background:var(--p3a);color:var(--p3);border:1px solid var(--p3b);border-radius:3px;padding:3px 9px;font-size:12px;margin:3px 3px 3px 0">${t}</span>`
  ).join('') || '<span style="color:var(--tx3);font-size:13px">Dados insuficientes — continue registrando check-ins.</span>';

  const tagWeak = d.pontosFrageis.map(t =>
    `<span style="display:inline-block;background:var(--p4a);color:var(--p4);border:1px solid var(--p4b);border-radius:3px;padding:3px 9px;font-size:12px;margin:3px 3px 3px 0">${t}</span>`
  ).join('') || '<span style="color:var(--tx3);font-size:13px">Nenhum ponto fraco identificado ainda.</span>';

  return `
    <div class="pg-h">
      <div class="pg-title">Painel de Inteligência</div>
      <div class="pg-sub">Coach automático — ${p.name} · ${d.totalCheckins} check-in(s) analisados · v${APP_VERSION}</div>
    </div>

    <!-- Recomendação principal -->
    <div class="alert" style="border-left:3px solid var(--accent);padding-left:16px">
      <strong>Recomendação:</strong> ${d.recomendacao}
    </div>

    <!-- KPIs principais -->
    <div class="g3" style="margin-bottom:14px">
      <div class="stat">
        <div class="stat-v">${d.diasEstudados}</div>
        <div class="stat-l">dias estudados</div>
      </div>
      <div class="stat">
        <div class="stat-v">${d.streak}</div>
        <div class="stat-l">sequência atual (dias)</div>
      </div>
      <div class="stat">
        <div class="stat-v" style="font-size:18px">${d.projecaoCEFR}</div>
        <div class="stat-l">nível estimado atual</div>
      </div>
    </div>

    <!-- Progresso do programa -->
    <div class="card">
      <div class="card-row"><span class="tag ta">Progresso</span><div class="card-title">Avanço no programa</div></div>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
        <div style="flex:1;height:8px;background:var(--bd);border-radius:4px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:linear-gradient(90deg,var(--p1),var(--accent));border-radius:4px;transition:width .4s"></div>
        </div>
        <span style="font-family:'Space Mono',monospace;font-size:12px;color:var(--accent);flex-shrink:0">${pct}%</span>
      </div>
      <div style="display:flex;gap:24px;font-size:13px;flex-wrap:wrap">
        <span><strong style="color:var(--tx)">${d.hrsAcumuladas}h</strong> <span style="color:var(--tx2)">estimadas de estudo</span></span>
        <span><strong style="color:var(--tx)">${Math.round(d.totalMinFala / 60 * 10)/10}h</strong> <span style="color:var(--tx2)">de fala registrada</span></span>
        <span><strong style="color:var(--tx)">${d.hrsEscutaUber}h</strong> <span style="color:var(--tx2)">escuta Uber estimada</span></span>
        <span><strong style="color:var(--tx)">${d.maiorStreak}</strong> <span style="color:var(--tx2)">maior sequência</span></span>
      </div>
    </div>

    <!-- Consistência -->
    <div class="card">
      <div class="card-row"><span class="tag t3">Consistência</span><div class="card-title">Regularidade de estudo</div></div>
      <div class="mrow">
        <div class="mrow-lbl"><strong>Últimos 7 dias</strong><small>Meta: ≥ 71% (5/7)</small></div>
        <div class="mrow-track"><div class="mrow-fill" style="width:${d.consistencia7d}%;background:${d.consistencia7d>=71?'var(--p3)':d.consistencia7d>=43?'var(--p2)':'var(--p4)'}"></div></div>
        <div class="mrow-target">${d.consistencia7d}%</div>
      </div>
      <div class="mrow">
        <div class="mrow-lbl"><strong>Últimos 30 dias</strong><small>Meta: ≥ 57% (17/30)</small></div>
        <div class="mrow-track"><div class="mrow-fill" style="width:${d.consistencia30d}%;background:${d.consistencia30d>=57?'var(--p3)':d.consistencia30d>=33?'var(--p2)':'var(--p4)'}"></div></div>
        <div class="mrow-target">${d.consistencia30d}%</div>
      </div>
      <div class="mrow">
        <div class="mrow-lbl"><strong>Dias perdidos</strong><small>Desde o primeiro check-in</small></div>
        <div class="mrow-track"><div class="mrow-fill" style="width:${Math.min(100,Math.round(d.diasPerdidos/(d.diasEstudados+d.diasPerdidos||1)*100))}%;background:var(--p4)"></div></div>
        <div class="mrow-target">${d.diasPerdidos} dias</div>
      </div>
    </div>

    <!-- Compreensão -->
    <div class="card">
      <div class="card-row"><span class="tag t1">Compreensão</span><div class="card-title">Evolução auditiva</div></div>
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
        <div>
          <div style="font-family:'Space Mono',monospace;font-size:28px;font-weight:700;color:var(--accent)">${d.mediaCompreensao}%</div>
          <div style="font-size:12px;color:var(--tx2)">média geral · últimos 10 registros:</div>
        </div>
        <div>${sparkline(d.evolucaoCompreensao)}</div>
      </div>
      <div style="margin-top:14px;display:flex;gap:16px;flex-wrap:wrap;font-size:13px">
        <span>Energia média: <strong style="color:var(--accent)">${d.mediaEnergia}/10</strong></span>
        <span>Fala acumulada: <strong style="color:var(--accent)">${d.totalMinFala} min</strong></span>
        <span>Nível estimado: <strong style="color:var(--accent)">${d.projecaoCEFR}</strong></span>
      </div>

    <!-- Projeções -->
    <div class="g2">
      <div class="card">
        <div class="card-title" style="margin-bottom:10px">📅 Projeção de conclusão</div>
        <div style="font-family:'Space Mono',monospace;font-size:22px;font-weight:700;color:var(--accent);margin-bottom:6px">${d.projecaoConclusao}</div>
        <div style="font-size:12px;color:var(--tx2)">Estimativa baseada no ritmo atual de dias estudados vs dias decorridos.</div>
      </div>
      <div class="card">
        <div class="card-title" style="margin-bottom:10px">⚠ Risco de abandono</div>
        <div style="font-family:'Space Mono',monospace;font-size:22px;font-weight:700;color:${riscoC};margin-bottom:6px;text-transform:uppercase">${d.riscoAbandono}</div>
        <div style="font-size:12px;color:var(--tx2)">Calculado com base na consistência dos últimos 7 dias e na energia média registrada.</div>
      </div>
    </div>

    <!-- Pontos fortes e fracos -->
    <div class="card">
      <div class="card-row"><span class="tag t3">Diagnóstico</span><div class="card-title">Pontos fortes</div></div>
      <div>${tagStrong}</div>
    </div>
    <div class="card">
      <div class="card-row"><span class="tag t4">Diagnóstico</span><div class="card-title">Pontos a melhorar</div></div>
      <div>${tagWeak}</div>

    <!-- Atualizar painel -->
    <div class="btns">
      <button class="btn btn-g" onclick="renderPage('painel')">↻ Atualizar</button>
      <button class="btn btn-g" onclick="go('historico', document.querySelector('[onclick*=historico]'))">Ver histórico completo</button>
    </div>`;
}

/* ═══════════════════════════════════════════════════════
   ESTADO GLOBAL
═══════════════════════════════════════════════════════ */
let currentLang = 'es';
let currentPage = 'visao';

/* ═══════════════════════════════════════════════════════
   TROCA DE IDIOMA
═══════════════════════════════════════════════════════ */
function switchLang(lang) {
  if (PROGRAMS[lang].status === 'planned' && lang !== 'es') {
    // Permite entrar mesmo em "planejado" para ver o conteúdo
  }
  currentLang = lang;
  const p = PROGRAMS[lang];

  // Atualizar CSS vars de accent
  document.documentElement.style.setProperty('--accent',   p.accent);
  document.documentElement.style.setProperty('--accent-a', p.accentA);
  document.documentElement.style.setProperty('--accent-b', p.accentB);

  // Botões de idioma
  document.querySelectorAll('.lang-btn').forEach(btn => {
    const l = btn.dataset.lang;
    btn.className = 'lang-btn';
    if (l === lang) btn.classList.add('active-' + lang);
    else if (PROGRAMS[l].status === 'planned') btn.classList.add('planned');
  });

  // Atualizar topbar
  updateTopbar();

  // Renderizar página atual
  renderPage(currentPage);
}

/* ═══════════════════════════════════════════════════════
   TOPBAR DINÂMICO
═══════════════════════════════════════════════════════ */
function updateTopbar() {
  const p = PROGRAMS[currentLang];
  const day = getStore(currentLang, 'currentDay') || 1;

  // Badge
  document.getElementById('day-badge').textContent = 'DIA ' + day + ' / ' + p.totalDays;

  // Pips
  const pipsEl = document.getElementById('phase-pips');
  const labelsEl = document.getElementById('phase-labels');
  pipsEl.innerHTML = '';
  labelsEl.innerHTML = '';

  const currentPhase = p.phases.findIndex(ph => day <= ph.end);
  const activeIdx = currentPhase === -1 ? p.phases.length - 1 : currentPhase;

  p.phases.forEach((ph, i) => {
    const pip = document.createElement('div');
    pip.className = 't-pip' + (i > activeIdx ? ' dim' : '');
    pip.style.background = ph.color;
    pip.title = ph.name + ' · ' + ph.days;
    pipsEl.appendChild(pip);

    const lbl = document.createElement('span');
    lbl.className = 't-lbl';
    lbl.textContent = ph.num;
    labelsEl.appendChild(lbl);
  });
}

function onDayChange(val) {
  const p = PROGRAMS[currentLang];
  const day = Math.min(p.totalDays, Math.max(1, parseInt(val) || 1));
  setStore(currentLang, 'currentDay', day);
  updateTopbar();
}

/* ═══════════════════════════════════════════════════════
   NAVEGAÇÃO
═══════════════════════════════════════════════════════ */
function go(pageId, btn) {
  currentPage = pageId;
  document.querySelectorAll('.s-item').forEach(s => s.classList.remove('on'));
  if (btn) btn.classList.add('on');
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('content').scrollTo(0, 0);
  renderPage(pageId);
}

function renderPage(pageId) {
  const langContent = CONTENT[currentLang];
  const root = document.getElementById('page-root');

  if (!langContent || !langContent[pageId]) {
    root.innerHTML = '<div class="planned-banner"><div class="planned-icon">🚧</div><h2>Conteúdo não disponível</h2><p>Esta seção ainda não está configurada para este idioma.</p></div>';
    return;
  }

  root.innerHTML = langContent[pageId]();

  // Reinit ranges após renderização
  root.querySelectorAll('input[type="range"]').forEach(r => {
    const pct = ((r.value - r.min) / (r.max - r.min)) * 100;
    r.style.backgroundSize = pct + '% 100%';
  });

  // Restaurar dia salvo no checkin
  const diaInput = document.getElementById('ci-dia');
  if (diaInput) {
    const saved = getStore(currentLang, 'currentDay') || 1;
    diaInput.value = saved;
    onDayChange(saved);
  }
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}
document.getElementById('content').addEventListener('click', () => {
  if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
});

/* ═══════════════════════════════════════════════════════
   ACCORDIONS
═══════════════════════════════════════════════════════ */
function toggleAcc(el) { el.classList.toggle('open'); }
function toggleRot(el) { el.classList.toggle('open'); }

/* ═══════════════════════════════════════════════════════
   RANGES
═══════════════════════════════════════════════════════ */
function updateRange(el, labelId, suffix) {
  const pct = ((el.value - el.min) / (el.max - el.min)) * 100;
  el.style.backgroundSize = pct + '% 100%';
  const lbl = document.getElementById(labelId);
  if (lbl) lbl.textContent = el.value + suffix;
}

/* ═══════════════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════════════ */
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + (type || 'ok');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => { t.className = ''; }, 3200);
}

/* ═══════════════════════════════════════════════════════
   COLETA DO FORMULÁRIO
═══════════════════════════════════════════════════════ */
function collectForm() {
  const get = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
  const getN = id => { const el = document.getElementById(id); return el ? (parseInt(el.value) || 0) : undefined; };
  return {
    dia:          getN('ci-dia'),
    sessao:       get('ci-sessao'),
    tipoDia:      get('ci-tipo-dia'),
    fluency:      get('ci-fluency'),
    drops:        get('ci-drops'),
    vocab:        get('ci-vocab'),
    escutaAtiva:  get('ci-escuta-ativa'),
    escutaMorto:  get('ci-escuta-morto'),
    criacao:      get('ci-criacao'),
    fonetica:     get('ci-fonetica'),
    skritter:     get('ci-skritter'),
    compreensao:  getN('ci-compreensao'),
    fala:         getN('ci-fala'),
    energia:      getN('ci-energia'),
    pronuncia:    getN('ci-pronuncia'),
    tons:         getN('ci-tons'),
    chars:        getN('ci-chars'),
    portuhol:     get('ci-portuhol'),
    traducao:     get('ci-traducao'),
    liaison:      get('ci-liaison'),
    somDificil:   get('ci-som-dificil'),
    pinyin:       get('ci-pinyin'),
    tomDificil:   get('ci-tom-dificil'),
    dificuldade:  get('ci-dificuldade'),
    avanco:       get('ci-avanco'),
  };
}

/* ═══════════════════════════════════════════════════════
   SALVAR / EXPORTAR / IMPORTAR / LIMPAR
═══════════════════════════════════════════════════════ */
function salvarCheckin() {
  const lang = currentLang;
  const data = Object.assign(collectForm(), { timestamp: new Date().toISOString(), lang });
  let arr = getStore(lang, 'checkins') || [];
  if (!Array.isArray(arr)) arr = [];
  arr.push(data);
  setStore(lang, 'checkins', arr);
  toast('Check-in salvo em ' + PROGRAMS[lang].name + '. Total: ' + arr.length + ' registro(s).');
}

function exportarCheckins() {
  const lang = currentLang;
  const arr = getStore(lang, 'checkins') || [];
  if (!arr.length) { toast('Nenhum check-in salvo para ' + PROGRAMS[lang].name + '.', 'err'); return; }
  const blob = new Blob([JSON.stringify(arr, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'checkins_' + lang + '.json';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  toast('Exportado: ' + arr.length + ' registro(s) de ' + PROGRAMS[lang].name + '.');
}

function importarCheckins() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!Array.isArray(data)) throw new Error('Formato inválido');
        const lang = currentLang;
        const existing = getStore(lang, 'checkins') || [];
        const merged = [...existing, ...data.filter(d => d.lang === lang || !d.lang)];
        setStore(lang, 'checkins', merged);
        toast('Importados: ' + data.length + ' registro(s). Total: ' + merged.length + '.');
        renderPage('historico');
      } catch(err) { toast('Erro ao importar: ' + err.message, 'err'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function limparCheckin() {
  const fields = ['ci-fluency','ci-drops','ci-vocab','ci-escuta-ativa','ci-escuta-morto',
    'ci-criacao','ci-fonetica','ci-skritter','ci-fala','ci-chars',
    'ci-dificuldade','ci-avanco','ci-som-dificil','ci-tom-dificil'];
  fields.forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  ['ci-sessao','ci-tipo-dia','ci-portuhol','ci-traducao','ci-liaison','ci-pinyin'].forEach(id => {
    const el = document.getElementById(id); if (el) el.value = '';
  });
  const ranges = [
    ['ci-compreensao','compr-val','%',40],
    ['ci-energia','energ-val','',7],
    ['ci-pronuncia','pron-val','',5],
    ['ci-tons','ton-val','',5],
  ];
  ranges.forEach(([rid, lid, suf, def]) => {
    const el = document.getElementById(rid);
    const lbl = document.getElementById(lid);
    if (el) { el.value = def; updateRange(el, lid, suf); }
    if (lbl) lbl.textContent = def + suf;
  });
  const out = document.getElementById('analysis-out');
  if (out) { out.classList.remove('vis'); out.innerHTML = ''; }
}

/* ═══════════════════════════════════════════════════════
   PAINEL DE INTELIGÊNCIA — motor de cálculo
═══════════════════════════════════════════════════════ */
function calcAccumulated(lang) {
  const checkins = getStore(lang, 'checkins') || [];
  const p = PROGRAMS[lang];
  const total = checkins.length;
  if (!total) return {
    totalCheckins:0, diasEstudados:0, diasPerdidos:0, streak:0,
    maiorStreak:0, consistencia7d:0, consistencia30d:0,
    mediaCompreensao:0, mediaEnergia:0, totalMinFala:0,
    evolucaoCompreensao:[], projecaoConclusao:'—',
    projecaoCEFR:'—', riscoAbandono:'baixo',
    pontosFortres:[], pontosFrageis:[],
    hrsAcumuladas:0, hrsEscutaUber:0,
  };

  /* ── Dias estudados e streak ─────────────────────── */
  const diasSet = new Set(checkins.map(c => c.dia));
  const diasEstudados = diasSet.size;
  const diasPerdidos  = Math.max(0, (Math.max(...diasSet) - 1) - (diasEstudados - 1));

  // streak atual (dias consecutivos ao final da sequência registrada)
  const diasOrdenados = [...diasSet].sort((a,b) => a-b);
  let streak = 1, maiorStreak = 1, tmpStreak = 1;
  for (let i = 1; i < diasOrdenados.length; i++) {
    if (diasOrdenados[i] === diasOrdenados[i-1] + 1) {
      tmpStreak++;
      maiorStreak = Math.max(maiorStreak, tmpStreak);
    } else { tmpStreak = 1; }
  }
  // streak atual: contar do final
  streak = 1;
  for (let i = diasOrdenados.length - 1; i > 0; i--) {
    if (diasOrdenados[i] === diasOrdenados[i-1] + 1) streak++;
    else break;
  }

  /* ── Consistência (%) ────────────────────────────── */
  const now = Math.max(...diasOrdenados);
  const last7  = checkins.filter(c => c.dia >= now - 6);
  const last30 = checkins.filter(c => c.dia >= now - 29);
  const consistencia7d  = Math.round((new Set(last7.map(c=>c.dia)).size  / 7)  * 100);
  const consistencia30d = Math.round((new Set(last30.map(c=>c.dia)).size / 30) * 100);

  /* ── Médias ──────────────────────────────────────── */
  const comps   = checkins.map(c => c.compreensao).filter(v => v != null && v > 0);
  const energias= checkins.map(c => c.energia).filter(v => v != null);
  const falas   = checkins.map(c => c.fala || 0);
  const mediaCompreensao = comps.length    ? Math.round(comps.reduce((a,b)=>a+b,0)/comps.length) : 0;
  const mediaEnergia     = energias.length ? +(energias.reduce((a,b)=>a+b,0)/energias.length).toFixed(1) : 0;
  const totalMinFala     = falas.reduce((a,b)=>a+b,0);

  /* ── Horas estimadas ─────────────────────────────── */
  const minPorSessao = { completa:105, padrao:67, minima:28, zero:0 };
  const hrsAcumuladas = +(checkins.reduce((acc, c) => acc + (minPorSessao[c.sessao] || 50), 0) / 60).toFixed(1);
  const hrsEscutaUber = +(checkins.filter(c => c.escutaMorto && c.escutaMorto.length > 2).length * 0.6).toFixed(1);

  /* ── Evolução da compreensão (últimos 10 pontos) ──── */
  const evolucaoCompreensao = checkins
    .filter(c => c.compreensao > 0)
    .slice(-10)
    .map(c => ({ dia: c.dia, val: c.compreensao }));

  /* ── Projeção de conclusão ───────────────────────── */
  let projecaoConclusao = '—';
  if (diasEstudados >= 5 && mediaCompreensao > 0) {
    const ritmo = diasEstudados / Math.max(...diasOrdenados); // dias estudados / dias decorridos
    const diasRestantes = p.totalDays - Math.max(...diasOrdenados);
    const diasEstimados = Math.round(diasRestantes / Math.max(ritmo, 0.3));
    const dataFim = new Date();
    dataFim.setDate(dataFim.getDate() + diasEstimados);
    projecaoConclusao = dataFim.toLocaleDateString('pt-BR', { month:'short', year:'numeric' });
  }

  /* ── Projeção CEFR ───────────────────────────────── */
  const cefr = {
    es: [[40,'A1'],[55,'A2'],[65,'B1 inicial'],[75,'B1'],[82,'B2 inicial'],[100,'B2']],
    fr: [[40,'A1'],[50,'A2 inicial'],[60,'A2'],[68,'B1 inicial'],[75,'B1'],[100,'B1+']],
    zh: [[35,'HSK1'],[45,'HSK2'],[55,'HSK3'],[65,'HSK4'],[72,'HSK5'],[100,'HSK5+']],
  };
  const cefrMap = cefr[lang] || cefr.es;
  const projecaoCEFR = (cefrMap.find(([thr]) => mediaCompreensao <= thr) || cefrMap.slice(-1)[0])[1];

  /* ── Risco de abandono ───────────────────────────── */
  let riscoAbandono = 'baixo';
  if (consistencia7d < 30 || mediaEnergia < 4) riscoAbandono = 'alto';
  else if (consistencia7d < 57 || mediaEnergia < 5.5) riscoAbandono = 'médio';

  /* ── Pontos fortes e fracos ──────────────────────── */
  const pontosFortres = [], pontosFrageis = [];
  if (consistencia7d >= 70) pontosFortres.push('Consistência semanal alta (' + consistencia7d + '%)');
  if (totalMinFala >= diasEstudados * 3) pontosFortres.push('Prática oral acima da meta');
  if (mediaCompreensao >= 60) pontosFortres.push('Compreensão auditiva em boa progressão');
  if (streak >= 7) pontosFortres.push('Sequência de ' + streak + ' dias consecutivos');
  if (mediaEnergia >= 7) pontosFortres.push('Energia e motivação elevadas');

  if (consistencia7d < 57) pontosFrageis.push('Consistência semanal abaixo de 5/7 dias');
  if (totalMinFala < diasEstudados * 2) pontosFrageis.push('Prática oral abaixo da meta');
  if (mediaCompreensao > 0 && mediaCompreensao < 40) pontosFrageis.push('Compreensão auditiva ainda baixa — aumentar input compreensível');
  if (mediaEnergia > 0 && mediaEnergia < 5) pontosFrageis.push('Energia/motivação baixa — considerar sessões mínimas até recuperar ritmo');

  /* ── Recomendação automática ─────────────────────── */
  let recomendacao = 'Mantenha o ritmo atual. Consistência acima de tudo.';
  if (riscoAbandono === 'alto') recomendacao = 'Risco de abandono detectado. Use apenas sessão mínima esta semana. O hábito vale mais que a intensidade.';
  else if (pontosFrageis.includes('Prática oral abaixo da meta')) recomendacao = 'Prioridade: adicionar 5 min extras de fala por dia. Shadowing no Uber conta.';
  else if (mediaCompreensao > 0 && mediaCompreensao < 40) recomendacao = 'Foque em input compreensível fácil. Reduzir dificuldade melhora a compreensão mais rápido que aumentar volume.';
  else if (streak >= 14) recomendacao = streak + ' dias seguidos — você está no ritmo. Considere avançar a dificuldade do input.';

  return {
    totalCheckins, diasEstudados, diasPerdidos, streak, maiorStreak,
    consistencia7d, consistencia30d, mediaCompreensao, mediaEnergia,
    totalMinFala, evolucaoCompreensao, projecaoConclusao, projecaoCEFR,
    riscoAbandono, pontosFortres, pontosFrageis, recomendacao,
    hrsAcumuladas, hrsEscutaUber,
  };
}

/* ═══════════════════════════════════════════════════════
   ANÁLISE LOCAL
═══════════════════════════════════════════════════════ */
function analisarLocal() {
  const f = collectForm();
  const lang = currentLang;
  const p = PROGRAMS[lang];
  const phaseIdx = p.phases.findIndex(ph => f.dia <= ph.end);
  const fase = phaseIdx === -1 ? p.phases.length : phaseIdx + 1;
  const ph = p.phases[Math.min(phaseIdx, p.phases.length - 1)];

  const compMetas = {
    es: [35, 55, 67, 77, 82],
    fr: [35, 50, 60, 67, 72, 75],
    zh: [30, 40, 50, 60, 68, 76],
  };
  const talkMetas = {
    es: [2, 3, 5, 7, 10],
    fr: [2, 3, 5, 8, 10, 12],
    zh: [1, 2, 4, 6, 8, 12],
  };
  const metaComp = compMetas[lang][Math.min(fase - 1, compMetas[lang].length - 1)];
  const metaFala = talkMetas[lang][Math.min(fase - 1, talkMetas[lang].length - 1)];

  const sessaoMap = { completa:'completa', padrao:'padrão', minima:'mínima', zero:'sem estudo' };
  const diaMap = { 'folga-ok':'folga recuperada', 'folga-cansado':'folga cansado', 'pos-plantao':'pós-plantão', 'plantao':'plantão' };
  const dayRec = { 'plantao':'minima', 'pos-plantao':'minima', 'folga-cansado':'padrao', 'folga-ok':'completa' };

  let diag = `Dia ${f.dia} — ${p.name}, Fase ${fase} (${ph ? ph.name : ''}). Tipo de dia: ${diaMap[f.tipoDia] || 'não informado'}. Sessão: ${sessaoMap[f.sessao] || 'não informada'}.`;
  const rec = dayRec[f.tipoDia];
  if (rec && f.sessao && f.sessao !== rec) diag += ` A sessão não está alinhada com o tipo de dia (recomendado: ${sessaoMap[rec]}).`;

  let metr = `Compreensão: ${f.compreensao}% (meta da fase: ~${metaComp}%). `;
  metr += f.compreensao < metaComp - 10 ? 'Abaixo do esperado. ' : f.compreensao >= metaComp ? 'Dentro ou acima da meta. ' : 'Próximo da meta. ';
  metr += `Fala: ${f.fala} min (meta: ≥${metaFala} min). `;
  metr += f.fala < metaFala ? 'Ampliar prática oral. ' : 'Tempo adequado. ';

  if (lang === 'zh' && f.tons !== undefined) metr += `Tons: ${f.tons}/10. ${f.chars ? 'Caracteres: ~' + f.chars + '.' : ''}`;
  if (lang === 'fr' && f.pronuncia !== undefined) metr += `Pronúncia: ${f.pronuncia}/10.`;

  const alertas = [];
  if (f.compreensao < metaComp - 15) alertas.push('Compreensão bem abaixo da meta — revise conteúdo já estudado antes de avançar.');
  if (f.fala < metaFala) alertas.push(`Fala abaixo da meta — acrescente ${Math.max(1, metaFala - f.fala)} min de prática oral amanhã.`);
  if (lang === 'es' && (f.portuhol === 'alta' || f.portuhol === 'média')) alertas.push('Portunhol perceptível — ative o módulo de desportuguesização.');
  if (lang === 'fr' && (f.liaison === 'difícil')) alertas.push('Liaison/enchaînement difícil — pratique em grupo rítmico, não como regra isolada.');
  if (lang === 'zh' && f.tons < 6) alertas.push('Precisão de tons baixa — prefira lento e correto, reduza velocidade do shadowing.');
  const alrt = alertas.length ? alertas.join(' ') : 'Parâmetros dentro do esperado. Mantenha a consistência.';

  let ajuste = '';
  if (f.compreensao < metaComp - 10) ajuste = 'Prioridade: reexpor-se a conteúdo familiar antes de avançar. Reduza dificuldade do input.';
  else if (f.fala < metaFala) ajuste = `Acrescente ${Math.max(1, metaFala - f.fala)} min de fala sem roteiro na próxima sessão.`;
  else if (lang === 'zh' && f.tons < 6) ajuste = 'Foco nos tons: shadowing em velocidade reduzida com exagero intencional dos contornos tonais.';
  else if (lang === 'fr' && f.pronuncia < 5) ajuste = 'Dedique 5 min extras à fonética ativa — escolha 1 som-problema e repita em 10 contextos diferentes.';
  else ajuste = 'Manter ritmo. Consistência é mais importante que intensidade em dias isolados.';

  const dayType = f.tipoDia;
  let prox = dayType === 'plantao' || dayType === 'pos-plantao' ? 'Sessão mínima amanhã: só revisão e escuta passiva.' : 'Sessão padrão ou completa conforme energia.';
  prox += f.compreensao >= metaComp + 5 ? ' Compreensão alta — considere retirar um apoio (legenda, pinyin) no próximo input.' : '';

  renderAnalysis([
    { label: 'DIAGNÓSTICO DO DIA', text: diag },
    { label: 'MÉTRICAS EM FOCO',   text: metr },
    { label: 'ALERTA OU REFORÇO',  text: alrt },
    { label: 'AJUSTE PRIORITÁRIO', text: ajuste },
    { label: 'PRÓXIMO DIA',        text: prox },
  ]);
}

/* ═══════════════════════════════════════════════════════
   ANÁLISE IA (Cloudflare Worker)
═══════════════════════════════════════════════════════ */
const WORKER_URL = 'https://seu-worker.workers.dev/analisar';

async function analisarIA() {
  const f = collectForm();
  const lang = currentLang;
  const p = PROGRAMS[lang];
  const phaseIdx = p.phases.findIndex(ph => f.dia <= ph.end);
  const fase = phaseIdx === -1 ? p.phases.length : phaseIdx + 1;
  const ph = p.phases[Math.min(phaseIdx, p.phases.length - 1)];

  const out = document.getElementById('analysis-out');
  if (!out) return;
  out.classList.add('vis');
  out.innerHTML = '<div class="ao-loading">Analisando check-in com IA</div>';

  const btn = document.getElementById('btn-ia');
  if (btn) btn.disabled = true;

  /* Enriquecer payload com histórico recente e métricas acumuladas */
  const recentHistory = (getStore(lang, 'checkins') || []).slice(-5).map(h => ({
    dia:         h.dia,
    compreensao: h.compreensao,
    fala:        h.fala,
    energia:     h.energia,
    sessao:      h.sessao,
    tipoDia:     h.tipoDia,
    portuhol:    h.portuhol,
    traducao:    h.traducao,
    tons:        h.tons,
    avanco:      h.avanco,
    dificuldade: h.dificuldade,
  }));

  const accumulated = calcAccumulated(lang);

  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        appVersion:  APP_VERSION,
        language:    lang,
        program:     { totalDays: p.totalDays, name: p.name },
        phase:       ph ? ph.name : '',
        phaseNum:    fase,
        day:         f.dia,
        metrics:     {
          compreensao: f.compreensao,
          fala:        f.fala,
          energia:     f.energia,
          portuhol:    f.portuhol,
          traducao:    f.traducao,
          tons:        f.tons,
          pronuncia:   f.pronuncia,
          chars:       f.chars,
          pinyin:      f.pinyin,
        },
        history:      recentHistory,
        accumulated: {
          totalCheckins:     accumulated.totalCheckins,
          consistencia7d:    accumulated.consistencia7d,
          mediaCompreensao:  accumulated.mediaCompreensao,
          totalMinFala:      accumulated.totalMinFala,
          streak:            accumulated.streak,
        },
        currentCheckin: f,
      })
    });
    const data = await res.json();
    let text = '';
    if (typeof data === 'string') text = data;
    else if (Array.isArray(data?.content)) text = data.content.map(b => b.text || '').join('');
    else if (typeof data?.analysis === 'string') text = data.analysis;
    else if (typeof data?.result === 'string') text = data.result;
    else text = JSON.stringify(data);
    parseSections(text);
  } catch (err) {
    if (out) out.innerHTML = `<div class="ao-sec"><div class="ao-lbl" style="color:var(--p4)">Erro</div><div>${err.message}</div></div>`;
  }

  if (btn) btn.disabled = false;
}

function parseSections(text) {
  const secs = ['DIAGNÓSTICO DO DIA','MÉTRICAS EM FOCO','ALERTA OU REFORÇO','AJUSTE PRIORITÁRIO','PRÓXIMO DIA'];
  const result = [];
  for (let i = 0; i < secs.length; i++) {
    const s = secs[i], next = secs[i + 1];
    const start = text.indexOf(s);
    if (start === -1) continue;
    const end = next ? text.indexOf(next) : text.length;
    const content = text.slice(start + s.length, end !== -1 ? end : text.length).replace(/^[\s:\n]+/, '').trim();
    result.push({ label: s, text: content });
  }
  renderAnalysis(result.length ? result : [{ label: 'RESPOSTA', text }]);
}

function renderAnalysis(sections) {
  const out = document.getElementById('analysis-out');
  if (!out) return;
  out.classList.add('vis');
  out.innerHTML = sections.map(s =>
    `<div class="ao-sec"><div class="ao-lbl">${s.label}</div><div>${s.text}</div></div>`
  ).join('');
}
