  trem:      '<rect x="5" y="3" width="14" height="13" rx="3"/><path d="M5 10h14M8.5 13h.01M15.5 13h.01M8 16l-2 4M16 16l2 4"/>',
};

/* Tipos de carimbo; o título no idioma estudado vem de JORNADA_FALAS */
const JORNADA_CARIMBOS = {
  sol:       { icone: 'sol',       desc: 'Folga' },
  amanhecer: { icone: 'amanhecer', desc: 'Pós-plantão' },
  noturno:   { icone: 'lua',       desc: 'Plantão' },
  descanso:  { icone: 'descanso',  desc: 'Dia sem estudo' },
  sellado:   { icone: 'selo',      desc: 'Check-in' },
  chegada:   { icone: 'pin',       desc: 'Chegada a uma cidade nova', especial: true },
  aduana:    { icone: 'aduana',    desc: 'Dia de avaliação',          especial: true },
  retorno:   { icone: 'brilho',    desc: 'Volta depois de uma pausa', especial: true },
};

function jornadaIcone(nome) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (JORNADA_ICONES[nome] || '') + '</svg>';
}

function ritmoAtual() {
  return RITMOS[RITMO_PADRAO];
}

function jornadaDisponivel(lang) {
  return !!JORNADA_CIDADES[lang];
}

function jornadaPrefs(lang) {
  const salvo = getStore(lang, 'jornada') || {};
  return { ativo: salvo.ativo !== false, visto: Number(salvo.visto) || 0 };
}

function jornadaAtiva(lang) {
  return jornadaDisponivel(lang) && jornadaPrefs(lang).ativo;
}

function tipoCarimbo(c) {
  if (c.sessao === 'zero') return 'descanso';
  if (c.tipoDia === 'plantao') return 'noturno';
  if (c.tipoDia === 'pos-plantao') return 'amanhecer';
  if (c.tipoDia === 'folga-ok' || c.tipoDia === 'folga-cansado') return 'sol';
  return 'sellado';
}

/* Último registro de cada dia do programa */
function checkinsPorDia(lang) {
  const porDia = new Map();
  lerCheckins(lang).forEach((c, ordem) => {
    const dia = c.dia;
    const ts = Date.parse(c.timestamp) || 0;
    const atual = porDia.get(dia);
    if (!atual || ts > atual._ts || (ts === atual._ts && ordem > atual._ordem)) {
      porDia.set(dia, { ...c, dia, _ts: ts, _ordem: ordem });
    }
  });
  return porDia;
}

function calcJornada(lang) {
  const p = PROGRAMS[lang];
  const ritmo = ritmoAtual();
  const N = ritmo.ciclo;
  const porDia = checkinsPorDia(lang);
  const hoje = Math.max(1, Math.min(p.totalDays, diaSugerido(lang)));
  const nAtual = Math.ceil(hoje / N);
  /* Trechos antes do primeiro check-in não contam como pausa */
  const primeiroDia = porDia.size ? Math.min(...porDia.keys()) : 0;
  const nInicio = primeiroDia ? Math.ceil(primeiroDia / N) : nAtual;
  const estudou = c => !!c && c.sessao !== 'zero';
  const faseDoDia = dia => {
    const i = p.phases.findIndex(ph => dia >= ph.start && dia <= ph.end);
    return i === -1 ? p.phases.length - 1 : i;
  };

  /* Trechos: um por ciclo do programa */
  const ciclos = [];
  for (let n = 1; n <= Math.ceil(p.totalDays / N); n++) {
    const inicio = (n - 1) * N + 1;
    const fim = Math.min(p.totalDays, n * N);
    let estudo = 0;
    for (let d = inicio; d <= fim; d++) if (estudou(porDia.get(d))) estudo++;
    const minimo = Math.min(ritmo.minimo, fim - inicio + 1);
    ciclos.push({
      n, inicio, fim, estudo, minimo,
      aceso: estudo >= minimo,
      atual: n === nAtual,
      passado: n < nAtual && n >= nInicio,
      antes: n < nInicio,
      fase: faseDoDia(inicio),
      avaliacao: p.evaluationDays.find(d => d >= inicio && d <= fim) || 0,
      retorno: false,
    });
  }

  /* Carimbos: chegada, retorno e aduana antes do carimbo do dia */
  const carimbos = [];
  const fasesVistas = new Set();
  let anterior = 0;
  [...porDia.keys()].sort((a, b) => a - b).forEach(dia => {
    const c = porDia.get(dia);
    const base = { dia, fase: faseDoDia(dia), ts: c._ts };
    if (!fasesVistas.has(base.fase)) {
      fasesVistas.add(base.fase);
      carimbos.push({ ...base, tipo: 'chegada' });
    }
    if (anterior && dia - anterior - 1 >= N) {
      carimbos.push({ ...base, tipo: 'retorno' });
      ciclos[Math.ceil(dia / N) - 1].retorno = true;
    }
    if (p.evaluationDays.includes(dia)) carimbos.push({ ...base, tipo: 'aduana' });
    carimbos.push({ ...base, tipo: tipoCarimbo(c) });
    anterior = dia;
  });

  /* Ritmo: trechos acesos entre os últimos 7 já encerrados */
  const encerrados = ciclos.filter(c => c.passado).slice(-7);
  const atual = ciclos[nAtual - 1];
  const diasLivres = atual.fim - hoje + (estudou(porDia.get(hoje)) ? 0 : 1);
  const falta = Math.max(0, atual.minimo - atual.estudo);

  /* Pausas seguidas: trechos encerrados sem o mínimo, do mais recente para trás.
     Estudar no trecho atual encerra a série: a pessoa voltou. */
  let pausasSeguidas = 0;
  for (let i = nAtual - 2; i >= nInicio - 1 && !ciclos[i].aceso; i--) pausasSeguidas++;
  const voltou = pausasSeguidas > 0 && atual.estudo > 0;
  if (atual.estudo > 0) pausasSeguidas = 0;

  /* Série de trechos acesos seguidos (o trecho em andamento só soma quando acende) */
  let serieAtual = 0, maiorSerie = 0;
  ciclos.forEach(c => {
    if (c.antes || !(c.passado || c.atual)) return;
    if (c.aceso) { serieAtual++; maiorSerie = Math.max(maiorSerie, serieAtual); }
    else if (c.passado) serieAtual = 0;
  });

  return {
    lang, ritmo, hoje, ciclos, carimbos,
    cidades: JORNADA_CIDADES[lang] || [],
    faseAtual: faseDoDia(hoje),
    cicloAtual: atual,
    falta,
    podeAcender: falta > 0 && falta <= diasLivres,
    proximoInicio: atual.fim < p.totalDays ? atual.fim + 1 : 0,
    ritmoAcesos: encerrados.filter(c => c.aceso).length,
    ritmoTotal: encerrados.length,
    trechosAcesos: ciclos.filter(c => c.aceso).length,
    pausasSeguidas, voltou, serieAtual, maiorSerie,
    concluida: porDia.has(p.totalDays),
    encerradosAcesos: ciclos.filter(c => c.passado && c.aceso).length,
    encerradosTotal: ciclos.filter(c => c.passado).length,
    vazio: porDia.size === 0,
  };
}

function jornadaDias(n) {
  return n + (n === 1 ? ' dia' : ' dias');
}

function jornadaMensagemGuia(j) {
  const cidade = j.cidades[j.faseAtual] || { nome: '' };
  if (j.vazio) return 'A viagem começa no primeiro check-in, com o carimbo de chegada em ' + cidade.nome + '.';
  if (j.concluida && j.hoje === PROGRAMS[j.lang].totalDays) return 'Fim da linha em ' + cidade.nome + ': viagem concluída! Novos registros atualizam o último dia.';
  const voltouHoje = j.carimbos.some(c => c.dia === j.hoje && c.tipo === 'retorno');
  if (voltouHoje) return jornadaFala(j.lang).retorno;
  if (j.cicloAtual.aceso) return 'Este trecho já está aceso. O resto do ciclo é bônus, sem obrigação.';
  if (j.podeAcender) return 'Mais ' + jornadaDias(j.falta) + ' de estudo e este trecho acende. Sessão mínima vale.';
  if (j.proximoInicio) return 'Este trecho fica como pausa, e tudo bem. O próximo começa no dia ' + j.proximoInicio + '.';
  return 'Última parada: ' + cidade.nome + '.';
}

function jornadaStatusTrecho(j) {
  if (j.concluida && j.hoje === PROGRAMS[j.lang].totalDays) return { v: 'fim', l: 'viagem concluída' };
  if (j.cicloAtual.aceso) return { v: 'aceso', l: 'este trecho' };
  if (j.podeAcender) return { v: jornadaDias(j.falta), l: 'de estudo para acender este trecho' };
  if (j.proximoInicio) return { v: 'dia ' + j.proximoInicio, l: 'começa o próximo trecho' };
  return { v: 'fim', l: 'último trecho da viagem' };
}

function jornadaMapa(j) {
  const p = PROGRAMS[j.lang];
  const fala = jornadaFala(j.lang);
  const estacoes = p.phases.map((ph, i) => {
    const cidade = j.cidades[i] || { nome: ph.name, codigo: ph.num };
    /* Nome no idioma estudado quando difere do português (com pinyin no mandarim) */
    const local = cidade.local && cidade.local !== cidade.nome
      ? `<span class="jn-est-local" lang="${fala.lang}">${cidade.local}${cidade.pinyin ? ` <span lang="zh-Latn-pinyin">${cidade.pinyin}</span>` : ''}</span>`
      : '';
    const trechos = j.ciclos.filter(c => c.fase === i);
    const acesos = trechos.filter(c => c.aceso).length;
    const retornos = trechos.filter(c => c.retorno).length;
    const situacao = i < j.faseAtual ? 'jn-passada' : i === j.faseAtual ? 'jn-aqui' : 'jn-futura';
    const pontos = trechos.map(c => {
      const estado = c.aceso ? 'aceso' : c.passado ? 'pausa' : c.atual ? '' : 'futuro';
      const classes = ['jn-t', estado, c.atual ? 'atual' : '', c.retorno ? 'rt' : '', c.avaliacao ? 'av' : ''].filter(Boolean).join(' ');
      const texto = c.aceso ? 'aceso (' + jornadaDias(c.estudo) + ' de estudo)'
        : c.passado ? 'pausa'
        : c.antes ? 'antes do primeiro check-in'
        : c.atual ? 'em andamento (' + c.estudo + ' de ' + c.minimo + ')'
        : 'pela frente';
      const titulo = 'Trecho ' + c.n + ' · dias ' + c.inicio + '–' + c.fim + ' · ' + texto
        + (c.retorno ? ' · retorno' : '') + (c.avaliacao ? ' · aduana no dia ' + c.avaliacao : '');
      return `<li class="${classes}" title="${titulo}"></li>`;
    }).join('');
    return `
      <li class="jn-est ${situacao}" style="--fc:var(--p${(i % 6) + 1})">
        <div class="jn-est-head">
          <span class="jn-est-cod">${cidade.codigo}</span>
          <span class="jn-est-nome">${cidade.nome}</span>
          ${local}
          <span class="jn-est-fase">${ph.num} · ${ph.name} · dias ${ph.days}</span>
          ${i === j.faseAtual ? '<span class="jn-est-aqui">você está aqui</span>' : ''}
          <span class="jn-est-resumo" aria-hidden="true">${acesos}/${trechos.length}</span>
        </div>
        <ul class="jn-trechos" aria-hidden="true">${pontos}</ul>
        <p class="jn-vh">${cidade.nome}: ${acesos} de ${trechos.length} trechos acesos${retornos ? ', ' + retornos + (retornos === 1 ? ' retorno' : ' retornos') : ''}.</p>
      </li>`;
  }).join('');

  return `
    <div class="card">
      <div class="card-row"><span class="tag ta">Rota</span><div class="card-title">Mapa da viagem</div></div>
      <ol class="jn-linha">${estacoes}</ol>
      <div class="jn-legenda" aria-hidden="true">
        <span><i class="jn-t aceso"></i>aceso: ${j.ritmo.minimo}+ dias de estudo no ciclo</span>
        <span><i class="jn-t pausa"></i>pausa, sem culpa</span>
        <span><i class="jn-t aceso rt"></i>retorno</span>
        <span><i class="jn-t atual"></i>trecho atual</span>
        <span><i class="jn-t futuro av"></i>aduana (avaliação)</span>
      </div>
    </div>`;
}

function jornadaCarimbo(c, j, novoDesde) {
  const def = JORNADA_CARIMBOS[c.tipo];
  const fala = jornadaFala(j.lang);
  const cidade = j.cidades[c.fase];
  const hoje = c.dia === j.hoje && !def.especial;
  const rot = ((c.dia * 47 + c.tipo.length * 13) % 15) - 7;
  const classes = ['jn-cb', 'jn-cb-' + c.tipo,
    def.especial ? 'jn-cb-esp' : '',
    hoje ? 'jn-cb-hoje' : '',
    novoDesde && c.ts > novoDesde ? 'jn-cb-novo' : ''].filter(Boolean).join(' ');
  const linha = c.tipo === 'chegada' && cidade
    ? cidade.local + (cidade.pinyin ? ' ' + cidade.pinyin : '')
    : fala.dia(c.dia) + (hoje ? ' · ' + fala.hoje : '');
  const pinyin = fala.pinyin ? fala.pinyin[c.tipo] : '';
  return `
        <li class="${classes}" style="--rot:${rot}deg" title="${def.desc} · dia ${c.dia}">
          ${jornadaIcone(def.icone)}
          <span class="jn-cb-t" lang="${fala.lang}">${fala.titulos[c.tipo]}</span>
          ${pinyin ? `<span class="jn-cb-p" lang="zh-Latn-pinyin">${pinyin}</span>` : ''}
          <span class="jn-cb-d" lang="${fala.lang}">${linha}</span>
          <span class="jn-vh">${def.desc}, dia ${c.dia}.</span>
        </li>`;
}

function jornadaPassaporte(j) {
  if (j.vazio) {
    const primeira = j.cidades[0] || { nome: '' };
    return `
    <div class="card">
      <div class="card-row"><span class="tag ta">Passaporte</span><div class="card-title">Ainda sem carimbos</div></div>
      <p class="card-sub">O primeiro check-in carimba a chegada em ${primeira.nome}.</p>
      <button class="btn btn-p" onclick="go('checkin',null)">Fazer check-in</button>
    </div>`;
  }
  const novoDesde = jornadaPrefs(j.lang).visto;
  const porFase = new Map();
  j.carimbos.forEach(c => {
    if (!porFase.has(c.fase)) porFase.set(c.fase, []);
    porFase.get(c.fase).push(c);
  });
  const fases = [...porFase.keys()].sort((a, b) => b - a);
  const qtd = n => n + (n === 1 ? ' carimbo' : ' carimbos');
  const lista = arr => '<ol class="jn-pass">' + arr.map(c => jornadaCarimbo(c, j, novoDesde)).join('') + '</ol>';
  const nomeFase = f => (j.cidades[f] || { nome: PROGRAMS[j.lang].phases[f].name }).nome;
  const outras = fases.slice(1).map(f => `
      <details class="jn-outra">
        <summary>${nomeFase(f)} · ${qtd(porFase.get(f).length)}</summary>
        ${lista(porFase.get(f))}
      </details>`).join('');
  return `
    <div class="card">
      <div class="card-row"><span class="tag ta">Passaporte</span><div class="card-title">${nomeFase(fases[0])}</div><span class="jn-cnt">${qtd(porFase.get(fases[0]).length)}</span></div>
      ${lista(porFase.get(fases[0]))}
      <p class="jn-nota">O desenho do carimbo muda com o tipo de dia, nunca com as notas do check-in. Dia sem estudo registrado também ganha carimbo.</p>
      ${outras}
    </div>`;
}

function buildJornada(lang) {
  if (!jornadaAtiva(lang)) {
    return `
    <div class="jn-off">
      <span>Modo viagem desligado. Os check-ins e as fases seguem iguais.</span>
      <button class="btn btn-g" onclick="alternarJornada()">Ligar o modo viagem</button>
    </div>`;
  }
  const j = calcJornada(lang);
  const status = jornadaStatusTrecho(j);
  return `
    <div class="pg-h">
      <div class="pg-title">Viagem</div>
      <div class="pg-sub">${PROGRAMS[lang].name} · ${j.ritmo.nome}: um trecho acende com ${j.ritmo.minimo} dias de estudo a cada ${j.ritmo.ciclo}. Sessão mínima conta.</div>
    </div>
    <div class="jn-guia">
      <span class="jn-guia-av">${jornadaIcone('trem')}</span>
      <p><small>Guia</small>${jornadaMensagemGuia(j)}</p>
    </div>
    <div class="g3">
      <div class="stat"><div class="stat-v">${j.ritmoTotal ? j.ritmoAcesos + '/' + j.ritmoTotal : '—'}</div><div class="stat-l">ritmo · últimos trechos</div></div>
      <div class="stat"><div class="stat-v">${j.trechosAcesos}</div><div class="stat-l">trechos acesos no total</div></div>
      <div class="stat"><div class="stat-v">${status.v}</div><div class="stat-l">${status.l}</div></div>
    </div>
    ${jornadaMapa(j)}
    ${jornadaPassaporte(j)}
    <div class="jn-rodape">
      <button class="btn btn-g" onclick="alternarJornada()">Desligar o modo viagem</button>
      <span>Os check-ins não mudam. Dá para religar quando quiser.</span>
    </div>
    <div class="jn-sep" aria-hidden="true"></div>`;
}

/* Guarda o último carimbo visto para animar só os novos */
function marcarCarimbosVistos(lang) {
  if (!jornadaAtiva(lang)) return;
  const prefs = jornadaPrefs(lang);
  let ultimo = 0;
  checkinsPorDia(lang).forEach(c => { if (c._ts > ultimo) ultimo = c._ts; });
  if (ultimo > prefs.visto) setStore(lang, 'jornada', { ativo: prefs.ativo, visto: ultimo });
}

function alternarJornada() {
  const lang = currentLang;
  const prefs = jornadaPrefs(lang);
  setStore(lang, 'jornada', { ativo: !prefs.ativo, visto: prefs.visto });
  syncJornadaNav();
  updateTopbar();
  renderPage(currentPage);
  toast(prefs.ativo ? 'Modo viagem desligado.' : 'Modo viagem ligado.');
}

function syncJornadaNav() {
  const rotulo = jornadaAtiva(currentLang) ? 'Viagem' : 'Fases';
  document.querySelectorAll('.nav-fases-lbl').forEach(el => { el.textContent = rotulo; });
  const bn = document.querySelector('.bn-item[data-page="fases"]');
  if (bn) bn.setAttribute('aria-label', rotulo);
}

/* Fala do guia depois de salvar um check-in.
   editado: o dia já existia (correção). acesoAntes: o trecho estava aceso antes de salvar. */
function mensagemCheckinViagem(lang, dia, editado, acesoAntes) {
  const j = calcJornada(lang);
  const doDia = j.carimbos.filter(c => c.dia === dia);
  if (!doDia.length) return '';
  const tipos = doDia.map(c => c.tipo);
  const fase = doDia[0].fase;
  const cidade = j.cidades[fase] || { nome: '', local: '' };
  const ciclo = j.ciclos[Math.ceil(dia / j.ritmo.ciclo) - 1];
  const fala = jornadaFala(lang);
  const partes = [];
  if (editado) {
    partes.push('Dia ' + dia + ' atualizado no passaporte.');
  } else {
    const primeiroCarimbo = j.carimbos[0] && j.carimbos[0].dia === dia;
    if (tipos.includes('retorno')) partes.push(fala.retorno);
    if (dia === PROGRAMS[lang].totalDays) partes.push(fala.final(cidade));
    else if (tipos.includes('chegada')) {
      partes.push((primeiroCarimbo ? fala.comecou(cidade) : fala.chegou(cidade)) + (cidade.fala ? ' ' + cidade.fala : ''));
    }
    if (tipos.includes('aduana')) {
      /* Quem começou depois do dia 1 ainda não tem amostra para comparar */
      const temAmostra = j.carimbos.some(c => c.tipo === 'aduana' && c.dia < dia);
      partes.push(temAmostra ? fala.aduana.comparar
        : dia === PROGRAMS[lang].totalDays ? fala.aduana.final : fala.aduana.primeira);
    }
    if (!partes.length) {
      if (tipos.includes('descanso')) partes.push(fala.descanso);
      else if (tipos.includes('noturno')) partes.push(fala.noturno(dia));
      else partes.push(fala.carimbado(dia, cidade));
    }
  }
  if (partes.length < 2 && ciclo && !tipos.includes('descanso')) {
    if (ciclo.aceso && !acesoAntes) partes.push('Este trecho acendeu.');
    else if (!ciclo.aceso && ciclo.atual && j.podeAcender) partes.push('Mais ' + jornadaDias(j.falta) + ' de estudo e este trecho acende.');
  }
  if (partes.length < 2 && ciclo && acesoAntes && !ciclo.aceso) partes.push('Este trecho voltou a ficar em pausa.');
  return partes.slice(0, 2).join(' ');
}

/* ═══════════════════════════════════════════════════════
   ANÁLISE LOCAL
═══════════════════════════════════════════════════════ */
function analisarLocal() {
  const f = collectForm();
  const lang = currentLang;
  const p = PROGRAMS[lang];
  const phaseIdx = p.phases.findIndex(ph => f.dia <= ph.end);
  const fase = phaseIdx === -1 ? p.phases.length : phaseIdx + 1;
  const ph = p.phases[Math.min(phaseIdx, p.phases.length - 1)];

  const compMetas = {
    es: [35, 55, 67, 77, 82],
    fr: [35, 50, 60, 67, 72, 75],
    zh: [30, 40, 50, 60, 68, 76],
  };
  const talkMetas = {
    es: [2, 3, 5, 7, 10],
    fr: [2, 3, 5, 8, 10, 12],
    zh: [1, 2, 4, 6, 8, 12],
  };
  const metaComp = compMetas[lang][Math.min(fase - 1, compMetas[lang].length - 1)];
  const metaFala = talkMetas[lang][Math.min(fase - 1, talkMetas[lang].length - 1)];

  const sessaoMap = { completa:'completa', padrao:'padrão', minima:'mínima', zero:'sem estudo' };
  const diaMap = { 'folga-ok':'folga recuperada', 'folga-cansado':'folga cansado', 'pos-plantao':'pós-plantão', 'plantao':'plantão' };
  const dayRec = { 'plantao':'minima', 'pos-plantao':'minima', 'folga-cansado':'padrao', 'folga-ok':'completa' };

  let diag = `Dia ${f.dia} — ${p.name}, Fase ${fase} (${ph ? ph.name : ''}). Tipo de dia: ${diaMap[f.tipoDia] || 'não informado'}. Sessão: ${sessaoMap[f.sessao] || 'não informada'}.`;
  const rec = dayRec[f.tipoDia];
  if (rec && f.sessao && f.sessao !== rec) diag += ` A sessão não está alinhada com o tipo de dia (recomendado: ${sessaoMap[rec]}).`;

  let metr = `Compreensão: ${f.compreensao}% (meta da fase: ~${metaComp}%). `;
  metr += f.compreensao < metaComp - 10 ? 'Abaixo do esperado. ' : f.compreensao >= metaComp ? 'Dentro ou acima da meta. ' : 'Próximo da meta. ';
  metr += `Fala: ${f.fala} min (meta: ≥${metaFala} min). `;
  metr += f.fala < metaFala ? 'Ampliar prática oral. ' : 'Tempo adequado. ';

  if (lang === 'zh' && f.tons !== undefined) metr += `Tons: ${f.tons}/10. ${f.chars ? 'Caracteres: ~' + f.chars + '.' : ''}`;
  if (lang === 'fr' && f.pronuncia !== undefined) metr += `Pronúncia: ${f.pronuncia}/10.`;

  const alertas = [];
  if (f.compreensao < metaComp - 15) alertas.push('Compreensão bem abaixo da meta — revise conteúdo já estudado antes de avançar.');
  if (f.fala < metaFala) alertas.push(`Fala abaixo da meta — acrescente ${Math.max(1, metaFala - f.fala)} min de prática oral amanhã.`);
  if (lang === 'es' && (f.portuhol === 'alta' || f.portuhol === 'média')) alertas.push('Portunhol perceptível — ative o módulo de desportuguesização.');
  if (lang === 'fr' && (f.liaison === 'difícil')) alertas.push('Liaison/enchaînement difícil — pratique em grupo rítmico, não como regra isolada.');
  if (lang === 'zh' && f.tons < 6) alertas.push('Precisão de tons baixa — prefira lento e correto, reduza velocidade do shadowing.');
  const alrt = alertas.length ? alertas.join(' ') : 'Parâmetros dentro do esperado. Mantenha a consistência.';

  let ajuste = '';
  if (f.compreensao < metaComp - 10) ajuste = 'Prioridade: reexpor-se a conteúdo familiar antes de avançar. Reduza dificuldade do input.';
  else if (f.fala < metaFala) ajuste = `Acrescente ${Math.max(1, metaFala - f.fala)} min de fala sem roteiro na próxima sessão.`;
  else if (lang === 'zh' && f.tons < 6) ajuste = 'Foco nos tons: shadowing em velocidade reduzida com exagero intencional dos contornos tonais.';
  else if (lang === 'fr' && f.pronuncia < 5) ajuste = 'Dedique 5 min extras à fonética ativa — escolha 1 som-problema e repita em 10 contextos diferentes.';
  else ajuste = 'Manter ritmo. Consistência é mais importante que intensidade em dias isolados.';

  const dayType = f.tipoDia;
  let prox = dayType === 'plantao' || dayType === 'pos-plantao' ? 'Sessão mínima amanhã: só revisão e escuta passiva.' : 'Sessão padrão ou completa conforme energia.';
  prox += f.compreensao >= metaComp + 5 ? ' Compreensão alta — considere retirar um apoio (legenda, pinyin) no próximo input.' : '';

  renderAnalysis([
    { label: 'DIAGNÓSTICO DO DIA', text: diag },
    { label: 'MÉTRICAS EM FOCO',   text: metr },
    { label: 'ALERTA OU REFORÇO',  text: alrt },
    { label: 'AJUSTE PRIORITÁRIO', text: ajuste },
    { label: 'PRÓXIMO DIA',        text: prox },
  ]);
}

/* ═══════════════════════════════════════════════════════
   ANÁLISE IA (Cloudflare Worker)
═══════════════════════════════════════════════════════ */
const WORKER_URL = 'https://poliglota-api.jeancelsosilva.workers.dev/analisar';

async function analisarIA() {
  const f = collectForm();
  const lang = currentLang;
  const p = PROGRAMS[lang];
  const phaseIdx = p.phases.findIndex(ph => f.dia <= ph.end);
  const fase = phaseIdx === -1 ? p.phases.length : phaseIdx + 1;
  const ph = p.phases[Math.min(phaseIdx, p.phases.length - 1)];

  const out = document.getElementById('analysis-out');
  if (!out) return;
  out.classList.add('vis');
  out.innerHTML = '<div class="ao-loading">Analisando check-in com IA</div>';

  const btn = document.getElementById('btn-ia');
  if (btn) btn.disabled = true;

  /* Enriquecer payload com histórico recente e métricas acumuladas */
  /* Guarda: URL do Worker ainda não configurada */
  if (!WORKER_URL || /seu-worker|SEU-SUBDOMINIO|example\.com/i.test(WORKER_URL)) {
    out.classList.add('vis');
    out.innerHTML =
      '<div class="ao-sec"><div class="ao-lbl" style="color:var(--p2)">Worker não configurado</div>' +
      '<div>A Análise IA precisa da URL do seu Cloudflare Worker.<br><br>' +
      'Abra o <code>index.html</code>, localize a linha:<br>' +
      '<code style="color:var(--tx2)">const WORKER_URL = ...</code><br><br>' +
      'e substitua pela URL do seu Worker, terminando em <code>/analisar</code>.<br><br>' +
      '<span style="color:var(--tx2)">Enquanto isso, use a <strong>Análise local</strong> — ' +
      'ela funciona sem nenhuma configuração.</span></div></div>';
    if (btn) btn.disabled = false;
    return;
  }

  const recentHistory = lerCheckins(lang).slice(-5).map(h => ({
    dia:         h.dia,
    compreensao: h.compreensao,
    fala:        h.fala,
    energia:     h.energia,
    sessao:      h.sessao,
    tipoDia:     h.tipoDia,
    portuhol:    h.portuhol,
    traducao:    h.traducao,
    tons:        h.tons,
    avanco:      h.avanco,
    dificuldade: h.dificuldade,
  }));

  const accumulated = calcAccumulated(lang);
  const secao = (titulo, corpo) => '<div class="ao-sec"><div class="ao-lbl" style="color:var(--p4)">' + titulo + '</div><div>' + corpo + '</div></div>';
  /* Sem resposta em 45 s, cancela: o botão não pode ficar travado em "Analisando" */
  const controle = new AbortController();
  const limite = setTimeout(() => controle.abort(), 45000);

  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      signal: controle.signal,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        appVersion:  APP_VERSION,
        language:    lang,
        program:     { totalDays: p.totalDays, name: p.name },
        phase:       ph ? ph.name : '',
        phaseNum:    fase,
        day:         f.dia,
        metrics:     {
          compreensao: f.compreensao,
          fala:        f.fala,
          energia:     f.energia,
          portuhol:    f.portuhol,
          traducao:    f.traducao,
          tons:        f.tons,
          pronuncia:   f.pronuncia,
          chars:       f.chars,
          pinyin:      f.pinyin,
        },
        history:      recentHistory,
        accumulated: {
          totalCheckins:     accumulated.totalCheckins,
          consistencia7d:    accumulated.consistencia7d,
          mediaCompreensao:  accumulated.mediaCompreensao,
          totalMinFala:      accumulated.totalMinFala,
          streak:            accumulated.streak,
          ritmo:             accumulated.ritmoTotal ? accumulated.ritmoAcesos + '/' + accumulated.ritmoTotal : '',
          trechosAcesos:     accumulated.trechosAcesos,
          pausasSeguidas:    accumulated.pausasSeguidas,
        },
        currentCheckin: f,
      })
    });
    /* Resposta que não é JSON (página de erro do servidor, por exemplo) */
    const bruto = await res.text();
    let data = null;
    try { data = JSON.parse(bruto); } catch(e) { data = null; }
    if (data === null) {
      out.innerHTML = secao('Serviço de análise indisponível',
        'O servidor respondeu com erro (HTTP ' + res.status + '). Tente de novo em alguns minutos. A <strong>Análise local</strong> continua funcionando.');
      return;
    }

    /* Erro devolvido pelo Worker (todos os provedores falharam) */
    if (data && data.error) {
      const det = (Array.isArray(data.tentativas) ? data.tentativas : [])
        .map(t => `<div style="margin-top:4px;font-size:12px;color:var(--tx2)">${esc(t && t.provider)}: ${esc(t && t.erro)}</div>`)
        .join('');
      out.innerHTML = secao('Falha na análise', esc(data.error) + det);
      return;
    }

    let text = '';
    if (typeof data === 'string') text = data;
    else if (Array.isArray(data?.content)) text = data.content.map(b => b.text || '').join('');
    else if (typeof data?.analysis === 'string') text = data.analysis;
    else if (typeof data?.result === 'string') text = data.result;

    if (!text.trim()) {
      out.innerHTML = secao('Análise vazia', 'A IA não devolveu texto desta vez. Tente de novo; a <strong>Análise local</strong> funciona sem internet.');
      return;
    }

    parseSections(text);

    /* Rodapé discreto: qual IA respondeu e se houve fallback */
    if (data && data.provider) {
      const nomes = { claude: 'Claude', gemini: 'Gemini', gpt: 'GPT' };
      const usouFallback = (data.fallbacks || []).length > 0;
      const rodape = document.createElement('div');
      rodape.className = 'ao-sec';
      rodape.style.cssText = 'padding:9px 17px;font-size:11px;color:var(--tx3);' +
                             "font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;" +
                             'align-items:center;gap:8px;flex-wrap:wrap';
      rodape.innerHTML =
        `<span>análise por ${esc(nomes[data.provider] || data.provider)}` +
        (data.model ? ` · ${esc(data.model)}` : '') + `</span>` +
        (usouFallback
          ? `<span style="color:var(--p2)">↻ fallback após ${data.fallbacks.length} tentativa(s)</span>`
          : '');
      out.appendChild(rodape);
    }
  } catch (err) {
    const msg = String(err && err.message ? err.message : err);
    const rede = /failed to fetch|networkerror|load failed|typeerror/i.test(msg);
    if (err && err.name === 'AbortError') {
      out.classList.add('vis');
      out.innerHTML = secao('A análise demorou demais',
        'Sem resposta em 45 segundos, a análise foi cancelada. Tente de novo; a <strong>Análise local</strong> funciona sem internet.');
    } else if (out) {
      out.classList.add('vis');
      out.innerHTML = rede
        ? '<div class="ao-sec"><div class="ao-lbl" style="color:var(--p4)">Não foi possível alcançar o Worker</div>' +
          '<div>O navegador não conseguiu conectar em:<br>' +
          '<code style="color:var(--tx2);word-break:break-all">' + WORKER_URL + '</code><br><br>' +
          'Verifique, nesta ordem:<br>' +
          '1. A URL está correta e termina em <code>/analisar</code><br>' +
          '2. Abrindo a URL sem <code>/analisar</code> no navegador retorna um JSON<br>' +
          '3. O código do Worker foi salvo com <strong>Deploy</strong><br>' +
          '4. Se definiu <code>ALLOWED_ORIGIN</code>, ele bate com o domínio deste site<br><br>' +
          '<span style="color:var(--tx2)">A <strong>Análise local</strong> continua funcionando normalmente.</span></div></div>'
        : secao('Erro', esc(msg));
    }
  } finally {
    clearTimeout(limite);
    if (btn) btn.disabled = false;
  }
}

function parseSections(text) {
  const secs = ['DIAGNÓSTICO DO DIA','MÉTRICAS EM FOCO','ALERTA OU REFORÇO','AJUSTE PRIORITÁRIO','PRÓXIMO DIA'];
  /* Acha cada título onde estiver e recorta até o próximo título encontrado.
     Mostra na ordem padrão, mesmo se a IA trocar a ordem ou pular uma seção. */
  const achados = secs.map(s => ({ s, i: text.indexOf(s) })).filter(x => x.i !== -1).sort((a, b) => a.i - b.i);
  const result = achados.map((x, k) => ({
    label: x.s,
    text: text.slice(x.i + x.s.length, k + 1 < achados.length ? achados[k + 1].i : text.length).replace(/^[\s:\n]+/, '').trim(),
  })).filter(r => r.text).sort((a, b) => secs.indexOf(a.label) - secs.indexOf(b.label));
  renderAnalysis(result.length ? result : [{ label: 'RESPOSTA', text }]);
}

function renderAnalysis(sections) {
  const out = document.getElementById('analysis-out');
  if (!out) return;
  out.classList.add('vis');
  /* Texto da IA vai escapado: HTML na resposta aparece como texto, não executa */
  out.innerHTML = sections.map(s =>
    `<div class="ao-sec"><div class="ao-lbl">${esc(s.label)}</div><div class="ao-txt">${esc(s.text)}</div></div>`
  ).join('');
}

  "compras": {"title": "Compras, preços e trocas", "goal": "Comparar opções e resolver uma troca simples", "related": ["negocio", "comida", "pedir"], "roleplay": "Escolha entre dois produtos. Pergunte preço, tamanho e troca; termine confirmando o valor líquido pago.", "questions": ["Que problema a pessoa encontrou com o tamanho?", "Qual forma de pagamento ela quer usar?"], "interact": "A loja explica que só troca com recibo. Diga o que você tem e peça a alternativa disponível.", "search": "compras, preços e pagamento", "languages": {"es": ["demonstrativos, cuánto e más que", "¿Cuánto cuesta esta camisa? Me gusta, pero necesito una talla más grande.", "Aquella es más barata que esta. Si no me queda bien, ¿puedo cambiarla con el recibo? Quisiera pagar con tarjeta."], "fr": ["ce/cette e comparativos plus / moins", "Cette chemise coûte combien ? Elle me plaît, mais il me faut une taille au-dessus.", "Celle-là est moins chère que celle-ci. Si elle ne me va pas, je peux l’échanger avec le ticket ? Je voudrais payer par carte."], "zh": ["这 / 那, 多少钱 e 比", "这件衬衫多少钱？我喜欢这件，不过我想试大一号的。", "那件比这件便宜。如果大小不合适，能凭收据换货吗？我想刷卡。"]}, "queries": ["comprar ropa pagar con tarjeta", "acheter des vêtements et payer", "买衣服 多少钱 初级"], "gloss": "A pessoa prova uma camisa e precisa de um tamanho maior. A outra opção é mais barata. Pergunta se pode trocar com recibo e deseja pagar com cartão."},
  "casa": {"title": "Casa, cômodos e moradia", "goal": "Descrever um espaço e fazer perguntas sobre moradia", "related": ["cidade", "rotina", "compras"], "roleplay": "Visite um apartamento. Pergunte o valor do aluguel, descreva em que cômodo fica uma tomada e explique o que considera essencial.", "questions": ["Quantos quartos foram mencionados?", "O que fica perto da janela?"], "interact": "O anúncio diz que o bairro é tranquilo. Pergunte como é a rua à noite e explique por que isso importa.", "search": "descrição de casa ou apartamento", "languages": {"es": ["hay × está e preposições de lugar", "En el piso hay dos dormitorios. La mesa está al lado de la ventana.", "El lugar es tranquilo, pero hay pocos enchufes. Antes de decidir, voy a preguntar cuánto cuesta el alquiler."], "fr": ["il y a, c’est e preposições de lugar", "Dans l’appartement, il y a deux chambres. La table est à côté de la fenêtre.", "C’est calme, mais il y a peu de prises. Avant de décider, je vais demander combien coûte le loyer."], "zh": ["有 × 在 e 旁边", "公寓里有两间卧室。桌子在窗户旁边。", "这里很安静，但是插座不多。决定之前，我要先问问房租多少。"]}, "queries": ["describir un apartamento y el alquiler", "décrire un appartement et son loyer", "介绍公寓 房间 初级"], "gloss": "O apartamento tem dois quartos. A mesa fica ao lado da janela. O lugar é tranquilo e tem poucas tomadas. A pessoa quer saber o preço do aluguel."},
  "plantao": {"title": "Equipe, plantão e comunicação no trabalho", "goal": "Confirmar uma mensagem de trabalho com local, ação e próximo passo", "related": ["rotina", "mensagem", "cidade"], "roleplay": "Passe um turno fictício. Combine o que será conferido, onde aguardar e quem precisa receber o aviso.", "questions": ["Qual objeto foi mencionado?", "O que a equipe deve confirmar primeiro?"], "interact": "Seu colega entendeu outro endereço. Refaça a confirmação com frases curtas e peça que ele repita.", "search": "profissões e jornada de trabalho", "languages": {"es": ["estar de guardia, tener que e deber", "Hoy estoy de guardia. Tengo que revisar el casco y la radio antes de salir.", "Si recibimos una llamada, primero tenemos que confirmar la dirección y avisar al equipo."], "fr": ["être de garde, devoir e il faut", "Aujourd’hui, je suis de garde. Je dois vérifier mon casque et ma radio avant de sortir.", "Si on reçoit un appel, il faut d’abord confirmer l’adresse et prévenir l’équipe."], "zh": ["要 / 得 e sequência 先…再…", "我今天值班。出门前，我要检查头盔和对讲机。", "要是接到电话，我们得先确认地址，再通知队友。"]}, "queries": ["trabajo de bomberos turno de guardia", "métier de pompier et garde", "消防员 值班 口语"], "gloss": "A pessoa está de plantão e precisa conferir o capacete e o rádio. Se receber uma chamada, deve confirmar o endereço e avisar a equipe."},
  "treino": {"title": "Corrida, força e recuperação", "goal": "Combinar e ajustar um treino com base no objetivo do dia", "related": ["saude", "agenda", "tempo"], "roleplay": "Você e um amigo querem correr. Um quer intensidade, o outro está cansado. Combinem ritmo, duração e uma alternativa leve.", "questions": ["Qual é o primeiro passo do treino?", "O que a pessoa fará se ficar ofegante?"], "interact": "Seu parceiro sugere aumentar o ritmo. Explique como você mudaria o treino depois de uma noite ruim.", "search": "corrida e exercícios", "languages": {"es": ["antes de / después de + infinitivo e si + presente", "Antes de correr, caliento unos minutos. Después intento mantener el ritmo.", "Si me quedo sin aliento, bajo el ritmo. Hoy prefiero terminar bien antes que mejorar mi marca."], "fr": ["avant de + infinitivo, après avoir e si + presente", "Avant de courir, je m’échauffe quelques minutes. Ensuite, j’essaie de garder l’allure.", "Si je suis à bout de souffle, je ralentis. Aujourd’hui, je préfère bien finir que battre mon record."], "zh": ["先…然后… e 如果…就…", "跑步前，我先热身几分钟，然后尽量保持配速。", "如果我喘不过气来，就放慢速度。今天我想顺利跑完，不想去破纪录。"]}, "queries": ["salir a correr calentamiento ritmo", "courir avec une bonne allure", "跑步 热身 配速 慢速"], "gloss": "A pessoa aquece antes da corrida e tenta manter o ritmo. Se ficar ofegante, diminui a velocidade. O objetivo é terminar bem."},
  "saude": {"title": "Sintomas e compromissos de saúde", "goal": "Descrever sintomas fictícios e confirmar uma consulta sem ambiguidade", "related": ["agenda", "mensagem", "pedir"], "roleplay": "Ligue para uma recepção fictícia. Informe há quanto tempo está com um sintoma, confirme o horário e pergunte se há formulário.", "questions": ["O que a pessoa sente?", "Desde quando sente isso?"], "interact": "A recepção oferece uma consulta em outro horário. Confirme dia e hora com suas próprias palavras.", "search": "marcar consulta e descrever sintomas", "languages": {"es": ["doler, tener e desde / desde hace", "Me duele la garganta desde ayer. También estoy cansado.", "Quisiera cambiar la cita a mañana. ¿Tengo que rellenar un formulario antes de llegar?"], "fr": ["avoir mal à, avoir e depuis", "J’ai mal à la gorge depuis hier. Je suis aussi fatigué.", "Je voudrais déplacer mon rendez-vous à demain. Est-ce que je dois remplir un formulaire avant d’arriver ?"], "zh": ["parte do corpo + 疼 e 从…开始", "我从昨天开始嗓子疼。我也觉得很累。", "我想把预约改到明天。到之前需要填表吗？"]}, "queries": ["pedir cita y describir síntomas", "prendre rendez-vous chez le médecin", "看医生 预约 初级"], "gloss": "A pessoa está com dor de garganta desde ontem e sente cansaço. Quer remarcar a consulta para amanhã e saber se precisa preencher um formulário."},
  "viagem": {"title": "Transporte, hospedagem e imprevistos", "goal": "Comprar passagem e reagir a alteração de horário", "related": ["cidade", "agenda", "tempo"], "roleplay": "Chegue a uma estação fictícia. Compre ida e volta, confirme plataforma e encontre uma alternativa após um atraso.", "questions": ["Qual veículo está atrasado?", "O que a pessoa quer confirmar?"], "interact": "O trem atrasou. Pergunte se pode usar o mesmo bilhete em outra saída e explique a que horas precisa chegar.", "search": "comprar passagem e reservar hospedagem", "languages": {"es": ["ir a + infinitivo, salir de e llegar a", "Voy a tomar el tren de las tres. Mi billete es de ida y vuelta.", "El tren va con retraso. Si no salimos antes de las cuatro, voy a llegar tarde al hotel."], "fr": ["futur proche, partir de e arriver à", "Je vais prendre le train de trois heures. J’ai un billet aller-retour.", "Le train a du retard. Si on ne part pas avant quatre heures, je vais arriver en retard à l’hôtel."], "zh": ["要 + verbo, 从 e 到", "我要坐三点的火车。我买的是往返票。", "火车晚点了。如果四点前还不出发，我到酒店就晚了。"]}, "queries": ["comprar billete de tren y retrasos", "prendre le train et demander son horaire", "坐火车 买票 晚点 初级"], "gloss": "A pessoa vai pegar o trem das três com bilhete de ida e volta. O trem está atrasado. Pode acabar chegando tarde ao hotel."},
  "negocio": {"title": "Clientes, vendas e negociação", "goal": "Pedir orçamento e negociar quantidade, frete e prazo", "related": ["compras", "mensagem", "projeto"], "roleplay": "Você compra 20 unidades para revender. Peça preço, frete e prazo, depois confirme por escrito o que está incluído.", "questions": ["Qual quantidade o comprador quer?", "O frete está incluído no preço?"], "interact": "O fornecedor oferece desconto com quantidade maior. Explique o risco para o estoque e faça uma contraproposta.", "search": "cotações, venda e negociação", "languages": {"es": ["podría, si + presente e condiciones de venta", "¿Podría enviarme una cotización para veinte unidades? Quisiera saber si el envío está incluido.", "Si el plazo de entrega supera una semana, tendría que pedir menos unidades. ¿Podemos revisar la propuesta?"], "fr": ["pourriez-vous e condicional de cortesia", "Pourriez-vous m’envoyer un devis pour vingt unités ? J’aimerais savoir si la livraison est comprise.", "Si le délai dépasse une semaine, il faudrait que j’en commande moins. On peut revoir la proposition ?"], "zh": ["可以…吗 e 如果…就… na negociação", "可以给二十件商品报个价吗？我想知道运费包不包括在内。", "如果交货时间超过一周，我就得少订几件。这个方案能再谈谈吗？"]}, "queries": ["pedir una cotización y negociar con un proveedor", "demander un devis et négocier", "询价 运费 交货 口语"], "gloss": "A pessoa quer cotar 20 produtos e saber se o frete está incluso. Se a entrega demorar mais de uma semana, terá de pedir menos."},
  "video": {"title": "YouTube, roteiro e produção", "goal": "Planejar e explicar as escolhas de um vídeo curto", "related": ["tecnologia", "relato", "lazer"], "roleplay": "Apresente a um parceiro o roteiro de um vídeo de 30 segundos. Diga o que vai gravar, editar e publicar, e por quê.", "questions": ["O que a pessoa quer ajustar primeiro?", "O que fará se o som falhar?"], "interact": "Alguém diz que a introdução demorada ajuda a contextualizar. Proponha uma abertura diferente e justifique.", "search": "como gravar e editar um vídeo", "languages": {"es": ["ir a, para + infinitivo e antes de que", "Voy a grabar un video corto. Primero voy a probar el sonido para evitar problemas.", "Si el principio queda lento, lo voy a recortar antes de que salga el video. También quiero poner subtítulos."], "fr": ["futur proche e pour / avant de + infinitivo", "Je vais tourner une vidéo courte. Je vais d’abord faire un essai pour vérifier le son.", "Si le début est trop lent, je vais le couper avant de publier la vidéo. Je veux aussi ajouter des sous-titres."], "zh": ["先…再… e 为了 para exprimir finalidade", "我要拍一个短视频。为了保证声音清楚，我先试音，再开始拍。", "如果开头太慢，我会在发布前剪掉一段。我还想加上字幕。"]}, "queries": ["cómo grabar un vídeo corto y editarlo", "filmer et monter une vidéo courte", "拍短视频 剪辑 慢速"], "gloss": "A pessoa vai gravar um vídeo curto e testa o som primeiro. Se a abertura ficar lenta, vai cortá-la antes de publicar. Também quer adicionar legendas."},
  "tecnologia": {"title": "Apps, arquivos e suporte digital", "goal": "Relatar um erro reproduzível e confirmar uma correção", "related": ["mensagem", "projeto", "pedir"], "roleplay": "Abra um chamado sobre um app de estudo. Diga o que tentou, o que esperava e como outra pessoa reproduz a falha.", "questions": ["O que a pessoa fazia quando o app fechou?", "Qual foi a primeira tentativa de solução?"], "interact": "A outra pessoa não conseguiu reproduzir o erro. Faça duas perguntas e repita o passo exato.", "search": "problemas em aplicativos e suporte", "languages": {"es": ["imperfecto de cenário + pretérito de ação", "Estaba guardando el archivo cuando se cerró la aplicación. Volví a abrirla, pero el archivo no aparecía.", "Si el fallo vuelve a ocurrir, grabaré la pantalla para que se vea en qué paso falla."], "fr": ["imparfait de contexto + passé composé", "J’enregistrais le fichier quand l’application s’est fermée. Je l’ai relancée, mais le fichier n’apparaissait pas.", "Si le problème se reproduit, je filmerai l’écran pour montrer à quelle étape ça bloque."], "zh": ["正在…时 e 了 para evento concluído", "我正在保存文件，应用突然关了。我重新打开应用，可是找不到那个文件。", "如果问题再发生，我就录下屏幕，让别人看看是哪一步出了问题。"]}, "queries": ["cómo explicar un fallo en una aplicación", "expliquer un problème informatique", "应用程序 故障 报告"], "gloss": "O app fechou enquanto a pessoa salvava o arquivo. Reabrir o app não trouxe o arquivo de volta. Se acontecer de novo, vai gravar a tela."},
  "lazer": {"title": "Jogos, filmes e recomendações", "goal": "Recomendar algo do seu interesse com um motivo e uma ressalva", "related": ["video", "opiniao", "relacao"], "roleplay": "Recomende um jogo de gestão ou um filme a alguém. Descubra o que a pessoa gosta e proponha uma segunda opção sem spoilers.", "questions": ["De que tipo de jogo a pessoa gosta?", "Por que prefere sessões curtas?"], "interact": "Seu colega prefere jogos de ação. Sugira algo adequado a ele e explique o que você escolheria para si.", "search": "filmes, jogos e tempo livre", "languages": {"es": ["gustar, preferir e a mí / a ti", "Me gustan los juegos de gestión. Prefiero los que tienen partidas cortas.", "A mi amigo le gustan más las películas. Si tenemos poco tiempo, vemos un episodio y hablamos de los personajes."], "fr": ["aimer, préférer e relativos qui / que / dont", "J’aime les jeux de gestion. Je préfère ceux dont les parties sont courtes.", "Mon ami préfère les films. Si on manque de temps, on regarde un épisode et on parle des personnages qu’on a préférés."], "zh": ["喜欢 / 更喜欢 e 的 de descrição", "我喜欢经营模拟游戏。我更喜欢一局时间比较短的游戏。", "我朋友更喜欢电影。如果时间不多，我们就看一集电视剧，聊聊最喜欢的角色。"]}, "queries": ["recomendar juegos de gestión y películas", "recommander un jeu ou un film", "游戏 电影 爱好 慢速"], "gloss": "Uma pessoa gosta de jogos de gestão com partidas curtas, o amigo prefere filmes. Quando o tempo é curto, veem um episódio e conversam sobre os personagens."},
  "agenda": {"title": "Horários, convites e reagendamento", "goal": "Negociar dia, hora e alternativa na mesma conversa", "related": ["rotina", "relacao", "mensagem"], "roleplay": "Marque uma conversa de 15 minutos com alguém em outra cidade. Um horário falha; proponha outro e confirme a hora local.", "questions": ["Por que a primeira reunião não serve?", "Que horas foram oferecidas como alternativa?"], "interact": "A outra pessoa entendeu 15h em outro fuso. Explique a diferença e confirme sua hora local.", "search": "agenda e marcar compromissos", "languages": {"es": ["poder, quedar e expressões temporais", "¿Podemos quedar a las tres? Antes de esa hora no estoy disponible.", "Si no te viene bien, podemos dejarlo para mañana. Te escribo ahora para confirmar la hora."], "fr": ["pouvoir, on se voit e à / avant / vers", "On peut se voir à trois heures ? Avant, je ne suis pas disponible.", "Si ça ne t’arrange pas, on peut reporter à demain. Je t’écris tout de suite pour confirmer l’heure."], "zh": ["几点 / 什么时候 e tempo antes do verbo", "我们三点见，可以吗？三点前我没空。", "如果你那时候不方便，我们可以改到明天。我现在发消息确认一下时间。"]}, "queries": ["quedar a una hora y cambiar de plan", "fixer et déplacer un rendez-vous", "约时间 改到明天 初级"], "gloss": "A pessoa sugere um encontro às três porque antes está ocupada. Amanhã é a alternativa. Ela vai mandar uma mensagem para confirmar o horário."},

function immersionEscape(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[char]);
}

function immersionURL(value) {
  try {
    const url = new URL(value);
    return ['https:', 'http:'].includes(url.protocol) ? url.href : '';
  } catch {
    return '';
  }
}

function immersionOptions(values, selected) {
  return values.map((value, index) => `<option value="${index}" ${index === selected ? 'selected' : ''}>${immersionEscape(value)}</option>`).join('');
}

function immersionState(lang) {
  const saved = getStore(lang, IMMERSION_KEY) || {};
  return {
    done: saved.done || {},
    profile: saved.profile || {},
    items: saved.items || [],
    cards: saved.cards || []
  };
}

function saveImmersion(lang, state) {
  if (setStore(lang, IMMERSION_KEY, state)) return true;
  toast('Não foi possível salvar no armazenamento deste navegador.', 'err');
  return false;
}

function immersionProfile(lang, state) {
  return { ...IMMERSION_PROFILES[lang], choice: -1, ...state.profile };
}

function immersionWeekCount(lang) {
  return Math.ceil(PROGRAMS[lang].totalDays / 7);
}

function immersionDoneCount(lang, state) {
  const total = PROGRAMS[lang].totalDays;
  return Object.keys(state.done).filter(key => {
    const day = Number(key);
    return Number.isInteger(day) && day >= 1 && day <= total && state.done[key] === true;
  }).length;
}

function nextImmersionDay(lang, state, from = 1) {
  const count = PROGRAMS[lang].totalDays;
  for (let day = from; day <= count; day++) {
    if (!state.done[day]) return day;
  }
  return 0;
}

function immersionView(lang) {
  if (!IMMERSION_VIEWS[lang]) {
    const count = PROGRAMS[lang].totalDays;
    const stored = getStore(lang, 'immersionNavigation') || {};
    const legacyWeek = getStore(lang, 'immersionWeek');
    const programDay = Number(getStore(lang, 'currentDay'));
    const programFallback = Number.isInteger(programDay) && programDay >= 1 && programDay <= count ? programDay : 1;
    let fallback = programFallback;
    if (Number.isInteger(legacyWeek) && legacyWeek >= 1 && legacyWeek <= immersionWeekCount(lang)) {
      const first = (legacyWeek - 1) * 7 + 1;
      const pending = nextImmersionDay(lang, immersionState(lang), first);
      fallback = pending && pending <= first + 6 ? pending : first;
    }
    const day = Number.isInteger(stored.day) && stored.day >= 1 && stored.day <= count ? stored.day : fallback;
    const type = Number.isInteger(stored.type) && stored.type >= 0 && stored.type < IMMERSION_TYPES.length ? stored.type : 2;
    IMMERSION_VIEWS[lang] = {
      week: Math.ceil(day / 7), day, type, edit: -1, revealed: false,
      pane: 'study', material: 'trecho', returnFocus: '', drafts: {}
    };
  }
  return IMMERSION_VIEWS[lang];
}

function saveImmersionPosition(lang, view) {
  setStore(lang, 'immersionNavigation', { day: view.day, type: view.type });
}

function immersionBand(lang, week, profile) {
  if (profile.choice !== -1) return profile.choice;
  const day = (week - 1) * 7 + 1;
  if (lang === 'zh') return day > 360 ? 2 : day > 120 ? 1 : 0;
  if (lang === 'fr') return day > 180 ? 2 : day > 60 ? 1 : 0;
  return day > 80 ? 2 : profile.band;
}

function immersionLesson(lang, week, profile) {
  const order = IMMERSION_ORDER[lang].trim().split(/\s+/);
  const key = order[week - 1];
  const theme = IMMERSION_THEMES[key];
  const visit = order.slice(0, week - 1).filter(value => value === key).length;
  const parts = [key, ...theme.related];
  const words = new Set();
  const lexicon = parts.map((part, partIndex) => IMMERSION_LEXICON[part].flatMap((row, index) => {
    const [word, pinyin] = row[IMMERSION_LANGS.indexOf(lang)].split('~');
    if (words.has(word)) return [];
    words.add(word);
    return [{ word, pinyin, meaning: row[3], core: partIndex === 0 && index < 8 }];
  }));
  const band = immersionBand(lang, week, profile);
  const [grammar, base, extension] = theme.languages[lang];
  const primary = IMMERSION_RESOURCES[lang][lang === 'es' ? [0, 0, 2][band] : [0, 1, lang === 'fr' ? 2 : 3][band]];
  const companion = IMMERSION_RESOURCES[lang][lang === 'es' ? [1, 1, 3][band] : lang === 'fr' ? [1, 0, 3][band] : [1, 2, 2][band]];
  const firstDay = (week - 1) * 7 + 1;
  return {
    theme, parts, lexicon, band, grammar, base, extension, primary, companion,
    transfer: IMMERSION_TRANSFER[visit % IMMERSION_TRANSFER.length],
    firstDay, lastDay: Math.min(firstDay + 6, PROGRAMS[lang].totalDays),
    final: week === order.length,
    phase: PROGRAMS[lang].phases.find(phase => firstDay <= phase.end)
  };
}

  const activities = final && index === lesson.lastDay - lesson.firstDay ? review : days[index];
  const first = Math.floor(minutes * 0.4);
  const second = Math.floor(minutes * 0.4);
  return activities.map((activity, position) => [position === 0 ? first : position === 1 ? second : minutes - first - second, ...activity]);
}

function buildImmersionProgress(lang, state) {
  const done = immersionDoneCount(lang, state);
  const total = PROGRAMS[lang].totalDays;
  const allDone = IMMERSION_LANGS.reduce((sum, key) => sum + (key === lang ? done : immersionDoneCount(key, immersionState(key))), 0);
  const allTotal = IMMERSION_LANGS.reduce((sum, key) => sum + PROGRAMS[key].totalDays, 0);
  return `<div class="im-progress-label"><span>Progresso · ${PROGRAMS[lang].name}</span><strong>${IMMERSION_PERCENT.format(done / total)}</strong></div>
    <progress value="${done}" max="${total}" aria-label="Progresso da trilha de ${PROGRAMS[lang].name}"></progress>
    <div class="im-progress-foot"><span>${done} de ${total} dias concluídos</span><span>Geral · ${IMMERSION_PERCENT.format(allDone / allTotal)} <span class="im-muted">(${allDone}/${allTotal})</span></span></div>`;
}

function immersionResource(resource, index, state) {
  const saved = state.items.some(item => item.url === immersionURL(resource[1]));
  return `<li><div><a href="${resource[1]}" target="_blank" rel="noopener noreferrer">${immersionEscape(resource[0])} ↗</a>
    <div class="im-muted">${immersionEscape(resource[2])}</div></div>
    <button type="button" class="im-button" data-im-action="save-resource" data-value="${index}" aria-disabled="${saved}">${saved ? '✓ Salvo' : 'Guardar'}</button></li>`;
}

function immersionDayTitle(lesson, day) {
  return lesson.final && day === lesson.lastDay ? 'Avaliação de saída' : IMMERSION_DAY_NAMES[day - lesson.firstDay];
}

function immersionWeekPicker(lang, selected) {
  const phases = PROGRAMS[lang].phases;
  const groups = phases.map(() => []);
  IMMERSION_ORDER[lang].trim().split(/\s+/).forEach((key, i) => {
    const start = i * 7 + 1;
    const phase = phases.findIndex(item => start <= item.end);
    groups[phase].push(`<option value="${i + 1}" ${i + 1 === selected ? 'selected' : ''}>Semana ${i + 1} · ${immersionEscape(IMMERSION_THEMES[key].title)}</option>`);
  });
  return groups.map((options, i) => `<optgroup label="${immersionEscape(phases[i].name)}">${options.join('')}</optgroup>`).join('');
}

function immersionPending(lang, state, day) {
  const later = nextImmersionDay(lang, state, day + 1);
  if (later) return { day: later, label: `Próximo pendente · D${later}` };
  const first = nextImmersionDay(lang, state);
  return first && first < day ? { day: first, label: `Voltar ao pendente · D${first}` } : null;
}

function immersionStudyNavigation(lesson, state, view) {
  const count = lesson.lastDay - lesson.firstDay + 1;
  const days = Array.from({ length: count }, (_, index) => lesson.firstDay + index);
  const done = days.filter(day => state.done[day]).length;
  return `<div class="im-rail-info" id="im-week-progress">${done} de ${count} na semana</div>
    <div class="im-day-rail" role="group" aria-label="Dias da semana ${view.week}">
      ${days.map(day => `<button type="button" class="im-button im-day-chip ${state.done[day] ? 'im-chip-done' : ''}" id="im-chip-${day}"
        aria-label="Dia ${day} · ${immersionDayTitle(lesson, day)} · ${state.done[day] ? 'concluído' : 'pendente'}"
        aria-pressed="${day === view.day}" data-im-action="select-day" data-value="${day}">
        <span>D${day}</span><span aria-hidden="true" class="im-chip-status">${state.done[day] ? '✓' : '·'}</span>
      </button>`).join('')}
    </div>`;
}

function immersionStudyDay(lesson, lang, profile, state, view) {
  const day = view.day;
  const index = day - lesson.firstDay;
  const minutes = profile.minutes[view.type];
  const tasks = immersionDayParts(index, lesson, lang, profile, minutes);
  const words = lesson.lexicon.flat();
  const count = lesson.lastDay - lesson.firstDay + 1;
  const daily = lesson.final ? words.slice(index, index + 4)
    : words.slice(Math.floor(index * words.length / count), Math.floor((index + 1) * words.length / count));
  const markupLang = lang === 'zh' ? 'zh-Hans' : lang;
  const pending = immersionPending(lang, state, day);
  const done = !!state.done[day];
  const actions = {
    trecho: ['material', 'Abrir trecho e fontes'],
    vocab: ['material', 'Ver vocabulário'],
    cards: ['review', 'Abrir flashcards'],
    writing: ['writing', 'Copiar prompt de correção'],
    roleplay: ['roleplay', 'Copiar prompt de simulação'],
    checkin: ['checkin', 'Abrir check-in']
  };
  return `<article class="im-panel im-session" id="im-day-${day}" aria-labelledby="im-day-title">
    <div class="im-session-top">
      <div><span class="im-kicker">Dia ${day}</span><h3 id="im-day-title" tabindex="-1">${immersionDayTitle(lesson, day)}</h3></div>
      <span class="im-session-time">${minutes} min</span>
    </div>
    <ol class="im-tasks">${tasks.map(([duration, title, action, target], step) => `<li>
      <span class="im-task-time">${duration} min</span><div><strong>${title}</strong><p>${immersionEscape(action)}</p>
        ${target ? `<div class="im-actions im-task-actions">
          ${target === 'trecho' && index === 0 && step === 0 && day !== PROGRAMS[lang].totalDays
            ? '<button type="button" class="im-button" id="im-ouvir-app" data-im-action="lt-abrir">Ouvir no app</button>' : ''}
          <button type="button" class="im-text-button" id="im-task-${day}-${step}" data-im-action="${actions[target][0]}" data-value="${target}">${actions[target][1]}</button>
        </div>` : ''}
      </div></li>`).join('')}</ol>
    <details class="im-subpanel im-day-words" id="im-day-words-${day}" data-keep>
      <summary>${lesson.final ? 'Vocabulário para revisar' : 'Vocabulário deste dia'} · ${daily.length} itens</summary>
      <ul>${daily.map(row => `<li><button type="button" class="im-button lt-ouvir" data-im-action="lt-texto" data-value="${immersionEscape(row.word)}" aria-label="Ouvir ${immersionEscape(row.word)}">🔊</button> <strong lang="${markupLang}">${immersionEscape(row.word)}</strong>
        ${row.pinyin ? `<span lang="zh-Latn">(${immersionEscape(row.pinyin)})</span>` : ''} · ${immersionEscape(row.meaning)}</li>`).join('')}</ul>
    </details>
    <footer class="im-session-footer">
      <button id="im-complete" type="button" class="im-button ${done ? 'im-complete-done' : 'im-primary'}" data-im-action="toggle-day">${done ? '✓ Concluído · Desmarcar' : 'Concluir dia ' + day}</button>
      ${pending ? `<button id="im-next-day" type="button" class="im-button" data-im-action="next-day">${pending.label} →</button>` : ''}
    </footer>
  </article>`;
}

function immersionStudy(lesson, lang, profile, state, view) {
  const { theme, phase } = lesson;
  const count = immersionWeekCount(lang);
  return `<section class="im-panel im-week" id="im-week">
    <div class="im-week-nav">
      <button type="button" class="im-button" id="im-prev-week" data-im-action="select-week" data-value="${view.week - 1}" aria-label="Semana anterior" ${view.week === 1 ? 'disabled' : ''}>←</button>
      <label for="im-picker" class="im-sr">Selecionar semana</label>
      <select id="im-picker">${immersionWeekPicker(lang, view.week)}</select>
      <button type="button" class="im-button" id="im-next-week" data-im-action="select-week" data-value="${view.week + 1}" aria-label="Próxima semana" ${view.week === count ? 'disabled' : ''}>→</button>
    </div>
    <div class="im-week-title">
      <div><p class="im-kicker">Semana ${view.week} de ${count} · ${lesson.final ? 'Encerramento' : phase.num}</p>
        <h2>${immersionEscape(theme.title)}</h2></div>
      <label for="im-day-type">Escala 24×72<select id="im-day-type">${immersionOptions(IMMERSION_TYPES.map((name, i) => `${name} · ${profile.minutes[i]} min`), view.type)}</select></label>
    </div>
    <div id="im-day-navigation">${immersionStudyNavigation(lesson, state, view)}</div>
    <details id="im-brief" class="im-subpanel im-brief" data-keep>
      <summary>Objetivo, gramática e missão</summary>
      <div class="im-brief-content">
        <p>${immersionEscape(theme.goal)}.</p>
        <p><strong>Gramática</strong> · ${immersionEscape(lesson.grammar)}</p>
        <p><strong>Missão</strong> · ${immersionEscape(theme.roleplay)} ${immersionEscape(lesson.transfer)}</p>
        ${profile.passive ? `<p class="im-muted">Em momentos ociosos, reserve até ${profile.passive} min para um áudio que você já entende.</p>` : ''}
      </div>
    </details>
  </section>
  <div id="im-session-area">${immersionStudyDay(lesson, lang, profile, state, view)}</div>`;
}

function immersionVocabulary(lesson, lang) {
  return lesson.lexicon.map((rows, group) => `<details class="im-subpanel" id="im-leituras-${group}" data-keep ${group === 0 ? 'open' : ''}>
    <summary>${immersionEscape(IMMERSION_THEMES[lesson.parts[group]].title)} <span class="im-muted">· ${rows.length} itens</span></summary>
    <ul class="im-word-list">${rows.map((row, index) => `<li>
      <div><strong lang="${lang === 'zh' ? 'zh-Hans' : lang}">${immersionEscape(row.word)}</strong> ${row.core ? '<span class="im-core">Núcleo</span>' : ''}
      ${row.pinyin ? `<small lang="zh-Latn">${immersionEscape(row.pinyin)}</small>` : ''}
      <div class="im-muted">${immersionEscape(row.meaning)}</div></div>
      <span class="lt-botoes">
        <button type="button" class="im-button lt-ouvir" data-im-action="lt-palavra" data-value="${group}:${index}" aria-label="Ouvir ${immersionEscape(row.word)}">🔊</button>
        <button type="button" class="im-button" data-im-action="save-word" data-value="${group}:${index}" aria-label="Salvar ${immersionEscape(row.word)} nos flashcards">+ Cartão</button>
      </span>
    </li>`).join('')}</ul>
  </details>`).join('');
}

function immersionSavedItems(items) {
  return IMMERSION_FOLDERS.map((folder, folderIndex) => {
    const entries = items.map((item, index) => [item, index]).filter(([item]) => item.folder === folderIndex);
    return `<details class="im-subpanel" data-keep id="im-folder-${folderIndex}" ${entries.length ? 'open' : ''}>
      <summary>${folder} <span class="im-muted">· ${entries.length}</span></summary>
      ${entries.length ? `<ul class="im-items">${entries.map(([item, index]) => `<li><div>
        <a href="${immersionEscape(immersionURL(item.url))}" target="_blank" rel="noopener noreferrer">${immersionEscape(item.title)} ↗</a>
        <small>${IMMERSION_STATES[item.status]}${item.note ? ' · ' + immersionEscape(item.note) : ''}</small>
        </div><div class="im-actions"><button type="button" class="im-button" data-im-action="edit-resource" data-value="${index}">Editar</button>
        <button type="button" class="im-button" data-im-action="remove-resource" data-value="${index}">Remover</button></div>
      </li>`).join('')}</ul>` : '<p class="im-muted">Pasta vazia.</p>'}
    </details>`;
  }).join('');
}

function immersionDate(offset = 0) {
  const date = new Date();
  date.setDate(date.getDate() + offset);
  return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, '0'), String(date.getDate()).padStart(2, '0')].join('-');
}

function immersionDeck(cards, revealed, lang) {
  const today = immersionDate();
  const index = cards.findIndex(card => card.due <= today);
  return `<p class="im-muted">${cards.filter(card => card.due <= today).length} para revisar hoje · ${cards.length} no baralho</p>
    ${index < 0 ? '<p>Fila em dia. Adicione uma frase quando encontrar algo que vale repetir.</p>' : `<div class="im-flash">
      <span class="lt-botoes"><strong lang="${lang === 'zh' ? 'zh-Hans' : lang}">${immersionEscape(cards[index].front)}</strong>
        <button type="button" class="im-button lt-ouvir" data-im-action="lt-cartao" data-value="${index}" aria-label="Ouvir a frente do cartão">🔊</button></span>
      ${revealed ? `<p>${immersionEscape(cards[index].back)}</p>
        <div class="im-actions"><button type="button" class="im-button" data-im-action="review-again" data-value="${index}">Errei · amanhã</button>
        <button type="button" class="im-button im-primary" data-im-action="review-known" data-value="${index}">Lembrei · ${IMMERSION_INTERVALS[cards[index].step]} d</button>
        <button type="button" class="im-button" data-im-action="remove-card" data-value="${index}">Remover cartão</button></div>`
      : '<button type="button" class="im-button" data-im-action="reveal-card">Mostrar resposta</button>'}

}

function immersionTabs(view) {
  return IMMERSION_TABS.map(([id, label]) => {
    const selected = id === view.pane;
    return `<button type="button" role="tab" id="im-tab-${id}" aria-controls="im-pane-${id}" aria-selected="${selected}" tabindex="${selected ? '0' : '-1'}" data-im-action="tab" data-value="${id}">${label}</button>`;
  }).join('');
}

function immersionReturn(view) {
  return `<button type="button" class="im-button im-return" data-im-action="back-study" data-study-return>← Voltar ao dia ${view.day}</button>`;
}

function immersionMaterialNav(view) {
  return IMMERSION_MATERIALS.map(([id, label]) =>
    `<button type="button" class="im-button" aria-controls="im-${id}" aria-pressed="${view.material === id}" data-im-action="material" data-value="${id}">${label}</button>`
  ).join('');
}
