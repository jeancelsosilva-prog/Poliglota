function immersionScroll(target) {
  const nav = document.getElementById('im-tabs');
  if (target.getBoundingClientRect().top < nav.getBoundingClientRect().bottom ||
      target.getBoundingClientRect().top > document.getElementById('content').getBoundingClientRect().bottom - 80) {
    target.scrollIntoView({ block: 'start', behavior: 'auto' });
  }
}

function immersionFocus(id) {
  const target = document.getElementById(id);
  if (!target) return;
  target.focus({ preventScroll: true });
  immersionScroll(target);
}

function openImmersionPane(pane, heading) {
  const view = immersionView(currentLang);
  view.pane = pane;
  for (const [id] of IMMERSION_TABS) {
    const selected = id === pane;
    const tab = document.getElementById('im-tab-' + id);
    tab.setAttribute('aria-selected', String(selected));
    tab.tabIndex = selected ? 0 : -1;
    document.getElementById('im-pane-' + id).hidden = !selected;
  }
  if (heading) immersionFocus(heading);
  else immersionScroll(document.getElementById('im-pane-' + pane));
}

function openImmersionMaterial(material, entry) {
  const view = immersionView(currentLang);
  if (entry) view.returnFocus = entry;
  view.material = material;
  document.querySelectorAll('#immersion [data-im-material]').forEach(panel => {
    panel.hidden = panel.dataset.imMaterial !== material;
  });
  document.querySelectorAll('#immersion .im-subnav [data-im-action="material"]').forEach(button => {
    button.setAttribute('aria-pressed', String(button.dataset.value === material));
  });
  openImmersionPane('materials', 'im-' + material + '-heading');
}

function immersionSelectDay(day, focusId) {
  const lang = currentLang;
  const view = immersionView(lang);
  if (!Number.isInteger(day) || day < 1 || day > PROGRAMS[lang].totalDays) return;
  const week = Math.ceil(day / 7);
  const changedWeek = week !== view.week;
  view.week = week;
  view.day = day;
  view.returnFocus = '';
  saveImmersionPosition(lang, view);
  if (changedWeek) {
    leitorParar();
    immersionRedraw(false);
  } else {
    refreshImmersionSession(lang);
  }
  immersionFocus(focusId || 'im-day-title');
}

function selectImmersionWeek(week, focusId) {
  const lang = currentLang;
  if (!Number.isInteger(week) || week < 1 || week > immersionWeekCount(lang)) return;
  const view = immersionView(lang);
  if (week === view.week) return;
  const first = (week - 1) * 7 + 1;
  const last = Math.min(first + 6, PROGRAMS[lang].totalDays);
  const pending = nextImmersionDay(lang, immersionState(lang), first);
  const ends = focusId === 'im-prev-week' && week === 1 || focusId === 'im-next-week' && week === immersionWeekCount(lang);
  immersionSelectDay(pending && pending <= last ? pending : first, ends ? 'im-picker' : focusId);
}

function refreshImmersionSession(lang) {
  const view = immersionView(lang);
  const state = immersionState(lang);
  const profile = immersionProfile(lang, state);
  const lesson = immersionLesson(lang, view.week, profile);
  const open = document.getElementById('im-day-words-' + view.day)?.open;
  document.getElementById('im-day-navigation').innerHTML = immersionStudyNavigation(lesson, state, view);
  document.getElementById('im-session-area').innerHTML = immersionStudyDay(lesson, lang, profile, state, view);
  if (open) document.getElementById('im-day-words-' + view.day).open = true;
  document.querySelectorAll('#immersion [data-study-return]').forEach(button => {
    button.textContent = '← Voltar ao dia ' + view.day;
  });
}

function immersionRedraw(keepOpen = true) {
  const open = new Map();
  document.querySelectorAll('#immersion details[data-keep]').forEach(details => {
    if (keepOpen || details.id.startsWith('im-folder-') || details.id === 'im-method' || details.id === 'im-diagnosis') {
      open.set(details.id, details.open);
    }
  });
  const focusId = document.activeElement?.id;
  renderPage('imersao');
  for (const [id, isOpen] of open) {
    const details = document.getElementById(id);
    if (details) details.open = isOpen;
  }
  if (focusId) document.getElementById(focusId)?.focus({ preventScroll: true });
}

function restoreImmersionDrafts(lang) {
  for (const [id, fields] of Object.entries(immersionView(lang).drafts)) {
    const form = document.getElementById(id);
    if (!form) continue;
    for (const [name, value] of Object.entries(fields)) {
      const field = form.elements.namedItem(name);
      if (field) field.value = value;
    }
  }
}

function trackImmersionDraft(event) {
  const form = event.target.form;
  if (!form?.matches('#im-profile-form, #im-barrel-form, #im-card-form')) return;
  immersionView(currentLang).drafts[form.id] = Object.fromEntries(new FormData(form));
}

function immersionTabKeys(event) {
  const tab = event.target.closest('#im-tabs [role="tab"]');
  if (!tab || !['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
  event.preventDefault();
  const index = IMMERSION_TABS.findIndex(([id]) => id === tab.dataset.value);
  const length = IMMERSION_TABS.length;
  const position = { Home: 0, End: length - 1, ArrowLeft: (index + length - 1) % length, ArrowRight: (index + 1) % length }[event.key];
  const [id] = IMMERSION_TABS[position];
  openImmersionPane(id);
  document.getElementById('im-tab-' + id).focus({ preventScroll: true });
}

function updateImmersionResources(lang, state) {
  const folders = document.getElementById('im-barrel-folders');
  const open = new Map(Array.from(folders.querySelectorAll('details'), item => [item.id, item.open]));
  folders.innerHTML = immersionSavedItems(state.items);
  folders.querySelectorAll('details').forEach(item => {
    if (open.has(item.id)) item.open = open.get(item.id);
  });
  document.getElementById('im-barrel-count').textContent = '· ' + state.items.length + ' salvos';
  document.querySelectorAll('#immersion [data-im-action="save-resource"]').forEach(button => {
    const resource = IMMERSION_RESOURCES[lang][Number(button.dataset.value)];
    const saved = state.items.some(item => item.url === immersionURL(resource[1]));
    button.textContent = saved ? '✓ Salvo' : 'Guardar';
    button.setAttribute('aria-disabled', String(saved));
  });
}

function addImmersionCard(state, front, back) {
  const normalize = value => value.trim().toLocaleLowerCase().normalize('NFC');
  if (!front || !back) {
    toast('Preencha a frente e o verso do cartão.', 'err');
    return false;
  }
  if (state.cards.some(card => normalize(card.front) === normalize(front))) {
    toast('Esta frase já está no baralho.');
    return false;
  }
  state.cards.push({ front, back, due: immersionDate(), step: 0 });
  return true;
}

/* ═══════════════════════════════════════════════════════
   LEITOR DE TEXTO — voz natural (internet) ou voz do aparelho, frase por frase
   · voz natural: o worker gera a fala com o Gemini. Cada frase ouvida fica guardada
     neste aparelho: não gasta a cota de novo e toca até sem internet;
   · sem internet, sem cota ou com falha, cai para a melhor voz do aparelho e avisa;
   · lê uma frase por vez e destaca a frase; velocidade, pausar, repetir, anterior e próxima;
   · pode pausar depois de cada frase para você repetir (shadowing);
   · sem voz nenhuma, explica como instalar a do aparelho. No mandarim lê os caracteres, nunca o pinyin.
═══════════════════════════════════════════════════════ */
const LEITOR_IDIOMAS = {
  es: { prefixo: 'es', nome: 'espanhol', preferidos: ['es-mx', 'es-us', 'es-419', 'es-co', 'es-ar', 'es-cl', 'es-pe', 'es-es'] },
  fr: { prefixo: 'fr', nome: 'francês',  preferidos: ['fr-fr', 'fr-ca', 'fr-be', 'fr-ch'] },
  zh: { prefixo: 'zh', nome: 'mandarim', preferidos: ['zh-cn', 'cmn-cn', 'zh-hans-cn', 'zh-hans', 'zh-sg', 'zh-tw', 'cmn-tw'],
        evitar: /(^|[-_])(hk|yue|mo)([-_]|$)|cantonese|cantonês|粵|粤|廣東|广东/i },
};
const LEITOR_VELOCIDADES = [[0.6, 'Bem devagar'], [0.75, 'Devagar'], [0.9, 'Quase normal'], [1, 'Normal'], [1.15, 'Rápido']];
/* Vozes de efeito ou muito robóticas que vêm no macOS e no iOS: ficam por último */
const LEITOR_VOZES_RUINS = /\b(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|ralph|fred|junior|kathy|espeak|compact)\b/i;
/* Vozes naturais do Gemini oferecidas no app. Falam os três idiomas: o worker manda o idioma junto. */
const LEITOR_NUVEM = [['Kore', 'feminina, firme'], ['Aoede', 'feminina, leve'], ['Charon', 'masculina, didática'], ['Puck', 'masculina, animada']];
const LEITOR_NUVEM_PADRAO = 'Kore';
const LEITOR_CACHE = 'poliglota-voz-v1';
const LEITOR_CACHE_MAX = 250;   // frases guardadas no aparelho (~0,3 MB cada); as mais antigas saem primeiro
const LEITOR = {
  lang: '', chave: '', frases: [], fimContinuo: 0, i: -1, estado: 'parado', token: 0, timer: null, umaSo: false,
  velocidade: 1, pausar: false, atual: null,
  modo: '', carregando: false, urlAudio: '',
  nuvemFalhouEm: 0, nuvemPausa: 0, nuvemMotivo: '',
};
let LEITOR_VOZES = [];
const LEITOR_AUDIOS = new Map();   // frase pedida nesta aba → Promise<Blob>
let LEITOR_AUDIO = null;           // um só elemento de áudio: no iPhone ele fica liberado depois do primeiro toque

function leitorSuportado() {
  return !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
}

/* Voz natural: precisa do worker e de áudio no navegador */
function leitorNuvemConfigurada() {
  return /^https:\/\//.test(typeof WORKER_URL === 'string' ? WORKER_URL : '')
    && typeof fetch === 'function' && !!window.Audio && !!window.Blob && !!(window.URL && URL.createObjectURL);
}

/* Para ler, basta uma das duas: a voz natural ou uma voz do aparelho */
function leitorPodeLer() {
  return leitorNuvemConfigurada() || leitorSuportado();
}

function leitorUrlVoz() {
  return String(WORKER_URL).replace(/\/analisar\/?$/, '').replace(/\/+$/, '') + '/voz';
}

/* Depois de uma falha, a voz natural descansa: 2 min; 15 min se a cota acabou; 30 min se o servidor não tem a rota */
function leitorNuvemEmPausa() {
  return !!LEITOR.nuvemFalhouEm && Date.now() - LEITOR.nuvemFalhouEm < LEITOR.nuvemPausa;
}

/* Durante a pausa, só toca o que já está guardado, porque há a voz do aparelho para o resto.
   Sem voz do aparelho, cada toque tenta a internet de novo: é a única forma de ouvir. */
function leitorSoGuardado(lang) {
  return leitorNuvemEmPausa() && leitorSuportado() && !!leitorVoz(lang);
}

function leitorMarcarFalhaNuvem(erro) {
  if (!erro || erro.semCopia) return;
  const s = erro.status;
  LEITOR.nuvemMotivo = erro.cota ? 'cota' : (s === 404 || s === 405 || s === 503) ? 'servidor' : 'falha';
  LEITOR.nuvemPausa = { cota: 15, servidor: 30, falha: 2 }[LEITOR.nuvemMotivo] * 60000;
  LEITOR.nuvemFalhouEm = Date.now();
}

function leitorCarregarVozes() {
  if (!leitorSuportado()) return;
  try { LEITOR_VOZES = speechSynthesis.getVoices() || []; } catch (e) { LEITOR_VOZES = []; }
  if (leitorCarregarVozes.ligado) return;
  leitorCarregarVozes.ligado = true;
  const atualizar = () => {
    try { LEITOR_VOZES = speechSynthesis.getVoices() || []; } catch (e) { return; }
    leitorAtualizarVozes();
  };
  if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', atualizar);
  else speechSynthesis.onvoiceschanged = atualizar;
  /* Alguns navegadores nunca avisam: depois de 2 s, o status para de dizer "carregando" */
  setTimeout(() => { leitorCarregarVozes.esperou = true; atualizar(); }, 2000);
}

const leitorIdVoz = v => v.voiceURI || v.name;
const leitorBoaVoz = v => /natural|neural|premium|enhanced|aprimorad|wavenet|studio|siri/i.test(v.name || '');
const leitorRotuloVoz = v => (v.name || 'Voz') + ' · ' + (v.lang || '') + (leitorBoaVoz(v) ? ' ★' : '');

/* Nota de cada voz para o idioma; null = não é do idioma */
function leitorPontuar(v, lang) {
  const cfg = LEITOR_IDIOMAS[lang];
  const tag = String(v.lang || '').replace(/_/g, '-').toLowerCase();
  const doIdioma = tag === cfg.prefixo || tag.startsWith(cfg.prefixo + '-') || (lang === 'zh' && tag.startsWith('cmn'));
  if (!doIdioma) return null;
  if (cfg.evitar && (cfg.evitar.test(tag) || cfg.evitar.test(v.name || ''))) return null;
  let p = 10;
  const pos = cfg.preferidos.indexOf(tag);
  if (pos >= 0) p += 20 - pos * 2;
  if (leitorBoaVoz(v)) p += 30;
  if (/online/i.test(v.name || '')) p += 10;
  if (/google/i.test(v.name || '')) p += 12;
  if (v.localService === false) p += 4;
  if (LEITOR_VOZES_RUINS.test(v.name || '')) p -= 60;
  return p;
}

function leitorVozesDo(lang) {
  return LEITOR_VOZES
    .map(v => ({ v, p: leitorPontuar(v, lang) }))
    .filter(x => x.p !== null)
    .sort((a, b) => b.p - a.p)
    .map(x => x.v);
}

function leitorPrefs(lang) {
  const salvo = getStore(lang, 'leitor') || {};
  /* Até a v2.4 só havia vozes do aparelho: aquela escolha é esquecida uma vez, e a voz natural vira a padrão */
  const atual = salvo.v === 2;
  return {
    voz: atual && typeof salvo.voz === 'string' ? salvo.voz : '',
    velocidade: LEITOR_VELOCIDADES.some(([v]) => v === salvo.velocidade) ? salvo.velocidade : 0,
    pausar: salvo.pausar === true,
  };
}

function leitorSalvarPrefs(lang, mudanca) {
  setStore(lang, 'leitor', { ...leitorPrefs(lang), ...mudanca, v: 2 });
}

/* Voz natural escolhida (ou a padrão), mesmo durante a pausa depois de uma falha; null = voz do aparelho */
function leitorVozNuvem(lang) {
  if (!leitorNuvemConfigurada()) return null;
  const escolhida = leitorPrefs(lang).voz;
  if (!escolhida) return LEITOR_NUVEM_PADRAO;
  if (!escolhida.startsWith('nuvem:')) return null;
  const nome = escolhida.slice(6);
  return LEITOR_NUVEM.some(([n]) => n === nome) ? nome : LEITOR_NUVEM_PADRAO;
}

function leitorNomeNuvem(nome) {
  const item = LEITOR_NUVEM.find(([n]) => n === nome);
  return 'voz natural ' + nome + (item ? ' (' + item[1] + ')' : '');
}

/* Voz do aparelho: a escolhida, se for do aparelho; senão a melhor do idioma */
function leitorVoz(lang) {
  const vozes = leitorVozesDo(lang);
  const escolhida = leitorPrefs(lang).voz;
  return vozes.find(v => leitorIdVoz(v) === escolhida) || vozes[0] || null;
}

/* Sem escolha salva, a velocidade acompanha a faixa da semana */
function leitorVelocidade(lang, band) {
  return leitorPrefs(lang).velocidade || [0.75, 0.9, 1][band] || 1;
}

/* Frases do texto. Frase comprida demais vira pedaços nas vírgulas,
   porque algumas vozes cortam falas longas. */
function leitorFrases(texto, lang) {
  const limpo = String(texto || '').replace(/\s+/g, ' ').trim();
  if (!limpo) return [];
  let partes = null;
  try {
    if (window.Intl && Intl.Segmenter) {
      partes = [...new Intl.Segmenter(lang, { granularity: 'sentence' }).segment(limpo)].map(s => s.segment);
    }
  } catch (e) { partes = null; }
  if (!partes) partes = limpo.match(lang === 'zh' ? /[^。！？；]+[。！？；]*/g : /[^.!?…]+(?:[.!?…]+["'»”’)\]]*)?/g) || [limpo];
  const max = lang === 'zh' ? 60 : 200;
  const alvo = lang === 'zh' ? 40 : 120;
  const junta = lang === 'zh' ? '' : ' ';
  return partes.map(s => s.trim()).filter(Boolean).flatMap(f => {
    if (f.length <= max) return [f];
    /* Corta nas vírgulas, mas junta os pedaços em blocos de até ~120 letras para a leitura não ficar picada */
    const pedacos = (f.match(lang === 'zh' ? /[^，、；：]+[，、；：]?/g : /[^,;:]+[,;:]?/g) || [f]).map(s => s.trim()).filter(Boolean);
    const blocos = [];
    let atual = '';
    pedacos.forEach(p => {
      if (atual && (atual + junta + p).length > alvo) { blocos.push(atual); atual = p; }
      else atual = atual ? atual + junta + p : p;
    });
    if (atual) blocos.push(atual);
    return blocos;
  });
}

function leitorTextoDaLicao(lesson, lang) {
  const base = leitorFrases(lesson.base, lang);
  const extra = leitorFrases(lesson.extension, lang);
  return { frases: base.concat(extra), base: base.length, extra: extra.length };
}

function leitorPreparar(lesson, lang) {
  const t = leitorTextoDaLicao(lesson, lang);
  const chave = lang + '|' + t.frases.join('|');
  if (LEITOR.chave !== chave) {
    leitorParar();
    Object.assign(LEITOR, { lang, chave, frases: t.frases, i: -1 });
  }
  /* Na faixa inicial, "Ouvir" lê só o trecho base; a extensão fica para quando quiser */
  LEITOR.fimContinuo = lesson.band === 0 ? t.base : t.frases.length;
  LEITOR.velocidade = leitorVelocidade(lang, lesson.band);
  LEITOR.pausar = leitorPrefs(lang).pausar;
  return LEITOR;
}

function leitorTranscricao(lesson, lang) {
  const t = leitorTextoDaLicao(lesson, lang);
  const idioma = lang === 'zh' ? 'zh-Hans' : lang;
  const frase = (f, i) => `<span class="lt-frase" data-im-action="lt-frase" data-value="${i}" role="button" tabindex="0" lang="${idioma}">${immersionEscape(f)}</span>`;
  return `<p>${t.frases.slice(0, t.base).map(frase).join(' ')}</p>`
    + (t.extra ? `<p>${t.frases.slice(t.base).map((f, k) => frase(f, t.base + k)).join(' ')}</p>` : '')
    + '<p class="im-muted lt-dica">Toque numa frase para ouvir só ela.</p>';
}

function leitorAvisoSemVoz(lang) {
  return 'Este aparelho não tem voz em ' + LEITOR_IDIOMAS[lang].nome + ' instalada. Para instalar: no Android, Configurações › Sistema › Idiomas › Saída de texto em voz; no iPhone, Ajustes › Acessibilidade › Conteúdo Falado › Vozes; no Windows, Configurações › Hora e idioma › Fala. Depois, recarregue a página.';
}

const LEITOR_MOTIVOS = {
  cota: 'A voz natural atingiu o limite gratuito por agora',
  servidor: 'A voz natural ainda não está ligada no servidor',
  falha: 'A voz natural não respondeu (confira a internet)',
};

function leitorTextoStatus(lang) {
  const L = LEITOR;
  const ativo = L.lang === lang && L.estado !== 'parado' && L.i >= 0;
  const posicao = ativo ? (L.estado === 'pausado' ? 'Pausado na frase ' : 'Frase ') + (L.i + 1) + ' de ' + L.frases.length : '';
  const nuvem = leitorVozNuvem(lang);
  if (nuvem) {
    if (ativo && L.carregando) return 'Gerando a voz natural da frase ' + (L.i + 1) + '…';
    if (ativo && L.modo === 'nuvem') return posicao + ' · ' + leitorNomeNuvem(nuvem);
    const reserva = leitorSuportado() ? leitorVoz(lang) : null;
    if (leitorNuvemEmPausa()) {
      const motivo = LEITOR_MOTIVOS[L.nuvemMotivo] || LEITOR_MOTIVOS.falha;
      const inicio = posicao ? posicao + ' · ' : '';
      return reserva
        ? inicio + motivo + '. Enquanto isso, leio com a voz do aparelho (' + reserva.name + '); as frases já ouvidas continuam com a voz natural.'
        : inicio + motivo + '. Tente de novo daqui a pouco.';
    }
    if (ativo && L.modo === 'aparelho' && reserva) return posicao + ' · voz do aparelho (' + reserva.name + ')';
    const nome = leitorNomeNuvem(nuvem);
    return nome.charAt(0).toUpperCase() + nome.slice(1) + '. Na primeira vez, cada frase leva alguns segundos para ficar pronta; depois fica guardada neste aparelho.';
  }
  if (!leitorSuportado()) return 'Este navegador não lê textos em voz alta.';
  if (!LEITOR_VOZES.length && !leitorCarregarVozes.esperou) return 'Carregando as vozes do aparelho…';
  const voz = leitorVoz(lang);
  if (!voz) return leitorAvisoSemVoz(lang);
  if (ativo) return posicao + ' · ' + voz.name;
  const dica = leitorNuvemConfigurada() ? '. Se soar robótica, escolha uma voz natural na lista.' : '. Se soar robótica, escolha outra na lista.';
  return 'Voz: ' + leitorRotuloVoz(voz) + (leitorBoaVoz(voz) ? '' : dica);
}

function leitorOpcoesVoz(lang) {
  const nuvem = leitorVozNuvem(lang);
  const vozes = leitorSuportado() ? leitorVozesDo(lang) : [];
  const atual = nuvem ? null : leitorVoz(lang);
  const doAparelho = vozes.slice(0, 20).map(v => `<option value="${immersionEscape(leitorIdVoz(v))}" ${atual && leitorIdVoz(v) === leitorIdVoz(atual) ? 'selected' : ''}>${immersionEscape(leitorRotuloVoz(v))}</option>`).join('');
  if (!leitorNuvemConfigurada()) return doAparelho || '<option value="">Nenhuma voz deste idioma</option>';
  const naturais = LEITOR_NUVEM.map(([n, d]) => `<option value="nuvem:${n}" ${nuvem === n ? 'selected' : ''}>${n} · ${d} ★</option>`).join('');
  return `<optgroup label="Voz natural (internet)">${naturais}</optgroup>`
    + `<optgroup label="Voz do aparelho">${doAparelho || '<option value="" disabled>Nenhuma voz deste idioma</option>'}</optgroup>`;
}

function leitorPainel(lesson, lang) {
  if (!leitorPodeLer()) return '<p class="im-muted">Este navegador não lê textos em voz alta. Use os áudios indicados abaixo.</p>';
  leitorCarregarVozes();
  const vel = leitorVelocidade(lang, lesson.band);
  const ativo = LEITOR.lang === lang;
  const rotulo = ativo && LEITOR.estado === 'tocando' ? '⏸ Pausar' : ativo && LEITOR.estado === 'pausado' ? '▶ Continuar' : '▶ Ouvir o trecho';
  return `<div class="lt" id="lt-painel" data-lang="${lang}">
    <div class="im-actions" role="group" aria-label="Controles do leitor">
      <button type="button" class="im-button im-primary" id="lt-tocar" data-im-action="lt-tocar" aria-pressed="${ativo && LEITOR.estado === 'tocando'}">${rotulo}</button>
      <button type="button" class="im-button" data-im-action="lt-anterior" aria-label="Frase anterior">⏮</button>
      <button type="button" class="im-button" data-im-action="lt-repetir" aria-label="Repetir a frase atual">↻ Frase</button>
      <button type="button" class="im-button" data-im-action="lt-proxima" aria-label="Próxima frase">⏭</button>
      <button type="button" class="im-button" data-im-action="lt-parar" aria-label="Parar a leitura">⏹ Parar</button>
    </div>
    <div class="lt-ajustes">
      <label class="lt-campo" for="lt-velocidade">Velocidade
        <select id="lt-velocidade">${LEITOR_VELOCIDADES.map(([v, n]) => `<option value="${v}" ${v === vel ? 'selected' : ''}>${n} · ${String(v).replace('.', ',')}×</option>`).join('')}</select></label>
      <label class="lt-campo" for="lt-voz">Voz <select id="lt-voz">${leitorOpcoesVoz(lang)}</select></label>
      <label class="lt-check"><input type="checkbox" id="lt-pausar" ${leitorPrefs(lang).pausar ? 'checked' : ''}> Pausar depois de cada frase para eu repetir (shadowing)</label>
    </div>
    <p class="lt-status" id="lt-status" role="status" aria-live="polite">${immersionEscape(leitorTextoStatus(lang))}</p>
  </div>`;
}

/* Tempo para repetir a frase em voz alta, pelo tamanho dela (voz do aparelho, sem duração conhecida) */
function leitorEspera(frase, lang, velocidade) {
  const segundos = lang === 'zh' ? frase.replace(/\s/g, '').length / 4.5 : frase.split(/\s+/).length / 2.6;
  return Math.min(12000, Math.max(1500, (segundos / (velocidade || 1)) * 1100 + 800));
}

/* ── Áudio da voz natural ── */
function leitorAudio() {
  if (!LEITOR_AUDIO && window.Audio) {
    LEITOR_AUDIO = new Audio();
    LEITOR_AUDIO.preload = 'auto';
  }
  return LEITOR_AUDIO;
}

/* PCM de 16 bits (mono, little-endian) com o cabeçalho WAV de 44 bytes */
function leitorWavDePcm(pcm, taxa) {
  const dados = pcm.length % 2 ? pcm.subarray(0, pcm.length - 1) : pcm;
  const cab = new DataView(new ArrayBuffer(44));
  const escreve = (pos, s) => { for (let k = 0; k < s.length; k++) cab.setUint8(pos + k, s.charCodeAt(k)); };
  escreve(0, 'RIFF'); cab.setUint32(4, 36 + dados.length, true); escreve(8, 'WAVE');
  escreve(12, 'fmt '); cab.setUint32(16, 16, true); cab.setUint16(20, 1, true); cab.setUint16(22, 1, true);
  cab.setUint32(24, taxa, true); cab.setUint32(28, taxa * 2, true); cab.setUint16(32, 2, true); cab.setUint16(34, 16, true);
  escreve(36, 'data'); cab.setUint32(40, dados.length, true);
  return new Blob([cab.buffer, dados], { type: 'audio/wav' });
}

/* O base64 do worker vira um áudio tocável. WAV e formatos comprimidos passam direto; PCM puro ganha cabeçalho. */
function leitorWav(b64, mime) {
  const bin = atob(String(b64).replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
  const tipo = String(mime || '').toLowerCase();
  const riff = bytes.length > 12 && bytes[0] === 82 && bytes[1] === 73 && bytes[2] === 70 && bytes[3] === 70;
  if (riff) return new Blob([bytes], { type: 'audio/wav' });
  if (/mpeg|mp3|ogg|opus|webm|aac|mp4/.test(tipo)) return new Blob([bytes], { type: tipo.split(';')[0].trim() });
  return leitorWavDePcm(bytes, Number((tipo.match(/rate=(\d+)/) || [])[1]) || 24000);
}

/* iPhone e iPad (o iPad se apresenta como Mac, mas tem toque) */
function leitorIOS() {
  return /iP(hone|ad|od)/.test(navigator.userAgent || '') || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

/* Chamado dentro do toque: o iPhone só deixa tocar som se um toque iniciar o áudio uma vez.
   A voz do aparelho também é liberada, porque ela é a reserva quando a voz natural falha. */
function leitorDesbloquearAudio() {
  const audio = leitorAudio();
  if (audio && !leitorDesbloquearAudio.feito) {
    leitorDesbloquearAudio.feito = true;
    try {
      if (!leitorDesbloquearAudio.url) leitorDesbloquearAudio.url = URL.createObjectURL(leitorWavDePcm(new Uint8Array(480), 24000));
      audio.src = leitorDesbloquearAudio.url;
      const p = audio.play();
      if (p && p.catch) p.catch(e => { if (e && e.name === 'NotAllowedError') leitorDesbloquearAudio.feito = false; });
    } catch (e) { leitorDesbloquearAudio.feito = false; }
  }
  if (!leitorDesbloquearAudio.fala && leitorSuportado() && leitorIOS()) {
    leitorDesbloquearAudio.fala = true;
    try { const u = new SpeechSynthesisUtterance(''); u.volume = 0; speechSynthesis.speak(u); } catch (e) { /* segue sem a reserva liberada */ }
  }
}

function leitorPararAudio() {
  const audio = LEITOR_AUDIO;
  if (audio && !audio.paused) { try { audio.pause(); } catch (e) { /* nada a parar */ } }
}

function leitorChaveCache(frase, lang, voz) {
  return 'https://voz.poliglota.invalid/v1/' + lang + '/' + voz + '?t=' + encodeURIComponent(frase);
}

async function leitorCacheAbrir() {
  try { return window.caches ? await caches.open(LEITOR_CACHE) : null; } catch (e) { return null; }
}

/* Guarda no máximo LEITOR_CACHE_MAX frases; confere na 1ª gravação e depois a cada 10 */
async function leitorPodarCache(cache) {
  leitorPodarCache.vezes = (leitorPodarCache.vezes || 0) + 1;
  if (leitorPodarCache.vezes % 10 !== 1) return;
  try {
    const chaves = await cache.keys();
    for (const k of chaves.slice(0, Math.max(0, chaves.length - LEITOR_CACHE_MAX))) await cache.delete(k);
  } catch (e) { /* sem acesso ao cache: deixa como está */ }
}

/* Áudio de uma frase: memória desta aba → guardado no aparelho → worker.
   soGuardado: só o que já está guardado (durante a pausa depois de uma falha). */
function leitorAudioNuvem(frase, lang, voz, soGuardado) {
  const chave = leitorChaveCache(frase, lang, voz);
  const pronto = LEITOR_AUDIOS.get(chave);
  if (pronto) return pronto;
  const promessa = (async () => {
    const cache = await leitorCacheAbrir();
    if (cache) {
      try {
        const guardado = await cache.match(chave);
        if (guardado) return await guardado.blob();
      } catch (e) { /* segue para o worker */ }
    }
    if (soGuardado) { const e = new Error('frase ainda não guardada'); e.semCopia = true; throw e; }
    const controle = new AbortController();
    const relogio = setTimeout(() => controle.abort(), 30000);
    let resp;
    let dados = null;
    try {
      resp = await fetch(leitorUrlVoz(), {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: controle.signal,
        body: JSON.stringify({ texto: frase, voz, idioma: lang }),
      });
      try { dados = await resp.json(); } catch (e) { dados = null; }
    } finally {
      clearTimeout(relogio);
    }
    if (!resp.ok || !dados || typeof dados.audio !== 'string' || !dados.audio) {
      const e = new Error((dados && dados.error) || ('HTTP ' + resp.status));
      e.status = resp.status;
      /* 429 da cota do Gemini (pausa longa) ≠ 429 do limite por minuto do worker (pausa curta) */
      e.cota = !!(dados && dados.cota) || (resp.status === 429 && !(dados && dados.ritmo));
      throw e;
    }
    const blob = leitorWav(dados.audio, dados.mime);
    if (cache) {
      try {
        await cache.put(chave, new Response(blob, { headers: { 'Content-Type': blob.type } }));
        leitorPodarCache(cache);
      } catch (e) { /* aparelho sem espaço: toca, só não guarda */ }
    }
    return blob;
  })();
  LEITOR_AUDIOS.set(chave, promessa);
  promessa.catch(() => { if (LEITOR_AUDIOS.get(chave) === promessa) LEITOR_AUDIOS.delete(chave); });
  if (LEITOR_AUDIOS.size > 60) LEITOR_AUDIOS.delete(LEITOR_AUDIOS.keys().next().value);
  return promessa;
}

function leitorTocarBlob(blob, velocidade, token, aoTerminar, aoFalhar) {
  const audio = leitorAudio();
  const anterior = LEITOR.urlAudio;
  const url = URL.createObjectURL(blob);
  const vale = () => token === LEITOR.token && audio.src === url;
  LEITOR.urlAudio = url;
  audio.onended = () => { if (vale()) aoTerminar(audio.duration); };
  audio.onerror = () => { if (vale()) aoFalhar(new Error('áudio ilegível')); };
  audio.onloadedmetadata = () => { if (vale()) { try { audio.playbackRate = audio.defaultPlaybackRate || velocidade; } catch (e) { /* fica na velocidade normal */ } } };
  try { audio.preservesPitch = true; audio.mozPreservesPitch = true; audio.webkitPreservesPitch = true; } catch (e) { /* navegador antigo */ }
  audio.defaultPlaybackRate = velocidade;
  audio.playbackRate = velocidade;
  audio.src = url;
  if (anterior) URL.revokeObjectURL(anterior);
  const p = audio.play();
  if (p && p.catch) p.catch(e => { if (vale() && !(e && e.name === 'AbortError')) aoFalhar(e); });
}

/* ── Leitura ── */
function leitorFalar(i, umaSo) {
  const L = LEITOR;
  clearTimeout(L.timer);
  if (i < 0 || i >= L.frases.length) { leitorTerminar(); return; }
  const nuvem = leitorVozNuvem(L.lang);
  if (nuvem) leitorFalarNuvem(i, umaSo, nuvem);
  else leitorFalarAparelho(i, umaSo);
}

function leitorFalarNuvem(i, umaSo, voz) {
  const L = LEITOR;
  if (leitorSuportado() && (speechSynthesis.speaking || speechSynthesis.pending)) speechSynthesis.cancel();
  leitorPararAudio();
  leitorDesbloquearAudio();
  const token = ++L.token;
  Object.assign(L, { i, estado: 'tocando', umaSo: !!umaSo, modo: 'nuvem', carregando: false });
  leitorRefletir();
  const lang = L.lang;
  const emPausa = leitorSoGuardado(lang);
  /* Só avisa "gerando" se demorar: frase guardada toca na hora, sem piscar o aviso */
  const aviso = setTimeout(() => { if (token === L.token) { L.carregando = true; leitorRefletir(); } }, 350);
  leitorAudioNuvem(L.frases[i], lang, voz, emPausa).then(blob => {
    clearTimeout(aviso);
    if (token !== L.token || L.estado !== 'tocando') return;
    if (L.carregando) { L.carregando = false; leitorRefletir(); }
    leitorTocarBlob(blob, L.velocidade || 1, token, duracao => leitorDepoisDaFrase(i, token, duracao), erro => leitorFalhaNuvem(i, token, erro));
    /* Prepara a próxima frase enquanto esta toca: só uma, para não gastar a cota à toa */
    const limite = i < L.fimContinuo ? L.fimContinuo : L.frases.length;
    if (!L.umaSo && i + 1 < limite) leitorAudioNuvem(L.frases[i + 1], lang, voz, emPausa).catch(() => {});
  }, erro => {
    clearTimeout(aviso);
    if (token !== L.token) return;
    L.carregando = false;
    leitorFalhaNuvem(i, token, erro);
  });
}

/* A voz natural falhou nesta frase: lê com a voz do aparelho e deixa a natural descansar */
function leitorFalhaNuvem(i, token, erro) {
  const L = LEITOR;
  if (token !== L.token) return;
  if (erro && erro.name === 'NotAllowedError') {
    L.estado = 'pausado';
    leitorRefletir();
    leitorStatus('O navegador pediu um toque antes do som: toque em ▶ Continuar.');
    return;
  }
  leitorMarcarFalhaNuvem(erro);
  if (leitorSuportado() && leitorVoz(L.lang)) { leitorFalarAparelho(i, L.umaSo); return; }
  L.token++;
  Object.assign(L, { estado: 'pausado', modo: 'nenhum', carregando: false });
  leitorRefletir();
}

function leitorFalarAparelho(i, umaSo) {
  const L = LEITOR;
  leitorPararAudio();
  if (!leitorSuportado()) { L.estado = 'parado'; leitorRefletir(); return; }
  const voz = leitorVoz(L.lang);
  if (!voz) { L.estado = 'parado'; leitorRefletir(); return; }   // o status explica como instalar a voz
  const token = ++L.token;
  Object.assign(L, { i, estado: 'tocando', umaSo: !!umaSo, modo: 'aparelho', carregando: false });
  const fala = new SpeechSynthesisUtterance(L.frases[i]);
  fala.voice = voz;
  fala.lang = voz.lang;
  fala.rate = L.velocidade || 1;
  fala.onend = () => leitorDepoisDaFrase(i, token, 0);
  fala.onerror = ev => {
    if (token !== L.token || ['interrupted', 'canceled'].includes(ev.error)) return;
    const pediuToque = ev.error === 'not-allowed';
    L.estado = pediuToque ? 'pausado' : 'parado';
    leitorRefletir();
    leitorStatus(pediuToque ? 'O navegador pediu um toque antes do som: toque em ▶ Continuar.' : 'Esta voz falhou (' + ev.error + '). Escolha outra voz na lista.');
  };
  L.atual = fala;   // segura a referência: sem ela o Chrome às vezes perde o fim da fala
  leitorRefletir();
  const ocupado = speechSynthesis.speaking || speechSynthesis.pending;
  if (ocupado) speechSynthesis.cancel();
  if (speechSynthesis.paused) speechSynthesis.resume();
  /* Logo depois de cancelar, alguns navegadores ignoram a próxima fala: espera um instante */
  if (ocupado) setTimeout(() => { if (token === L.token) speechSynthesis.speak(fala); }, 60);
  else speechSynthesis.speak(fala);
}

/* Fim de uma frase (as duas vozes): para, segue ou espera você repetir */
function leitorDepoisDaFrase(i, token, duracao) {
  const L = LEITOR;
  if (token !== L.token || L.estado !== 'tocando') return;
  if (L.umaSo) { L.estado = 'pausado'; leitorRefletir(); return; }
  const limite = i < L.fimContinuo ? L.fimContinuo : L.frases.length;
  if (i + 1 >= limite) { leitorTerminar(); return; }
  if (L.pausar) {
    leitorStatus('Sua vez: repita a frase em voz alta.');
    const vel = L.velocidade || 1;
    /* Com a voz natural, a pausa usa a duração real do áudio */
    const espera = duracao > 0 && isFinite(duracao)
      ? Math.min(15000, Math.max(1500, (duracao / vel) * 1000 + 900))
      : leitorEspera(L.frases[i], L.lang, vel);
    L.timer = setTimeout(() => { if (token === L.token && L.estado === 'tocando') leitorFalar(i + 1); }, espera);
  } else {
    leitorFalar(i + 1);
  }
}

function leitorPausar() {
  LEITOR.token++;
  clearTimeout(LEITOR.timer);
  leitorPararAudio();
  if (leitorSuportado() && (speechSynthesis.speaking || speechSynthesis.pending)) speechSynthesis.cancel();
  LEITOR.estado = 'pausado';
  LEITOR.carregando = false;
  leitorRefletir();
}

function leitorParar() {
  LEITOR.token++;
  clearTimeout(LEITOR.timer);
  leitorPararAudio();
  if (leitorSuportado() && (speechSynthesis.speaking || speechSynthesis.pending)) speechSynthesis.cancel();
  LEITOR.estado = 'parado';
  LEITOR.carregando = false;
  LEITOR.i = -1;
  leitorRefletir();
}

function leitorTerminar() {
  LEITOR.token++;
  clearTimeout(LEITOR.timer);
  LEITOR.estado = 'parado';
  LEITOR.carregando = false;
  LEITOR.i = -1;
  leitorRefletir();
  leitorStatus('Fim do trecho. Toque numa frase para ouvir de novo.');
}

/* Botões do painel e frases da transcrição */
function leitorAcao(acao, lesson, lang, valor) {
  if (!leitorPodeLer()) { toast('Este navegador não lê textos em voz alta. Use os áudios indicados.', 'err'); return; }
  leitorCarregarVozes();
  const L = leitorPreparar(lesson, lang);
  if (!leitorVozNuvem(lang) && !leitorVoz(lang)) { leitorRefletir(); return; }
  const atual = Math.max(0, L.i);
  const tocando = L.estado === 'tocando';
  switch (acao) {
    case 'lt-tocar':
      if (tocando) leitorPausar();
      else leitorFalar(L.estado === 'pausado' ? atual : 0);
      break;
    case 'lt-anterior': leitorFalar(Math.max(0, L.i - 1), !tocando); break;
    case 'lt-proxima': leitorFalar(Math.min(L.frases.length - 1, L.i + 1), !tocando); break;
    case 'lt-repetir': leitorFalar(atual, true); break;
    case 'lt-parar': leitorParar(); break;
    case 'lt-frase': leitorFalar(Math.min(L.frases.length - 1, Math.max(0, Number(valor) || 0)), true); break;
  }
}

/* Uma palavra ou a frente de um cartão, sem mexer na leitura do trecho */
function leitorPalavra(texto, lang) {
  if (!texto) return;
  leitorCarregarVozes();
  if (LEITOR.estado === 'tocando') leitorPausar();
  const nuvem = leitorVozNuvem(lang);
  if (!nuvem) { leitorPalavraAparelho(texto, lang); return; }
  if (leitorSuportado() && (speechSynthesis.speaking || speechSynthesis.pending)) speechSynthesis.cancel();
  leitorPararAudio();
  leitorDesbloquearAudio();
  const token = ++LEITOR.token;
  const vel = Math.min(1, leitorPrefs(lang).velocidade || 0.9);
  leitorAudioNuvem(texto, lang, nuvem, leitorSoGuardado(lang)).then(blob => {
    if (token !== LEITOR.token) return;
    leitorTocarBlob(blob, vel, token, () => {}, erro => {
      if (erro && erro.name === 'NotAllowedError') { toast('Toque de novo para ouvir.', 'err'); return; }
      leitorPalavraAparelho(texto, lang);
    });
  }, erro => {
    if (token !== LEITOR.token) return;
    leitorMarcarFalhaNuvem(erro);
    leitorPalavraAparelho(texto, lang);
    leitorStatus(leitorTextoStatus(lang));
  });
}

function leitorPalavraAparelho(texto, lang) {
  const voz = leitorSuportado() ? leitorVoz(lang) : null;
  if (!voz) {
    toast(leitorVozNuvem(lang)
      ? 'A voz natural não respondeu e este aparelho não tem voz em ' + LEITOR_IDIOMAS[lang].nome + '. Tente de novo daqui a pouco.'
      : leitorSuportado() ? leitorAvisoSemVoz(lang) : 'Este navegador não lê textos em voz alta.', 'err', 9000);
    return;
  }
  const fala = new SpeechSynthesisUtterance(texto);
  fala.voice = voz;
  fala.lang = voz.lang;
  fala.rate = Math.min(1, leitorPrefs(lang).velocidade || 0.85);
  LEITOR.atualPalavra = fala;
  if (speechSynthesis.speaking || speechSynthesis.pending) {
    speechSynthesis.cancel();
    setTimeout(() => speechSynthesis.speak(fala), 60);
  } else {
    speechSynthesis.speak(fala);
  }
}

/* Velocidade, voz e pausa para repetir */
function leitorAjuste(campo) {
  const lang = currentLang;
  const meu = LEITOR.lang === lang;
  if (campo.id === 'lt-velocidade') {
    const v = Number(campo.value);
    leitorSalvarPrefs(lang, { velocidade: v });
    if (meu) LEITOR.velocidade = v;
    /* Voz natural tocando: muda a velocidade na hora, sem recomeçar a frase */
    const audio = LEITOR_AUDIO;
    if (meu && LEITOR.estado === 'tocando' && LEITOR.modo === 'nuvem' && !LEITOR.carregando && audio && !audio.paused) {
      try { audio.defaultPlaybackRate = v; audio.playbackRate = v; } catch (e) { /* segue na velocidade anterior */ }
      leitorStatus(leitorTextoStatus(lang));
      return;
    }
  } else if (campo.id === 'lt-voz') {
    leitorSalvarPrefs(lang, { voz: campo.value });
    /* Escolheu uma voz natural: tenta de novo já, sem esperar a pausa depois de uma falha */
    if (!campo.value || campo.value.startsWith('nuvem:')) LEITOR.nuvemFalhouEm = 0;
  } else if (campo.id === 'lt-pausar') {
    leitorSalvarPrefs(lang, { pausar: campo.checked });
    if (meu) LEITOR.pausar = campo.checked;
  }
  /* Trocou voz ou velocidade no meio da leitura: recomeça a frase atual já com o ajuste */
  if (campo.id !== 'lt-pausar' && meu && LEITOR.estado === 'tocando') leitorFalar(Math.max(0, LEITOR.i));
  else leitorStatus(leitorTextoStatus(lang));
}

function leitorStatus(texto) {
  const el = document.getElementById('lt-status');
  if (el) el.textContent = texto;
}

/* Botão, frase destacada e status acompanham o estado do leitor */
function leitorRefletir() {
  const painel = document.getElementById('lt-painel');
  const L = LEITOR;
  const meu = !!painel && painel.dataset.lang === L.lang;
  const botao = document.getElementById('lt-tocar');
  if (botao) {
    const tocando = meu && L.estado === 'tocando';
    botao.textContent = tocando ? '⏸ Pausar' : meu && L.estado === 'pausado' ? '▶ Continuar' : '▶ Ouvir o trecho';
    botao.setAttribute('aria-pressed', String(tocando));
  }
  if (painel) painel.setAttribute('aria-busy', String(meu && L.carregando));
  document.querySelectorAll('.lt-frase.lt-atual').forEach(el => { el.classList.remove('lt-atual'); el.removeAttribute('aria-current'); });
  if (meu && L.estado !== 'parado' && L.i >= 0) {
    const el = document.querySelector('.lt-frase[data-value="' + L.i + '"]');
    if (el) {
      el.classList.add('lt-atual');
      el.setAttribute('aria-current', 'true');
      const suave = !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
      if (el.offsetParent) el.scrollIntoView({ block: 'nearest', behavior: suave ? 'smooth' : 'auto' });
    }
  }
  if (painel) leitorStatus(leitorTextoStatus(painel.dataset.lang));
}

/* As vozes chegaram (ou mudaram) depois de a página aparecer */
function leitorAtualizarVozes() {
  const painel = document.getElementById('lt-painel');
  if (!painel) return;
  const seletor = document.getElementById('lt-voz');
  if (seletor) seletor.innerHTML = leitorOpcoesVoz(painel.dataset.lang);
  leitorStatus(leitorTextoStatus(painel.dataset.lang));
}

function immersionPrompt(kind, lesson, lang, profile) {
  const prefix = `Aja como parceiro de prática de ${PROGRAMS[lang].name}. Faixa da atividade: ${IMMERSION_BANDS[lesson.band]}. Meu nível relatado: ${profile.start} Minha meta: ${profile.goal} Prioridade: ${profile.focus}. Interesses: ${profile.context} `
    + (lang === 'zh' ? 'Use caracteres simplificados e mostre pinyin com tons na correção. ' : lang === 'es' ? 'Use espanhol latino-americano natural e sinalize portunhol recorrente. ' : 'Use francês natural e aponte uma ligação ou redução relevante na revisão de pronúncia, se houver áudio. ');
  const mission = `Missão: ${lesson.theme.roleplay} Estrutura: ${lesson.grammar}. ${IMMERSION_LEVEL_TASKS[lesson.band]} `;
  return prefix + mission + (kind === 'roleplay'
    ? `Faça uma fala por vez no idioma e espere minha resposta. Introduza um imprevisto coerente. ${lesson.transfer} Ao final, faça até três correções, com frase natural e nova tentativa. Comece com sua primeira fala.`
    : 'Vou enviar meu texto abaixo. Identifique o que consegui comunicar. Faça até três ajustes prioritários no formato original → revisão → motivo curto. Dê uma versão natural que preserve minha intenção e uma tarefa curta de reescrita. Faça uma pergunta se o sentido estiver ambíguo.\n\n');
}

async function copyImmersionPrompt(prompt) {
  try {
    await navigator.clipboard.writeText(prompt);
    toast('Prompt copiado. Cole no seu chat de estudo.');
  } catch {
    const dialog = document.getElementById('im-copy-dialog');
    if (!dialog) return;
    const input = dialog.querySelector('textarea');
    input.value = prompt;
    dialog.showModal();
    input.focus();
    input.select();
  }
}

function saveImmersionResource(lang, state, index) {
  const resource = IMMERSION_RESOURCES[lang][index];
  if (!resource) return;
  const url = immersionURL(resource[1]);
  if (state.items.some(item => item.url === url)) return;
  const mid = immersionView(lang).week;
  const choice = immersionBand(lang, mid, immersionProfile(lang, state));
  const folder = { es: [0, 1, 0, 1, 2], fr: [0, 0, 1, 1, 2], zh: [3, 2, 2, 0, 2] }[lang][index];
  state.items.push({ title: resource[0], url, folder, status: 0, note: IMMERSION_BANDS[choice] + ' · ' + resource[2] });
  if (!saveImmersion(lang, state)) return;
  updateImmersionResources(lang, state);
  toast('Material guardado no barril.');
}

function immersionClick(event) {
  const button = event.target.closest('#immersion [data-im-action]');
  if (!button || button.getAttribute('aria-disabled') === 'true') return;
  const lang = currentLang;
  const view = immersionView(lang);
  const state = immersionState(lang);
  const profile = immersionProfile(lang, state);
  const lesson = immersionLesson(lang, view.week, profile);
  const action = button.dataset.imAction;
  const value = button.dataset.value;
  const index = Number(value);

  switch (action) {
    case 'tab':
      if (value === 'study') view.returnFocus = '';
      openImmersionPane(value);
      break;
    case 'material':
      openImmersionMaterial(value, button.id);
      break;
    case 'review':
      view.returnFocus = button.id;
      openImmersionPane('review', 'im-cards-heading');
      break;
    case 'back-study': {
      const focusId = view.returnFocus || 'im-day-title';
      view.returnFocus = '';
      openImmersionPane('study', focusId);
      break;
    }
    case 'next-day': {
      const pending = immersionPending(lang, state, view.day);
      if (pending) immersionSelectDay(pending.day);
      break;
    }
    case 'toggle-day': {
      const day = view.day;
      const completed = state.done[day] !== true;
      if (completed) state.done[day] = true;
      else delete state.done[day];
      if (!saveImmersion(lang, state)) return;
      refreshImmersionSession(lang);
      document.getElementById('im-progress').innerHTML = buildImmersionProgress(lang, state);
      document.getElementById('im-status').textContent = completed ? 'Dia ' + day + ' concluído.' : 'Dia ' + day + ' desmarcado.';
      document.getElementById('im-complete').focus({ preventScroll: true });
      break;
    }
    case 'select-day': immersionSelectDay(index, button.id); break;
    case 'select-week': selectImmersionWeek(index, button.id); break;
    case 'lt-tocar':
    case 'lt-anterior':
    case 'lt-proxima':
    case 'lt-repetir':
    case 'lt-parar':
    case 'lt-frase':
      leitorAcao(action, lesson, lang, value);
      break;
    case 'lt-palavra': {
      const [group, row] = String(value).split(':').map(Number);
      const item = lesson.lexicon[group] && lesson.lexicon[group][row];
      if (item) leitorPalavra(item.word, lang);   // no mandarim, só os caracteres: o pinyin não é lido
      break;
    }
    case 'lt-cartao': {
      const card = state.cards[index];
      if (card) leitorPalavra(card.front, lang);
      break;
    }
    case 'lt-texto': leitorPalavra(value, lang); break;
    case 'lt-abrir':
      /* "Ouvir no app" no roteiro do dia: abre o trecho e já começa a ler */
      openImmersionMaterial('trecho', button.id);
      leitorAcao('lt-tocar', lesson, lang);
      break;
    case 'checkin': go('checkin', null); break;
    case 'writing':
    case 'roleplay': void copyImmersionPrompt(immersionPrompt(action, lesson, lang, profile)); break;
    case 'save-resource': saveImmersionResource(lang, state, index); break;
    case 'edit-resource':
      if (view.edit !== index) delete view.drafts['im-barrel-form'];
      view.edit = index;
      immersionRedraw();
      immersionFocus('im-barrel-title');
      break;
    case 'cancel-edit':
      view.edit = -1;
      delete view.drafts['im-barrel-form'];
      immersionRedraw();
      immersionFocus('im-barrel-heading');
      break;
    case 'remove-resource':
      state.items.splice(index, 1);
      if (!saveImmersion(lang, state)) return;
      if (view.edit === index) {
        view.edit = -1;
        delete view.drafts['im-barrel-form'];
        immersionRedraw();
      } else {
        if (view.edit > index) view.edit--;
        updateImmersionResources(lang, state);
      }
      immersionFocus('im-barrel-heading');
      toast('Material removido.');
      break;
    case 'save-word': {
      const [group, row] = value.split(':').map(Number);
      const { word, meaning, pinyin } = lesson.lexicon[group][row];
      if (!addImmersionCard(state, word, [meaning, pinyin].filter(Boolean).join(' · ')) || !saveImmersion(lang, state)) return;
      document.getElementById('im-deck').innerHTML = immersionDeck(state.cards, view.revealed, lang);
      toast('Cartão adicionado.');
      break;
    }
    case 'reveal-card':
      view.revealed = true;
      document.getElementById('im-deck').innerHTML = immersionDeck(state.cards, view.revealed, lang);
      document.querySelector('[data-im-action="review-known"]').focus({ preventScroll: true });
      break;
    case 'review-known':
    case 'review-again':
    case 'remove-card': {
      const card = state.cards[index];
      if (!card) return;
      if (action === 'remove-card') state.cards.splice(index, 1);
      else if (action === 'review-again') {
        card.step = 0;
        card.due = immersionDate(1);
      } else {
        card.due = immersionDate(IMMERSION_INTERVALS[card.step]);
        card.step = Math.min(card.step + 1, IMMERSION_INTERVALS.length - 1);
      }
      if (!saveImmersion(lang, state)) return;
      view.revealed = false;
      document.getElementById('im-deck').innerHTML = immersionDeck(state.cards, false, lang);
      (document.querySelector('[data-im-action="reveal-card"]') || document.getElementById('im-cards-heading')).focus({ preventScroll: true });
      break;
    }
  }
}

function immersionChange(event) {
  const input = event.target;
  if (input.id === 'im-picker') {
    selectImmersionWeek(Number(input.value), input.id);
  } else if (input.id === 'im-day-type') {
    const view = immersionView(currentLang);
    const value = Number(input.value);
    if (!Number.isInteger(value) || value < 0 || value >= IMMERSION_TYPES.length) return;
    view.type = value;
    saveImmersionPosition(currentLang, view);
    refreshImmersionSession(currentLang);
  } else if (['lt-velocidade', 'lt-voz', 'lt-pausar'].includes(input.id)) {
    leitorAjuste(input);
  } else {
    trackImmersionDraft(event);
  }
}

function immersionSubmit(event) {
  const form = event.target;
  if (!form.matches('#im-profile-form, #im-barrel-form, #im-card-form')) return;
  event.preventDefault();
  const lang = currentLang;
  const view = immersionView(lang);
  const state = immersionState(lang);
  const fields = new FormData(form);
  const field = key => String(fields.get(key) ?? '').trim();

  if (form.id === 'im-profile-form') {
    state.profile = {
      start: field('start'), goal: field('goal'), focus: field('focus'), context: field('context'),
      choice: Number(field('choice')) - 1, minutes: IMMERSION_TYPES.map((_, i) => Number(field('min' + i))),
      passive: Number(field('passive'))
    };
    if (!['start', 'goal', 'focus', 'context'].every(key => state.profile[key])) {
      toast('Preencha os quatro campos do seu plano.', 'err');
      return;
    }
  } else if (form.id === 'im-barrel-form') {
    const url = immersionURL(field('url'));
    const title = field('title');
    if (!url || !title) {
      toast('Use um título e um endereço começando com https:// ou http://.', 'err');
      return;
    }
    if (state.items.some((item, index) => item.url === url && index !== view.edit)) {
      toast('Este link já está no barril.');
      return;
    }
    const item = { title, url, note: field('note'), folder: Number(field('folder')), status: Number(field('status')) };
    if (state.items[view.edit]) state.items[view.edit] = item;
    else state.items.push(item);
    if (!saveImmersion(lang, state)) return;
    view.edit = -1;
    delete view.drafts[form.id];
    immersionRedraw();
    const folder = document.getElementById('im-folder-' + item.folder);
    if (folder) folder.open = true;
    toast('Material salvo.');
    return;
  } else if (!addImmersionCard(state, field('front'), field('back'))) {
    return;
  }

  if (!saveImmersion(lang, state)) return;
  delete view.drafts[form.id];
  immersionRedraw();
  const addedCard = form.id === 'im-card-form';
  immersionFocus(addedCard ? 'im-cards-heading' : 'im-profile-heading');
  toast(addedCard ? 'Cartão adicionado.' : 'Plano atualizado.');
}

const immersionRoot = document.getElementById('page-root');
immersionRoot.addEventListener('click', immersionClick);
immersionRoot.addEventListener('change', immersionChange);
immersionRoot.addEventListener('input', trackImmersionDraft);
immersionRoot.addEventListener('keydown', immersionTabKeys);
/* Frases da transcrição respondem a Enter e Espaço, como botões */
immersionRoot.addEventListener('keydown', event => {
  const frase = event.target.closest && event.target.closest('.lt-frase');
  if (frase && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); frase.click(); }
});
immersionRoot.addEventListener('submit', immersionSubmit);

for (const lang of IMMERSION_LANGS) CONTENT[lang].imersao = () => buildImmersion(lang);

function boot() {
  if (boot._done) return;    // idempotente
  boot._done = true;
  try {
    initTheme();             // resolve tema antes de pintar
    try { runMigrations(); } catch (err) { console.warn("Armazenamento local indisponível.", err); }
    /* Restaura idioma */
    let lang = 'es';
    try { lang = localStorage.getItem('polyglot.meta.lang') || 'es'; } catch(e) {}
    if (!PROGRAMS[lang]) lang = 'es';
    switchLang(lang);

    /* Decide página inicial:
       - sem check-in hoje → check-in (ação do dia)
       - senão → última página visitada */
    let page = 'visao';
    try { page = localStorage.getItem('polyglot.meta.page') || 'visao'; } catch(e) {}
    if (!CONTENT[lang] || !CONTENT[lang][page]) page = 'visao';
    if (page !== 'imersao' && !fezCheckinHoje(lang)) page = 'checkin';
    go(page, null);
    /* Modo privado ou bloqueio de dados: avisa logo, antes de alguém preencher um check-in à toa */
    if (!armazenamentoOk()) {
      setTimeout(() => toast('Este navegador não está guardando dados (modo privado ou bloqueio). Os check-ins não ficarão salvos.', 'err', 9000), 600);
    }
  } catch (err) {
    // Falha no boot não pode deixar a tela vazia
    const root = document.getElementById('page-root');
    if (root) root.innerHTML =
      '<div class="planned-banner"><div class="planned-icon">!</div>' +
      '<h2>Erro ao iniciar</h2><p>' + (err && err.message ? err.message : err) + '</p></div>';
    if (window.console) console.error('boot:', err);
  }
}

/* Dispara já se o DOM estiver pronto; senão espera o evento.
   Evita tela em branco caso o script rode após o DOMContentLoaded. */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
/* Rede de segurança: se nada pintou até o load, tenta de novo. */
window.addEventListener('load', function(){
  const root = document.getElementById('page-root');
  if (root && !root.innerHTML.trim()) { boot._done = false; boot(); }
});
</script>
