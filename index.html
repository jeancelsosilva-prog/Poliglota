function buildAvaliacoes(lang) {
  const p = PROGRAMS[lang];
  const phaseColors = ['var(--p1)','var(--p2)','var(--p3)','var(--p4)','var(--p5)','var(--p6)'];

  function getPhaseForDay(day) {
    for (let i = 0; i < p.phases.length; i++) {
      if (day <= p.phases[i].end) return p.phases[i];
    }
    return p.phases[p.phases.length - 1];
  }

  const evalRows = p.evaluationDays.map((day, i) => {
    const ph = getPhaseForDay(day);
    const color = phaseColors[p.phases.indexOf(ph)] || 'var(--p1)';
    const focuses = {
      es: ['Diagnóstico de entrada · gravação inicial · linha de base',
           'Hábito formado? Sons sendo diferenciados? Portunhol reduzindo?',
           'Vocabulário funcional ativo · compreensão 40–50%? · fala em frases',
           'Frases maiores · contornar palavras desconhecidas · 3 min de fala',
           'Metade do caminho · compreensão 55–65% · pausas reduzidas',
           'Input natural sem legenda em trechos · resumos orais funcionando',
           'Comunicação real possível · 70–75% compreensão · fala 5–8 min',
           'Autonomia comunicativa consolidada · mínima dependência de tradução',
           'Avaliação final · domínio funcional geral · plano de manutenção'],
      fr: ['Diagnóstico de entrada · gravação inicial · sons-chave identificados',
           'Sons /y/ /ʁ/ estáveis? Ritmo silábico internalizado? Liaison inicial?',
           'A2 inicial confirmado? Frases funcionais? Fala 3 min?',
           'Compreensão 45–55%? Liaison e enchaînement em contexto?',
           'Passado e futuro em uso · fala 5 min sem bloqueios · A2 forte?',
           'Marco T1 · A2 sólido / B1 inicial · gravação de 5 min · métricas T1',
           'B1 em construção · Memrise integrado · fala 5–8 min · compreensão 65%?',
           'Compreensão semi-nativa 65–70% · conversar com nativos possível?',
           'Fluência B1 · pausas reduzidas · conteúdo nativo com suporte reduzido',
           'B1 sólido confirmado? Fala 10 min? Sonoridade natural?',
           'Revisão de lacunas · estratégias de manutenção definidas',
           'Avaliação final · B1 funcional e estável · plano B2 ou manutenção'],
      zh: p.evaluationDays.map((d, idx) => {
            if (d === 1) return 'Diagnóstico · tons iniciais · gravação zero · linha de base';
            if (d % 120 === 0) return `Marco F${d/120} · gravação oral · caracteres reconhecidos · compreensão`;
            if (d % 30 === 0) return `Ciclo ${Math.floor(d/30)} · tons · vocabulário · progresso de caracteres`;
            return `Avaliação D${d} · tons · compreensão · caracteres`;
          })[i]
    };
    const focusList = focuses[lang];
    const focus = Array.isArray(focusList) ? (focusList[i] || `Avaliação D${day}`) : focusList;
    const saved = (getStore(lang, 'evaluations') || {})[day];
    return `<tr>
      <td><strong>${day}</strong></td>
      <td><span style="color:${color}">${ph.num}</span></td>
      <td>${focus}</td>
      <td><span class="ev-pill ${saved ? 'ev-done' : 'ev-pend'}">${saved ? '● OK' : '○ ---'}</span></td>
    </tr>`;
  }).join('');

  const milestones = p.phases.map((ph, i) => {
    const color = phaseColors[i] || 'var(--p1)';
    const marcoTexts = {
      es: ['Fundação sonora. Sons internalizados. Apresentação pessoal sem portunhol.',
           'Vocabulário funcional ativo. Falar 3–5 min sobre temas conhecidos.',
           'Processamento automático. Falar 5+ min. Pausas reduzidas.',
           'Comunicação real. Interação com falantes nativos.',
           'Domínio funcional geral. B1–B2. Portunhol eliminado.'],
      fr: ['Sons-chave pronunciados. Ritmo silábico internalizado. Frases básicas.',
           'Conversar 3 min sobre cotidiano. Liaison em contexto.',
           'A2 forte / B1 inicial. Falar 5 min sem bloqueios. 55–65% compreensão.',
           'B1 em construção. 65–70% compreensão. Interação com nativos possível.',
           'Fluência B1 progressiva. 10 min de fala. Conteúdo semi-nativo.',
           'B1 funcional e estável. 75%+ compreensão. Base para eventual B2.'],
      zh: ['120 dias · Tons consistentes · ~150 caracteres · Apresentação pessoal.',
           '240 dias · ~300 caracteres · Ler HSK2 · Conversar 3 min.',
           '360 dias (Ano 1) · ~450 caracteres · Conversar 5–10 min · HSK2–3.',
           '480 dias · ~650 caracteres · Ler HSK3 sem pinyin · 55–65% compreensão.',
           '600 dias · ~850 caracteres · Falantes nativos possível · HSK4.',
           '720 dias · 1000+ caracteres · Autonomia funcional · Base HSK5.']
    };
    const text = marcoTexts[lang][i] || ph.name;
    return `<div class="tl-item">
      <div class="tl-dot" style="background:${color}"></div>
      <div class="tl-day" style="color:${color}">D${ph.end}</div>
      <div><div class="tl-h">${ph.name}</div><p class="tl-p">${text}</p></div>
    </div>`;
  }).join('');

  return `
    <div class="pg-h"><div class="pg-title">Avaliações Periódicas</div>
      <div class="pg-sub">${p.evaluationDays.length} pontos de avaliação ao longo dos ${p.totalDays} dias.</div></div>
    <div class="alert"><strong>Estrutura de cada avaliação:</strong> Teste auditivo sem apoio · Gravação oral comparada à anterior · Análise das métricas · Apenas um ajuste prioritário para o ciclo seguinte.</div>
    <div class="card" style="padding:0;overflow:hidden">
      <table class="ev-table">
        <thead><tr><th>Dia</th><th>Fase</th><th>Foco</th><th>Status</th></tr></thead>
        <tbody>${evalRows}</tbody>
      </table>
    </div>
    <div class="card">
      <div class="card-title" style="margin-bottom:20px">Marcos do programa</div>
      <div class="tl">${milestones}</div>
    </div>`;
}

function buildMetricas(lang) {
  /* Regularidade pela regra de trechos (ver MODO VIAGEM), não pela semana de 7 dias */
  const r = ritmoAtual();
  const trechos2sem = Math.max(1, Math.round(14 / r.ciclo));
  const ritmoMeta = { label:'Ritmo por trechos', sub:'Meta: ' + r.minimo + '+ dias de estudo a cada ' + r.ciclo + ' (trecho aceso) · sessão mínima conta', pct:Math.round(r.minimo / r.ciclo * 100), color:'var(--p3)', target:r.minimo + '/' + r.ciclo + ' dias' };
  const metricDefs = {
    es: {
      main: [
        { label:'Tempo de exposição', sub:'Acumulado semanal + diário · Meta: 6–10h / semana', pct:70, color:'var(--accent)', target:'6–10h/sem' },
        { label:'Compreensão estimada', sub:'Crescimento 30% → 80%', pct:40, color:'var(--p1)', target:'30→80%' },
        ritmoMeta,
      ],
      secondary: [
        { label:'Minutos de fala sem roteiro', sub:'F1: 2 min → F5: 10+ min' },
        { label:'Dependência do português', sub:'Alta/Média/Baixa · Meta: baixa a partir do Dia 80' },
        { label:'Quantidade de pausas', sub:'Subjetivo na gravação · Percepção de fluidez' },
        { label:'Capacidade de contornar', sub:'Usa paráfrase em vez de travar? 0–5' },
        { label:'Expressões reutilizadas', sub:'Usadas espontaneamente esta semana' },
      ],
      phases: ['30–40%','50–60%','65–70%','75–80%','80–85%'],
    },
    fr: {
      main: [
        { label:'Tempo de exposição', sub:'Acumulado semanal + diário · Meta: 6–10h / semana', pct:70, color:'var(--accent)', target:'6–10h/sem' },
        { label:'Compreensão estimada', sub:'Crescimento 30% → 75%', pct:35, color:'var(--p1)', target:'30→75%' },
        ritmoMeta,
      ],
      secondary: [
        { label:'Minutos de fala sem roteiro', sub:'T1: 2 min → T2: 10+ min' },
        { label:'Pronúncia — qualidade dos sons-chave', sub:'/y/ /ʁ/ nasais · Autoavaliação 0–10' },
        { label:'Liaison e enchaînement em contexto', sub:'Boa / Parcial / Difícil' },
        { label:'Dependência de tradução', sub:'Alta/Média/Baixa · Meta: baixa a partir do Dia 120' },
        { label:'Reconhecimento escrita vs fala', sub:'Palavras que lê mas não reconhece na fala' },
      ],
      phases: ['30–40%','45–55%','55–65%','65–70%','70–75%','75%+'],
    },
    zh: {
      main: [
        { label:'Tempo de exposição', sub:'Acumulado semanal + diário · Meta: 6–10h / semana', pct:70, color:'var(--accent)', target:'6–10h/sem' },
        { label:'Compreensão estimada', sub:'Crescimento 20% → 72–80%', pct:25, color:'var(--p1)', target:'20→80%' },
        ritmoMeta,
      ],
      secondary: [
        { label:'Precisão dos tons', sub:'Autoavaliação 0–10 · Meta: acima de 7 a partir da F2' },
        { label:'Caracteres reconhecidos', sub:'Estimativa acumulada · F1:150 F2:300 F3:450 F4:650 F5:850 F6:1000+' },
        { label:'Leitura sem pinyin', sub:'Ainda necessário / Parcial / Dispensável' },
        { label:'Minutos de fala sem roteiro', sub:'F1: 1 min → F6: 12+ min' },
        { label:'Pares tonais confundidos', sub:'Registrar par mais difícil da semana' },
        { label:'Produção escrita (digitação por pinyin)', sub:'Frases completas digitadas corretamente' },
      ],
      phases: ['25–35%','35–45%','45–55%','55–65%','65–72%','72–80%'],
    },
  };

  const d = metricDefs[lang];
  const p = PROGRAMS[lang];
  const phaseColors = ['var(--p1)','var(--p2)','var(--p3)','var(--p4)','var(--p5)','var(--p6)'];

  const mainBars = d.main.map(m => `
    <div class="mrow">
      <div class="mrow-lbl"><strong>${m.label}</strong><small>${m.sub}</small></div>
      <div class="mrow-track"><div class="mrow-fill" style="width:${m.pct}%;background:${m.color}"></div></div>
      <div class="mrow-target">${m.target}</div>
    </div>`).join('');

  const secondaryItems = d.secondary.map(s => `
    <li><span class="dot da"></span>
      <div><strong>${s.label}</strong><br><span style="color:var(--tx2);font-size:12px">${s.sub}</span></div>
    </li>`).join('');

  const phaseTiles = d.phases.map((val, i) => {
    const ph = p.phases[i];
    if (!ph) return '';
    return `<div class="stat" style="flex:1 1 calc(${100/d.phases.length}% - 8px)">
      <div class="stat-v" style="color:${phaseColors[i]};font-size:18px">${val}</div>
      <div class="stat-l">D${ph.end} (${ph.num})</div>

  return `

      <div class="gn">${phaseTiles}</div>
    </div>
    <div class="card">
      <div class="card-title" style="margin-bottom:12px">Critérios de avanço, revisão e ajuste</div>
      <ul class="ilist">
        <li><span class="dot d3"></span><div><strong>Avançar:</strong> Meta de compreensão atingida + os últimos ${trechos2sem} trechos acesos (~2 semanas) + marco de fala atingido</div></li>
        <li><span class="dot da"></span><div><strong>Revisar:</strong> Compreensão estagnada por 2+ semanas → reduzir dificuldade, revisar protocolo, adicionar conteúdo familiar</div></li>
        <li><span class="dot d4"></span><div><strong>Simplificar:</strong> 2 trechos seguidos em pausa → reduzir exigência, focar em sessão mínima até retomar ritmo</div></li>
        <li><span class="dot d1"></span><div><strong>Aumentar dificuldade:</strong> Compreensão consistentemente acima do teto por 10+ dias → retirar apoios, introduzir conteúdo mais desafiador</div></li>
      </ul>
    </div>`;
}

function buildHistorico(lang) {
  const p = PROGRAMS[lang];
  const checkins = lerCheckins(lang);
  /* Importar fica visível mesmo sem dados: é assim que se traz o backup para um aparelho novo */
  const botoes = `
    <div class="btns" style="margin-bottom:14px">
      ${checkins.length ? '<button class="btn btn-g" onclick="exportarCheckins()">Exportar JSON</button>' : ''}
      <button class="btn btn-g" onclick="importarCheckins()">Importar JSON</button>
    </div>`;

  if (!checkins.length) {
    return `
      <div class="pg-h"><div class="pg-title">Histórico</div>
        <div class="pg-sub">Registros salvos de check-in para ${p.name}.</div></div>
      ${botoes}
      <div class="planned-banner">
        <div class="planned-icon">📋</div>
        <h2>Nenhum check-in registrado ainda</h2>
        <p>Seus check-ins salvos aparecerão aqui.<br>Acesse a aba Check-in e clique em Salvar após preencher.<br>Tem um backup de outro aparelho? Use Importar JSON.</p>
      </div>`;
  }

  const nomeSessao = { completa:'completa', padrao:'padrão', minima:'mínima', zero:'sem estudo' };
  const valor = (v, suf) => (v === undefined || v === null || v === '' ? '—' : esc(v) + suf);
  const rows = [...checkins].reverse().map(c => {
    const date = c.timestamp ? new Date(c.timestamp).toLocaleDateString('pt-BR') : '—';
    /* Ações logo depois do dia: no celular a tabela rola de lado e o fim fica fora da tela */
    return `<tr>
      <td>${c.dia}</td>
      <td class="hist-acoes">
        <button class="btn btn-g btn-xs" onclick="editarCheckin(${c.dia})" aria-label="Editar o dia ${c.dia}">Editar</button>
        <button class="btn btn-g btn-xs" onclick="apagarCheckin(${c.dia}, this)" aria-label="Apagar o dia ${c.dia}">Apagar</button>
      </td>
      <td>${date}${c.editadoEm ? ' <small style="color:var(--tx3)">· editado</small>' : ''}</td>
      <td>${esc(nomeSessao[c.sessao] || c.sessao || '—')}</td>
      <td>${valor(c.compreensao, '%')}</td>
      <td>${valor(c.fala, ' min')}</td>
      <td style="color:var(--tx2);font-size:12px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.avanco || '—')}</td>
    </tr>`;
  }).join('');

  return `
    <div class="pg-h"><div class="pg-title">Histórico</div>
      <div class="pg-sub">${checkins.length} ${checkins.length === 1 ? 'dia registrado' : 'dias registrados'} em ${p.name}. Para corrigir um dia, use Editar: o registro é substituído, sem duplicar.</div></div>
    ${botoes}
    <div class="card" style="padding:0;overflow:hidden">
      <table class="ev-table">
        <thead><tr><th>Dia</th><th><span class="jn-vh">Ações</span></th><th>Data</th><th>Sessão</th><th>Compreensão</th><th>Fala</th><th>Avanço</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

/* ═══════════════════════════════════════════════════════
   VERSÃO E STORAGE — polyglot.{lang}.{key}
═══════════════════════════════════════════════════════ */
const APP_VERSION = '2.5.0';

/* Chave com prefixo polyglot + lang + key
   Exemplo: polyglot.es.checkins */
function storageKey(lang, key) {
  return 'polyglot.' + lang + '.' + key;
}

function getStore(lang, key) {
  try {
    const raw = localStorage.getItem(storageKey(lang, key));
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function setStore(lang, key, value) {
  try {
    localStorage.setItem(storageKey(lang, key), JSON.stringify(value));
    return true;
  } catch(e) { return false; }
}

/* O navegador guarda dados? (modo privado ou bloqueio de cookies podem impedir) */
function armazenamentoOk() {
  try {
    localStorage.setItem('polyglot.meta.teste', '1');
    localStorage.removeItem('polyglot.meta.teste');
    return true;
  } catch(e) { return false; }
}

/* Data local AAAA-MM-DD. A data em UTC "vira" às 20h ou 21h no Brasil. */
function dataLocal(ts) {
  if (ts == null || ts === '') return '';
  const d = new Date(ts);
  if (isNaN(d.getTime())) return '';
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

/* Texto do usuário, de arquivo importado ou da IA antes de ir para innerHTML */
function esc(v) {
  return immersionEscape(v);
}

/* Dia do programa válido (inteiro de 1 ao total) ou 0 */
function diaValido(lang, v) {
  const n = typeof v === 'string' && v.trim() === '' ? NaN : Number(v);
  return Number.isInteger(n) && n >= 1 && n <= PROGRAMS[lang].totalDays ? n : 0;
}

/* Check-ins legíveis: só objetos com dia válido, em ordem de dia */
function lerCheckins(lang) {
  const lista = getStore(lang, 'checkins');
  if (!Array.isArray(lista)) return [];
  return lista
    .filter(c => c && typeof c === 'object' && diaValido(lang, c.dia))
    .map(c => (typeof c.dia === 'number' ? c : { ...c, dia: Number(c.dia) }))
    .sort((a, b) => a.dia - b.dia);
}

/* Um registro por dia. Vence a versão editada por último; a data do
   primeiro registro do dia continua como âncora do dia sugerido.
   Versões antigas e registros inválidos voltam em `sobras`. */
function normalizarCheckins(lang, lista) {
  const criado = c => Date.parse(c.timestamp) || 0;
  const editado = c => Date.parse(c.editadoEm) || criado(c);
  const porDia = new Map(), sobras = [];
  (Array.isArray(lista) ? lista : []).forEach(c => {
    const dia = c && typeof c === 'object' ? diaValido(lang, c.dia) : 0;
    if (!dia) { if (c != null) sobras.push(c); return; }
    const novo = { ...c, dia };
    const atual = porDia.get(dia);
    if (!atual) { porDia.set(dia, novo); return; }
    const vence = editado(novo) >= editado(atual) ? novo : atual;
    const perde = vence === novo ? atual : novo;
    const final = { ...vence };
    const inicio = Math.min(...[criado(atual), criado(novo)].filter(Boolean));
    if (isFinite(inicio) && inicio !== criado(vence)) {
      final.timestamp = new Date(inicio).toISOString();
      final.editadoEm = new Date(editado(vence)).toISOString();
    }
    porDia.set(dia, final);
    if (JSON.stringify(perde) !== JSON.stringify(vence)) sobras.push(perde);
  });
  return { lista: [...porDia.values()].sort((a, b) => a.dia - b.dia), sobras };
}

/* Guarda versões substituídas ou apagadas (as 500 mais recentes), para nada se perder */
function arquivarCheckins(lang, itens) {
  if (!itens || !itens.length) return true;
  const atual = getStore(lang, 'checkinsArquivados');
  const quando = new Date().toISOString();
  const novos = itens.map(c => ({ ...(c && typeof c === 'object' ? c : { valor: c }), arquivadoEm: quando }));
  return setStore(lang, 'checkinsArquivados', (Array.isArray(atual) ? atual : []).concat(novos).slice(-500));
}

/* ── Migração completa e silenciosa ─────────────────────
   Roda uma única vez no init. Detecta todos os formatos
   anteriores e migra para polyglot.{lang}.{key}.
   Registra a versão após migração para não rodar novamente.
─────────────────────────────────────────────────────── */
function runMigrations() {
  const migratedKey = 'polyglot.meta.migratedVersion';
  const already = localStorage.getItem(migratedKey);
  if (already === APP_VERSION) return;

  /* v1 → v2: chave 'checkins' sem namespace (espanhol original) */
  try {
    const v1 = localStorage.getItem('checkins');
    if (v1) {
      const data = JSON.parse(v1);
      if (Array.isArray(data) && data.length > 0) {
        const dest = storageKey('es', 'checkins');
        if (!localStorage.getItem(dest)) {
          localStorage.setItem(dest, v1);
        }
      }
      localStorage.removeItem('checkins');
    }
  } catch(e) {}

  /* v2 → v2.1: chave '{lang}.{key}' sem prefixo polyglot */
  ['es', 'fr', 'zh'].forEach(lang => {
    ['checkins', 'currentDay', 'evaluations', 'metrics', 'settings'].forEach(key => {
      const oldKey = lang + '.' + key;
      const newKey = storageKey(lang, key);
      try {
        const old = localStorage.getItem(oldKey);
        if (old && !localStorage.getItem(newKey)) {
          localStorage.setItem(newKey, old);
        }
        if (old) localStorage.removeItem(oldKey);
      } catch(e) {}
    });
  });

  /* v2.3: um check-in por dia. Correções e cliques duplos tinham virado
     registros repetidos; as versões antigas vão para checkinsArquivados. */
  ['es', 'fr', 'zh'].forEach(lang => {
    try {
      const bruto = getStore(lang, 'checkins');
      if (!Array.isArray(bruto) || !bruto.length) return;
      const { lista, sobras } = normalizarCheckins(lang, bruto);
      const igual = !sobras.length && JSON.stringify(lista) === JSON.stringify(bruto);
      if (igual) return;
      if (arquivarCheckins(lang, sobras)) setStore(lang, 'checkins', lista);
    } catch(e) {}
  });

  localStorage.setItem(migratedKey, APP_VERSION);
  if (!localStorage.getItem('polyglot.meta.firstSeen')) {
    localStorage.setItem('polyglot.meta.firstSeen', new Date().toISOString());
  }
}

/* ═══════════════════════════════════════════════════════
   PAINEL DE INTELIGÊNCIA — builder de UI
═══════════════════════════════════════════════════════ */
function buildPainel(lang) {
  const p = PROGRAMS[lang];
  const d = calcAccumulated(lang);

  if (!d.totalCheckins) {
    return `
      <div class="pg-h">
        <div class="pg-title">Painel de Inteligência</div>
        <div class="pg-sub">Coach linguístico automático — baseado nos seus check-ins salvos.</div>
      </div>
      <div class="planned-banner">
        <div class="planned-icon">🧠</div>
        <h2>Nenhum dado ainda</h2>
        <p>Salve pelo menos um check-in para ativar o painel.<br>Os dados são calculados automaticamente a partir do seu histórico.</p>
      </div>`;
  }

  /* ── Cores de risco ─────────────────────────────── */
  const riscoColor = { baixo:'var(--p3)', médio:'var(--p2)', alto:'var(--p4)' };
  const riscoC = riscoColor[d.riscoAbandono] || 'var(--p3)';

  /* ── Mini sparkline de compreensão (SVG inline) ─── */
  function sparkline(points) {
    if (!points.length) return '<span style="color:var(--tx3);font-size:12px">sem dados</span>';
    const vals = points.map(p => p.val);
    const min = Math.min(...vals), max = Math.max(...vals);
    const range = max - min || 1;
    const w = 120, h = 32, pad = 2;
    const pts = vals.map((v, i) => {
      const x = pad + (i / Math.max(vals.length-1,1)) * (w - pad*2);
      const y = pad + (1 - (v - min) / range) * (h - pad*2);
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    const last = vals[vals.length-1];
    const trend = vals.length > 1 ? (last > vals[0] ? '↗' : last < vals[0] ? '↘' : '→') : '·';
    const trendColor = trend === '↗' ? 'var(--p3)' : trend === '↘' ? 'var(--p4)' : 'var(--tx3)';
    return `<svg width="${w}" height="${h}" style="vertical-align:middle">
      <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="${+pts.split(' ').pop().split(',')[0]}" cy="${+pts.split(' ').pop().split(',')[1]}" r="3" fill="var(--accent)"/>
    </svg> <span style="color:${trendColor};font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px">${trend} ${last}%</span>`;
  }

  /* ── Barra de progresso inline ─────────────────── */
  const maiorDia = Math.max(0, ...lerCheckins(lang).map(c => c.dia));
  const pct = Math.min(100, Math.round(maiorDia / p.totalDays * 100));

  /* ── Pontos fortes / fracos como tags ────────────── */
  const tagStrong = d.pontosFortres.map(t =>
    `<span style="display:inline-block;background:var(--p3a);color:var(--p3);border:1px solid var(--p3b);border-radius:3px;padding:3px 9px;font-size:12px;margin:3px 3px 3px 0">${t}</span>`
  ).join('') || '<span style="color:var(--tx3);font-size:13px">Dados insuficientes — continue registrando check-ins.</span>';

  const tagWeak = d.pontosFrageis.map(t =>
    `<span style="display:inline-block;background:var(--p4a);color:var(--p4);border:1px solid var(--p4b);border-radius:3px;padding:3px 9px;font-size:12px;margin:3px 3px 3px 0">${t}</span>`
  ).join('') || '<span style="color:var(--tx3);font-size:13px">Nenhum ponto fraco identificado ainda.</span>';

  return `
    <div class="pg-h">
      <div class="pg-title">Painel de Inteligência</div>
      <div class="pg-sub">Coach automático — ${p.name} · ${d.totalCheckins} ${d.totalCheckins === 1 ? 'dia registrado' : 'dias registrados'} · v${APP_VERSION}</div>
    </div>

    <!-- Recomendação principal -->
    <div class="alert" style="border-left:3px solid var(--accent);padding-left:16px">
      <strong>Recomendação:</strong> ${d.recomendacao}
    </div>

    <!-- KPIs principais -->
    <div class="g3" style="margin-bottom:14px">
      <div class="stat">
        <div class="stat-v">${d.diasEstudados}</div>
        <div class="stat-l">dias estudados</div>
      </div>
      <div class="stat">
        <div class="stat-v">${d.ritmoTotal ? d.ritmoAcesos + '/' + d.ritmoTotal : '—'}</div>
        <div class="stat-l">ritmo · trechos acesos</div>
      </div>
      <div class="stat">
        <div class="stat-v" style="font-size:18px">${d.projecaoCEFR}</div>
        <div class="stat-l">nível estimado atual</div>
      </div>
    </div>

    <!-- Progresso do programa -->
    <div class="card">
      <div class="card-row"><span class="tag ta">Progresso</span><div class="card-title">Avanço no programa</div></div>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
        <div style="flex:1;height:8px;background:var(--bd);border-radius:4px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:linear-gradient(90deg,var(--p1),var(--accent));border-radius:4px;transition:width .4s"></div>
        </div>
        <span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:var(--accent);flex-shrink:0">${pct}%</span>
      </div>
      <div style="display:flex;gap:24px;font-size:13px;flex-wrap:wrap">
        <span><strong style="color:var(--tx)">${d.hrsAcumuladas}h</strong> <span style="color:var(--tx2)">estimadas de estudo</span></span>
        <span><strong style="color:var(--tx)">${Math.round(d.totalMinFala / 60 * 10)/10}h</strong> <span style="color:var(--tx2)">de fala registrada</span></span>
        <span><strong style="color:var(--tx)">${d.hrsEscutaUber}h</strong> <span style="color:var(--tx2)">de escuta em momentos ociosos (estimada)</span></span>
        <span><strong style="color:var(--tx)">${d.serieTrechos}</strong> <span style="color:var(--tx2)">${d.serieTrechos === 1 ? 'trecho aceso seguido' : 'trechos acesos seguidos'}</span></span>
        <span><strong style="color:var(--tx)">${d.maiorSerieTrechos}</strong> <span style="color:var(--tx2)">maior série de trechos</span></span>
      </div>
    </div>

    <!-- Comparação semanal -->
    ${(() => {
      const w = compararSemanas(lang);
      if (!w) return '';
      const linhas = w.metricas.map(m => {
        const up = m.delta > 0, down = m.delta < 0;
        const cor = up ? 'var(--p3)' : down ? 'var(--p4)' : 'var(--tx3)';
        const seta = up ? '▲' : down ? '▼' : '—';
        const sinal = m.delta > 0 ? '+' : '';
        return `<div class="mrow">
          <div class="mrow-lbl"><strong>${m.label}</strong>
            <small>semana anterior: ${m.anterior}${m.unit}</small></div>
          <div style="flex:1"></div>
          <div style="font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;
                      font-size:15px;font-weight:700;color:var(--tx);min-width:70px;text-align:right">${m.atual}${m.unit}</div>
          <div style="font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;
                      font-size:12px;font-weight:600;color:${cor};min-width:72px;text-align:right">${seta} ${sinal}${m.delta}${m.unit}</div>
        </div>`;
      }).join('');
      return `<div class="card">
        <div class="card-row"><span class="tag t3">Tendência</span><div class="card-title">Esta semana vs anterior</div>
          <span style="margin-left:auto;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;color:var(--tx3)">${w.nAtual} vs ${w.nAnterior} registros</span></div>
        ${linhas}
      </div>`;

    <!-- Ritmo por trechos -->
    ${(() => {
      const r = ritmoAtual();

      return `<div class="card">
      <div class="card-row"><span class="tag t3">Ritmo</span><div class="card-title">Regularidade de estudo</div></div>
      <p class="card-sub">Trecho = ${r.ciclo} dias do programa. Ele acende com ${r.minimo} dias de estudo, e a sessão mínima conta.</p>
      <div class="mrow">
        <div class="mrow-lbl"><strong>Últimos trechos</strong><small>Até 7 trechos encerrados · Meta: todos acesos</small></div>
        <div class="mrow-track"><div class="mrow-fill" style="width:${d.ritmoPct}%;background:${cor(d.ritmoPct)}"></div></div>
        <div class="mrow-target">${d.ritmoTotal ? d.ritmoAcesos + '/' + d.ritmoTotal : '—'}</div>
      </div>
      <div class="mrow">
        <div class="mrow-lbl"><strong>Programa inteiro</strong><small>Trechos acesos desde o primeiro check-in</small></div>
        <div class="mrow-track"><div class="mrow-fill" style="width:${pctPrograma}%;background:${cor(pctPrograma)}"></div></div>
        <div class="mrow-target">${d.encerradosTotal ? d.encerradosAcesos + '/' + d.encerradosTotal : '—'}</div>
      </div>
      <div class="mrow">
        <div class="mrow-lbl"><strong>Pausas seguidas</strong><small>Trechos recentes sem o mínimo · 2 ou mais pedem sessão mínima</small></div>
        <div class="mrow-track"><div class="mrow-fill" style="width:${Math.min(100, d.pausasSeguidas * 50)}%;background:${d.pausasSeguidas >= 2 ? 'var(--p2)' : 'var(--tx3)'}"></div></div>
        <div class="mrow-target">${d.pausasSeguidas}</div>
      </div>
    </div>`;
    })()}

    <!-- Compreensão -->
    <div class="card">
      <div class="card-row"><span class="tag t1">Compreensão</span><div class="card-title">Evolução auditiva</div></div>
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
        <div>
          <div style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:28px;font-weight:700;color:var(--accent)">${d.mediaCompreensao}%</div>
          <div style="font-size:12px;color:var(--tx2)">média geral · últimos 10 registros:</div>
        </div>
        <div>${sparkline(d.evolucaoCompreensao)}</div>
      </div>
      <div style="margin-top:14px;display:flex;gap:16px;flex-wrap:wrap;font-size:13px">
        <span>Energia média: <strong style="color:var(--accent)">${d.mediaEnergia}/10</strong></span>
        <span>Fala acumulada: <strong style="color:var(--accent)">${d.totalMinFala} min</strong></span>
        <span>Nível estimado: <strong style="color:var(--accent)">${d.projecaoCEFR}</strong></span>
      </div>
    </div>

    <!-- Projeções -->
    <div class="g2">
      <div class="card">
        <div class="card-title" style="margin-bottom:10px">📅 Projeção de conclusão</div>
        <div style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:22px;font-weight:700;color:var(--accent);margin-bottom:6px">${d.projecaoConclusao}</div>
        <div style="font-size:12px;color:var(--tx2)">Estimativa baseada no ritmo atual de dias estudados vs dias decorridos.</div>
      </div>
      <div class="card">
        <div class="card-title" style="margin-bottom:10px">⚠ Risco de abandono</div>
        <div style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:22px;font-weight:700;color:${riscoC};margin-bottom:6px;text-transform:uppercase">${d.riscoAbandono}</div>
        <div style="font-size:12px;color:var(--tx2)">Calculado pelos trechos recentes (pausas seguidas e ritmo dos últimos 7) e pela energia dos últimos 8 dias, sem contar plantões.</div>
      </div>
    </div>

    <!-- Pontos fortes e fracos -->
    <div class="card">
      <div class="card-row"><span class="tag t3">Diagnóstico</span><div class="card-title">Pontos fortes</div></div>
      <div>${tagStrong}</div>
    </div>
    <div class="card">
      <div class="card-row"><span class="tag t4">Diagnóstico</span><div class="card-title">Pontos a melhorar</div></div>
      <div>${tagWeak}</div>

    <!-- Atualizar painel -->
    <div class="btns">
      <button class="btn btn-g" onclick="renderPage('painel')">↻ Atualizar</button>
      <button class="btn btn-g" onclick="go('historico', document.querySelector('[onclick*=historico]'))">Ver histórico completo</button>
    </div>`;
}

/* ═══════════════════════════════════════════════════════
   TEMA CLARO / ESCURO
═══════════════════════════════════════════════════════ */
const THEME_KEY = 'polyglot.meta.theme';

function applyTheme(theme) {
  const root = document.documentElement;
  if (theme === 'light') root.setAttribute('data-theme', 'light');
  else                   root.removeAttribute('data-theme');

  /* theme-color da barra do navegador acompanha */
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'light' ? '#f4f4f9' : '#0c0c10');

  try { localStorage.setItem(THEME_KEY, theme); } catch(e) {}
}

function currentTheme() {
  return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
}

function toggleTheme() {
  applyTheme(currentTheme() === 'light' ? 'dark' : 'light');
}

/* Resolve o tema inicial: preferência salva > preferência do sistema > escuro */
function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch(e) {}
  if (saved === 'light' || saved === 'dark') { applyTheme(saved); return; }
  var prefersLight = false;
  try { prefersLight = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches); } catch(e) {}
  applyTheme(prefersLight ? 'light' : 'dark');
}

/* Acompanha mudança do sistema enquanto o usuário não escolher manualmente.
   Safari < 14 e WebKit antigo não têm addEventListener em MediaQueryList —
   por isso o fallback para addListener e o try/catch. */
(function watchSystemTheme(){
  if (!window.matchMedia) return;
  var mq;
  try { mq = window.matchMedia('(prefers-color-scheme: light)'); } catch(e) { return; }
  if (!mq) return;

  function onChange(e){
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch(err) {}
    if (!saved) applyTheme(e.matches ? 'light' : 'dark');
  }

  try {
    if (typeof mq.addEventListener === 'function')      mq.addEventListener('change', onChange);
    else if (typeof mq.addListener === 'function')      mq.addListener(onChange);
  } catch(e) { /* navegador sem suporte — ignora */ }
})();

/* ═══════════════════════════════════════════════════════
   ESTADO GLOBAL
═══════════════════════════════════════════════════════ */
let currentLang = 'es';
let currentPage = 'visao';

/* ═══════════════════════════════════════════════════════
   TROCA DE IDIOMA
═══════════════════════════════════════════════════════ */
function switchLang(lang) {
  const resetImmersionScroll = currentPage === 'imersao' && lang !== currentLang;
  if (lang !== currentLang) leitorParar();   // trocou de idioma: a leitura do outro idioma para
  if (PROGRAMS[lang].status === 'planned' && lang !== 'es') {
    // Permite entrar mesmo em "planejado" para ver o conteúdo
  }
  currentLang = lang;
  const p = PROGRAMS[lang];
  try { localStorage.setItem('polyglot.meta.lang', lang); } catch(e) {}

  // Cor de destaque: aponta para as variáveis do idioma, que já mudam com o tema.
  // (Antes recebia o hexadecimal do tema escuro, e o tema claro ficava com amarelo sobre branco.)
  document.documentElement.style.setProperty('--accent',   'var(--' + lang + ')');
  document.documentElement.style.setProperty('--accent-a', 'var(--' + lang + '-a)');
  document.documentElement.style.setProperty('--accent-b', 'var(--' + lang + '-b)');

  // Botões de idioma
  document.querySelectorAll('.lang-btn').forEach(btn => {
    const l = btn.dataset.lang;
    btn.setAttribute('aria-pressed', String(l === lang));
    btn.className = 'lang-btn';
    if (l === lang) btn.classList.add('active-' + lang);
    else if (PROGRAMS[l].status === 'planned') btn.classList.add('planned');
  });

  // Atualizar topbar
  updateTopbar();
  syncJornadaNav();

  // Renderizar página atual
  renderPage(currentPage);
  if (resetImmersionScroll) document.getElementById('content').scrollTop = 0;
}

/* ═══════════════════════════════════════════════════════
   TOPBAR DINÂMICO
═══════════════════════════════════════════════════════ */
function updateTopbar() {
  const p = PROGRAMS[currentLang];
  const day = diaAtualPrograma(currentLang);

  // Badge
  const pad = String(day).padStart(String(p.totalDays).length, '0');
  document.getElementById('day-badge').textContent = 'DIA ' + pad + '/' + p.totalDays;

  // Pips
  const pipsEl = document.getElementById('phase-pips');
  const labelsEl = document.getElementById('phase-labels');
  pipsEl.innerHTML = '';
  labelsEl.innerHTML = '';

  const currentPhase = p.phases.findIndex(ph => day <= ph.end);
  const activeIdx = currentPhase === -1 ? p.phases.length - 1 : currentPhase;

  /* Modo viagem: fases viram estações com o código da cidade */
  const jornada = jornadaAtiva(currentLang);
  const cidades = JORNADA_CIDADES[currentLang] || [];
  pipsEl.parentElement.classList.toggle('jn', jornada);

  p.phases.forEach((ph, i) => {
    const cidade = jornada ? cidades[i] : null;
    const pip = document.createElement('div');
    pip.className = 't-pip' + (i > activeIdx ? ' dim' : '');
    pip.style.background = ph.color;
    pip.title = (cidade ? cidade.nome + ' · ' : '') + ph.name + ' · ' + ph.days;
    pipsEl.appendChild(pip);

    const lbl = document.createElement('span');
    lbl.className = 't-lbl' + (cidade && i === activeIdx ? ' on' : '');
    lbl.textContent = cidade ? cidade.codigo : ph.num;
    labelsEl.appendChild(lbl);
  });
}

function onDayChange(val) {
  const p = PROGRAMS[currentLang];
  /* Sem histórico, o campo define o dia de início. Com histórico, o dia
     de hoje vem do calendário: corrigir um dia antigo não mexe no topo. */
  const day = lerCheckins(currentLang).length
    ? diaSugerido(currentLang)
    : Math.min(p.totalDays, Math.max(1, parseInt(val) || 1));
  setStore(currentLang, 'currentDay', day);
  updateTopbar();
}

/* ═══════════════════════════════════════════════════════
   NAVEGAÇÃO
═══════════════════════════════════════════════════════ */
function go(pageId, btn) {
  if (currentPage === 'imersao' && pageId !== 'imersao') leitorParar();
  currentPage = pageId;
  try { localStorage.setItem('polyglot.meta.page', pageId); } catch(e) {}
  document.querySelectorAll('.s-item').forEach(s => {
    s.classList.toggle('on', s.getAttribute('data-page') === pageId);
  });
  syncBottomNav(pageId);
  document.getElementById('sidebar').classList.remove('open');
  const _bd = document.getElementById('backdrop'); if (_bd) _bd.classList.remove('show');
  document.getElementById('content').scrollTo(0, 0);
  renderPage(pageId);
}

function renderPage(pageId) {
  const langContent = CONTENT[currentLang];
  const root = document.getElementById('page-root');
  if (_draftTimer) gravarRascunho();   // não perde o que foi digitado nos últimos 0,4 s

  if (!langContent || !langContent[pageId]) {
    root.innerHTML = '<div class="planned-banner"><div class="planned-icon">🚧</div><h2>Conteúdo não disponível</h2><p>Esta seção ainda não está configurada para este idioma.</p></div>';
    return;
  }

  document.body.classList.toggle('im-route', pageId === 'imersao');
  let html = langContent[pageId]();
  if (pageId === 'fases' && jornadaDisponivel(currentLang)) html = buildJornada(currentLang) + html;
  root.innerHTML = html;
  if (pageId === 'fases') marcarCarimbosVistos(currentLang);
  if (pageId === 'imersao') {
    restoreImmersionDrafts(currentLang);
    leitorRefletir();   // depois de redesenhar, a frase lida continua destacada
    return;
  }
  acessibilizarAccordions(root);
  rotularCampos(root);

  // Reinit ranges após renderização
  root.querySelectorAll('input[type="range"]').forEach(r => {
    const pct = ((r.value - r.min) / (r.max - r.min)) * 100;
    r.style.backgroundSize = pct + '% 100%';
  });

  // Check-in: dia sugerido, rascunho e auto-save
  const diaInput = document.getElementById('ci-dia');
  if (diaInput) {
    diaInput.value = diaSugerido(currentLang);
    onDayChange(diaInput.value);
    restaurarRascunho();
    ligarAutoSave(root);
    let pref = '0'; try { pref = localStorage.getItem('polyglot.meta.ciRapido') || '0'; } catch(e) {}
    setModoRapido(pref === '1');
    ['ci-tipo-dia','ci-sessao'].forEach(id => {
      const el = document.getElementById(id); if (el) el.addEventListener('change', autoModoRapido);
    });
  }
}

/* ═══════════════════════════════════════════════════════
   MODO RÁPIDO DO CHECK-IN
═══════════════════════════════════════════════════════ */
function setModoRapido(on) {
  document.body.classList.toggle('ci-rapido', !!on);
  const sw = document.getElementById('ci-rapido-sw');
  if (sw) sw.setAttribute('aria-checked', on ? 'true' : 'false');
  try { localStorage.setItem('polyglot.meta.ciRapido', on ? '1' : '0'); } catch(e) {}
}
function toggleModoRapido() {
  setModoRapido(!document.body.classList.contains('ci-rapido'));
}
/* Auto-sugere modo rápido quando o dia é pesado */
function autoModoRapido() {
  const tipo = document.getElementById('ci-tipo-dia');
  const sess = document.getElementById('ci-sessao');
  if (!tipo || !sess) return;
  const pesado = ['plantao','pos-plantao'].includes(tipo.value) || ['minima','zero'].includes(sess.value);
  if (pesado && !document.body.classList.contains('ci-rapido')) {
    setModoRapido(true);
    toast('Modo rápido ativado — dia pesado detectado.');
  }
}

function syncBottomNav(pageId) {
  document.querySelectorAll('.bn-item[data-page]').forEach(b => {
    b.classList.toggle('on', b.getAttribute('data-page') === pageId);
  });
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('backdrop');
  const open = sb.classList.toggle('open');
  if (bd) bd.classList.toggle('show', open);
}
/* ═══════════════════════════════════════════════════════
   ATALHOS DE TECLADO
   Esc           fecha menu
   Ctrl/Cmd+Enter salva check-in (na página de check-in)
   1–9           navega (fora de campos de texto)
   T             alterna tema
   ?             mostra atalhos
═══════════════════════════════════════════════════════ */
const PAGE_KEYS = { '1':'checkin','2':'painel','3':'fases','4':'rotinas','5':'metodo',
                    '6':'avaliacoes','7':'metricas','8':'historico','9':'extras' };

function emCampoTexto() {
  const a = document.activeElement;
  if (!a) return false;
  const tag = a.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || a.isContentEditable;
}

document.addEventListener('keydown', e => {
  /* Esc: fecha menu */
  if (e.key === 'Escape') {
    const sb = document.getElementById('sidebar');
    if (sb && sb.classList.contains('open')) toggleSidebar();
    return;
  }
  /* Ctrl/Cmd+Enter: salva check-in mesmo dentro de um campo */
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    /* Tecla segurada repete o evento: só o primeiro salva */
    if (currentPage === 'checkin') { e.preventDefault(); if (!e.repeat) salvarCheckin(); }
    return;
  }
  /* Demais atalhos só fora de campos de texto */
  if (emCampoTexto() || e.ctrlKey || e.metaKey || e.altKey) return;

  if (PAGE_KEYS[e.key]) { e.preventDefault(); go(PAGE_KEYS[e.key], null); return; }
  if (e.key === 't' || e.key === 'T') { e.preventDefault(); toggleTheme(); return; }
  if (e.key === '?') { e.preventDefault(); mostrarAtalhos(); return; }
});

function mostrarAtalhos() {
  const linhas = [
    ['1','Check-in'],['2','Inteligência'],['3', jornadaAtiva(currentLang) ? 'Viagem' : 'Fases'],['4','Rotinas'],['5','Método'],
    ['6','Avaliações'],['7','Métricas'],['8','Histórico'],['9','Recursos'],
    ['T','Alternar tema'],['Ctrl+↵','Salvar check-in'],['Esc','Fechar menu'],
  ];
  const html = linhas.map(([k,v]) =>
    `<div style="display:flex;justify-content:space-between;gap:16px;padding:5px 0;border-bottom:1px solid var(--bd2)">
      <span>${v}</span><kbd>${k}</kbd></div>`).join('');
  const out = document.getElementById('page-root');
  if (!out) return;
  const box = document.createElement('div');
  box.className = 'card';
  box.style.cssText = 'position:fixed;top:72px;right:24px;z-index:60;width:260px;box-shadow:0 8px 32px rgba(0,0,0,.4)';
  box.innerHTML = `<div class="card-row"><span class="tag ta">Atalhos</span><div class="card-title">Teclado</div></div>${html}
    <div style="margin-top:10px;font-size:11px;color:var(--tx3)">Pressione <kbd>?</kbd> ou <kbd>Esc</kbd> para fechar</div>`;
  box.id = 'atalhos-box';
  const old = document.getElementById('atalhos-box');
  if (old) { old.remove(); return; }
  document.body.appendChild(box);
  const fechar = ev => { if (ev.key === '?' || ev.key === 'Escape') { box.remove(); document.removeEventListener('keydown', fechar); } };
  document.addEventListener('keydown', fechar);
}
document.getElementById('content').addEventListener('click', () => {
  if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
});

/* ═══════════════════════════════════════════════════════
   ACCORDIONS
═══════════════════════════════════════════════════════ */
function toggleAcc(el) {
  const open = el.classList.toggle('open');
  const head = el.querySelector('.acc-head');
  if (head) head.setAttribute('aria-expanded', open ? 'true' : 'false');
}
function toggleRot(el) {
  const open = el.classList.toggle('open');
  const head = el.querySelector('.rot-head');
  if (head) head.setAttribute('aria-expanded', open ? 'true' : 'false');
}
/* Torna cabeçalhos de accordion acessíveis por teclado e leitor de tela */
function acessibilizarAccordions(root) {
  root.querySelectorAll('.acc, .rot').forEach(box => {
    const head = box.querySelector('.acc-head, .rot-head');
    if (!head) return;
    head.setAttribute('role', 'button');
    head.setAttribute('tabindex', '0');
    head.setAttribute('aria-expanded', box.classList.contains('open') ? 'true' : 'false');
    head.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); head.click(); }
    });
  });
}

/* Liga cada rótulo ao seu campo, para o leitor de tela dizer o nome do campo */
function rotularCampos(root) {
  root.querySelectorAll('.fg').forEach(fg => {
    const label = fg.querySelector('label');
    const campo = fg.querySelector('input, select, textarea');
    if (label && campo && campo.id && !label.htmlFor) label.htmlFor = campo.id;
  });
}

/* ═══════════════════════════════════════════════════════
   RANGES
═══════════════════════════════════════════════════════ */
function updateRange(el, labelId, suffix) {
  const pct = ((el.value - el.min) / (el.max - el.min)) * 100;
  el.style.backgroundSize = pct + '% 100%';
  const lbl = document.getElementById(labelId);
  if (lbl) lbl.textContent = el.value + suffix;
}

/* ═══════════════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════════════ */
function toast(msg, type, ms) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + (type || 'ok');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => { t.className = ''; }, ms || 3200);
}

/* ═══════════════════════════════════════════════════════
   COLETA DO FORMULÁRIO
═══════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════
   RASCUNHO DO CHECK-IN — auto-save silencioso
═══════════════════════════════════════════════════════ */
let _draftTimer = null;
let _draftLang = null;

function salvarRascunho() {
  clearTimeout(_draftTimer);
  _draftLang = currentLang;
  _draftTimer = setTimeout(gravarRascunho, 400);
}

/* Grava já o rascunho pendente (também chamado antes de trocar de página) */
function gravarRascunho() {
  clearTimeout(_draftTimer);
  _draftTimer = null;
  if (!_draftLang || !document.getElementById('ci-dia')) return;
  setStore(_draftLang, 'draft', { data: collectForm(), ts: Date.now() });
  marcarRascunho(true);
}

function restaurarRascunho() {
  const d = getStore(currentLang, 'draft');
  if (!d || !d.data) return false;
  /* Rascunho de outro dia do calendário não volta: aquele dia já passou,
     e restaurá-lo traria o número do dia antigo para o check-in de hoje */
  if (!d.ts || dataLocal(d.ts) !== dataLocal(Date.now())) { limparRascunho(); return false; }
  preencherFormulario(d.data);
  marcarRascunho(true);
  return true;
}

/* Coloca no formulário os valores de um rascunho ou de um check-in salvo */
function preencherFormulario(f) {
  const set = (id, v) => { const el = document.getElementById(id); if (el && v !== undefined && v !== null && v !== '') el.value = v; };
  Object.entries({
    'ci-dia': f.dia, 'ci-sessao': f.sessao, 'ci-tipo-dia': f.tipoDia,
    'ci-fluency': f.fluency, 'ci-drops': f.drops, 'ci-vocab': f.vocab,
    'ci-escuta-ativa': f.escutaAtiva, 'ci-escuta-morto': f.escutaMorto,
    'ci-criacao': f.criacao, 'ci-fonetica': f.fonetica, 'ci-skritter': f.skritter,
    'ci-compreensao': f.compreensao, 'ci-fala': f.fala, 'ci-energia': f.energia,
    'ci-pronuncia': f.pronuncia, 'ci-tons': f.tons, 'ci-chars': f.chars,
    'ci-portuhol': f.portuhol, 'ci-traducao': f.traducao, 'ci-liaison': f.liaison,
    'ci-som-dificil': f.somDificil, 'ci-pinyin': f.pinyin, 'ci-tom-dificil': f.tomDificil,
    'ci-dificuldade': f.dificuldade, 'ci-avanco': f.avanco,
  }).forEach(([id, v]) => set(id, v));
  /* re-sincroniza ranges e labels */
  [['ci-compreensao','compr-val','%'],['ci-energia','energ-val',''],
   ['ci-pronuncia','pron-val',''],['ci-tons','ton-val','']].forEach(([r,l,s]) => {
    const el = document.getElementById(r); if (el) updateRange(el, l, s);
  });
}

function limparRascunho() {
  /* Cancela o auto-save pendente: sem isso, ele regravava o rascunho
     0,4 s depois de salvar, e o check-in do dia seguinte abria com o dia antigo */
  clearTimeout(_draftTimer);
  _draftTimer = null;
  try { localStorage.removeItem(storageKey(currentLang, 'draft')); } catch(e) {}
  marcarRascunho(false);
}

function marcarRascunho(on) {
  const el = document.getElementById('draft-indicator');
  if (!el) return;
  el.style.display = on ? 'inline-flex' : 'none';
}

/* Liga o auto-save em todos os campos do check-in */
function ligarAutoSave(root) {
  root.querySelectorAll('input, select, textarea').forEach(el => {
    el.addEventListener('input',  salvarRascunho);
    el.addEventListener('change', salvarRascunho);
  });
}

function collectForm() {
  const get = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
  const getN = id => { const el = document.getElementById(id); return el ? (parseInt(el.value) || 0) : undefined; };
  return {
    dia:          getN('ci-dia'),
    sessao:       get('ci-sessao'),
    tipoDia:      get('ci-tipo-dia'),
    fluency:      get('ci-fluency'),
    drops:        get('ci-drops'),
    vocab:        get('ci-vocab'),
    escutaAtiva:  get('ci-escuta-ativa'),
    escutaMorto:  get('ci-escuta-morto'),
    criacao:      get('ci-criacao'),
    fonetica:     get('ci-fonetica'),
    skritter:     get('ci-skritter'),
    compreensao:  getN('ci-compreensao'),
    fala:         getN('ci-fala'),
    energia:      getN('ci-energia'),
    pronuncia:    getN('ci-pronuncia'),
    tons:         getN('ci-tons'),
    chars:        getN('ci-chars'),
    portuhol:     get('ci-portuhol'),
    traducao:     get('ci-traducao'),
    liaison:      get('ci-liaison'),
    somDificil:   get('ci-som-dificil'),
    pinyin:       get('ci-pinyin'),
    tomDificil:   get('ci-tom-dificil'),
    dificuldade:  get('ci-dificuldade'),
    avanco:       get('ci-avanco'),
  };
}

/* ═══════════════════════════════════════════════════════
   SALVAR / EXPORTAR / IMPORTAR / LIMPAR
═══════════════════════════════════════════════════════ */
/* Um registro por dia: salvar de novo o mesmo dia substitui (edição).
   O relógio monotônico evita que um duplo clique ou Ctrl+Enter segurado
   repita o salvamento, e um dia à frente de hoje pede um segundo clique. */
let _ultimoSalvar = -Infinity;
let _confirmarDia = null;

function salvarCheckin() {
  const lang = currentLang;
  const p = PROGRAMS[lang];
  const agoraMs = performance.now();
  if (agoraMs - _ultimoSalvar < 800) return;

  const f = collectForm();
  const campoDia = document.getElementById('ci-dia');
  const dia = diaValido(lang, campoDia ? campoDia.value : f.dia);
  if (!dia) {
    toast('Dia inválido. Use um número inteiro de 1 a ' + p.totalDays + '.', 'err', 5000);
    if (campoDia) campoDia.focus();
    return;
  }
  if (!f.sessao) {
    toast('Escolha o tipo de sessão. Se não estudou, marque "Sem estudo hoje".', 'err', 5000);
    const s = document.getElementById('ci-sessao'); if (s) s.focus();
    return;
  }

  const lista = lerCheckins(lang);
  const hoje = diaSugerido(lang);
  const fora = lista.length ? dia > hoje : dia > 1;
  const confirmado = _confirmarDia && _confirmarDia.lang === lang && _confirmarDia.dia === dia
    && agoraMs - _confirmarDia.desde > 700 && agoraMs - _confirmarDia.desde < 10000;
  if (fora && !confirmado) {
    _confirmarDia = { lang, dia, desde: agoraMs };
    toast(lista.length
      ? 'O dia ' + dia + ' está à frente de hoje (dia ' + hoje + '). Se o número estiver certo, clique em Salvar de novo.'
      : 'Primeiro check-in no dia ' + dia + ': a viagem começa daí. Se estiver certo, clique em Salvar de novo.',
      'err', 8000);
    return;
  }
  _confirmarDia = null;

  const nCiclo = Math.ceil(dia / ritmoAtual().ciclo);
  const acesoAntes = jornadaAtiva(lang) && !!(calcJornada(lang).ciclos[nCiclo - 1] || {}).aceso;
  const agora = new Date().toISOString();
  const i = lista.findIndex(c => c.dia === dia);
  const anterior = i >= 0 ? lista[i] : null;
  const registro = Object.assign(f, { dia, lang, timestamp: anterior && anterior.timestamp ? anterior.timestamp : agora });
  if (anterior) { registro.editadoEm = agora; lista[i] = registro; }
  else lista.push(registro);
  lista.sort((a, b) => a.dia - b.dia);

  if (!setStore(lang, 'checkins', lista)) {
    toast('Não foi possível salvar: este navegador não está guardando dados (espaço cheio ou modo privado). O formulário continua preenchido.', 'err', 9000);
    return;
  }
  _ultimoSalvar = agoraMs;
  setStore(lang, 'currentDay', diaSugerido(lang));
  updateTopbar();
  limparRascunho();
  const guia = jornadaAtiva(lang) ? mensagemCheckinViagem(lang, dia, !!anterior, acesoAntes) : '';
  if (guia) toast(guia, 'ok jn', 6500);
  else toast('Check-in do dia ' + dia + (anterior ? ' atualizado. ' : ' salvo. ') + lista.length + (lista.length === 1 ? ' dia registrado.' : ' dias registrados.'));
}

/* Editar: abre o check-in com os dados do dia; salvar substitui o registro */
function editarCheckin(dia) {
  const c = lerCheckins(currentLang).find(x => x.dia === dia);
  if (!c) return;
  limparRascunho();
  go('checkin', null);
  preencherFormulario(c);
  const campo = document.getElementById('ci-dia');
  if (campo) campo.value = dia;
  toast('Editando o dia ' + dia + '. Ao salvar, o registro é substituído.', 'ok', 4500);
}

/* Apagar pede um segundo toque (um toque duplo rápido não conta) */
let _apagar = null;
function desarmarApagar() {
  if (_apagar && _apagar.btn && _apagar.btn.isConnected) {
    _apagar.btn.textContent = 'Apagar';
    _apagar.btn.classList.remove('btn-danger');
  }
  _apagar = null;
}
function apagarCheckin(dia, btn) {
  const agora = performance.now();
  if (!_apagar || _apagar.dia !== dia) {
    desarmarApagar();
    const meu = _apagar = { dia, desde: agora, btn };
    if (btn) { btn.textContent = 'Confirmar?'; btn.classList.add('btn-danger'); }
    setTimeout(() => { if (_apagar === meu) desarmarApagar(); }, 4000);
    return;
  }
  if (agora - _apagar.desde < 600) return;
  _apagar = null;
  const lista = lerCheckins(currentLang);
  if (!setStore(currentLang, 'checkins', lista.filter(c => c.dia !== dia))) {
    toast('Não foi possível apagar: o navegador não está guardando dados.', 'err', 6000);
    return;
  }
  arquivarCheckins(currentLang, lista.filter(c => c.dia === dia));
  updateTopbar();
  renderPage('historico');
  toast('Dia ' + dia + ' apagado.');
}

function exportarCheckins() {
  const lang = currentLang;
  const arr = lerCheckins(lang);
  if (!arr.length) { toast('Nenhum check-in salvo para ' + PROGRAMS[lang].name + '.', 'err'); return; }
  const blob = new Blob([JSON.stringify(arr, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'checkins_' + lang + '.json';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  toast('Exportado: ' + arr.length + ' registro(s) de ' + PROGRAMS[lang].name + '.');
}

function importarCheckins() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      let data;
      try { data = JSON.parse(ev.target.result); }
      catch(err) { toast('Arquivo inválido: não é um JSON de check-ins.', 'err', 6000); return; }
      if (!Array.isArray(data)) { toast('Arquivo inválido: esperava uma lista de check-ins.', 'err', 6000); return; }
      const lang = currentLang;
      /* Só registros deste idioma e com dia válido; o mesmo dia não duplica */
      const validos = data
        .filter(d => d && typeof d === 'object' && (d.lang === lang || !d.lang) && diaValido(lang, d.dia))
        .map(d => ({ ...d, lang }));
      const antes = lerCheckins(lang);
      const porDiaAntes = new Map(antes.map(c => [c.dia, JSON.stringify(c)]));
      const { lista, sobras } = normalizarCheckins(lang, [...antes, ...validos]);
      let novos = 0, atualizados = 0;
      lista.forEach(c => {
        if (!porDiaAntes.has(c.dia)) novos++;
        else if (porDiaAntes.get(c.dia) !== JSON.stringify(c)) atualizados++;
      });
      if (!arquivarCheckins(lang, sobras) || !setStore(lang, 'checkins', lista)) {
        toast('Não foi possível importar: o navegador não está guardando dados.', 'err', 7000);
        return;
      }
      const ignorados = data.length - validos.length;
      toast('Importação: ' + novos + (novos === 1 ? ' dia novo' : ' dias novos') + ', ' + atualizados
        + (atualizados === 1 ? ' atualizado' : ' atualizados')
        + (ignorados ? ', ' + ignorados + ' ignorado(s) (outro idioma ou sem dia válido)' : '') + '.', 'ok', 7000);
      updateTopbar();
      renderPage('historico');
    };
    reader.readAsText(file);
  };
  input.click();
}

let _limparArmado = false;
function limparCheckin(btn) {
  if (!_limparArmado) {
    _limparArmado = true;
    if (btn) { btn.textContent = 'Confirmar?'; btn.classList.add('btn-danger'); }
    setTimeout(() => {
      _limparArmado = false;
      if (btn) { btn.textContent = 'Limpar'; btn.classList.remove('btn-danger'); }
    }, 3000);
    return;
  }
  _limparArmado = false;
  if (btn) { btn.textContent = 'Limpar'; btn.classList.remove('btn-danger'); }
  limparRascunho();
  _limparCamposReais();
}
function _limparCamposReais() {
  const fields = ['ci-fluency','ci-drops','ci-vocab','ci-escuta-ativa','ci-escuta-morto',
    'ci-criacao','ci-fonetica','ci-skritter','ci-fala','ci-chars',
    'ci-dificuldade','ci-avanco','ci-som-dificil','ci-tom-dificil'];
  fields.forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  ['ci-sessao','ci-tipo-dia','ci-portuhol','ci-traducao','ci-liaison','ci-pinyin'].forEach(id => {
    const el = document.getElementById(id); if (el) el.value = '';
  });
  const ranges = [
    ['ci-compreensao','compr-val','%',40],
    ['ci-energia','energ-val','',7],
    ['ci-pronuncia','pron-val','',5],
    ['ci-tons','ton-val','',5],
  ];
  ranges.forEach(([rid, lid, suf, def]) => {
    const el = document.getElementById(rid);
    const lbl = document.getElementById(lid);
    if (el) { el.value = def; updateRange(el, lid, suf); }
    if (lbl) lbl.textContent = def + suf;
  });
  const out = document.getElementById('analysis-out');
  if (out) { out.classList.remove('vis'); out.innerHTML = ''; }
}

/* ═══════════════════════════════════════════════════════
   PAINEL DE INTELIGÊNCIA — motor de cálculo
═══════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════
   DIA SUGERIDO
   Regra: dia esperado = último dia salvo + dias de calendário
   decorridos desde então. Nunca ultrapassa totalDays.
   Sem histórico → dia 1.
═══════════════════════════════════════════════════════ */
function diaSugerido(lang) {
  const p = PROGRAMS[lang];
  const list = lerCheckins(lang);
  if (!list.length) return 1;

  /* Maior dia registrado; a data dele é a do primeiro registro (editar não move a âncora) */
  const ultimo = list[list.length - 1];
  const tsUltimo = Date.parse(ultimo.timestamp);
  if (!tsUltimo) return Math.min(p.totalDays, ultimo.dia + 1);

  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const dUlt = new Date(tsUltimo); dUlt.setHours(0,0,0,0);
  const diasPassados = Math.max(0, Math.round((hoje - dUlt) / 86400000));

  /* Se já registrou hoje, mantém o mesmo dia (edição). Senão, avança. */
  return Math.max(1, Math.min(p.totalDays, ultimo.dia + diasPassados));
}

/* Dia de hoje no programa, para o topo: com histórico, conta pelo calendário */
function diaAtualPrograma(lang) {
  if (lerCheckins(lang).length) return diaSugerido(lang);
  return diaValido(lang, getStore(lang, 'currentDay')) || 1;
}

/* ═══════════════════════════════════════════════════════
   COMPARAÇÃO SEMANAL — esta semana vs anterior
═══════════════════════════════════════════════════════ */
function compararSemanas(lang) {
  const list = lerCheckins(lang);
  if (list.length < 2) return null;
  const agora = Date.now();
  const d7  = agora - 7  * 86400000;
  const d14 = agora - 14 * 86400000;
  const ts = c => Date.parse(c.timestamp) || 0;
  const atual    = list.filter(c => ts(c) >= d7);
  const anterior = list.filter(c => ts(c) >= d14 && ts(c) < d7);
  if (!atual.length && !anterior.length) return null;

  const media = (arr, k) => {
    const v = arr.map(c => Number(c[k])).filter(n => !isNaN(n) && n > 0);
    return v.length ? v.reduce((a,b)=>a+b,0) / v.length : 0;
  };
  /* Dias com estudo, pela data local ("sem estudo hoje" não conta) */
  const dias = arr => new Set(arr.filter(c => c.sessao !== 'zero').map(c => dataLocal(c.timestamp))).size;
  const soma = (arr, k) => arr.reduce((a,c) => a + (Number(c[k]) || 0), 0);

  const m = (label, a, b, unit, dec=0) => ({
    label, atual: +a.toFixed(dec), anterior: +b.toFixed(dec),
    delta: +(a - b).toFixed(dec), unit,
  });

  return {
    nAtual: atual.length, nAnterior: anterior.length,
    metricas: [
      m('Dias estudados',     dias(atual),              dias(anterior),              'd'),
      m('Compreensão média',  media(atual,'compreensao'), media(anterior,'compreensao'), '%'),
      m('Minutos de fala',    soma(atual,'fala'),        soma(anterior,'fala'),        'min'),
      m('Energia média',      media(atual,'energia'),   media(anterior,'energia'),   '/10', 1),
    ],
  };
}

/* Verifica se já existe check-in salvo na data de hoje */
function fezCheckinHoje(lang) {
  /* Compara a data local: em UTC, um check-in depois das 20h ou 21h caía no dia seguinte */
  const hoje = dataLocal(Date.now());
  return lerCheckins(lang).some(c => dataLocal(c.timestamp) === hoje);
}

function calcAccumulated(lang) {
  const checkins = lerCheckins(lang);   // um registro por dia, em ordem de dia
  const p = PROGRAMS[lang];
  const total = checkins.length;
  if (!total) return {
    totalCheckins:0, diasEstudados:0, diasPerdidos:0, streak:0,
    maiorStreak:0, consistencia7d:0, consistencia30d:0,
    mediaCompreensao:0, mediaEnergia:0, energiaRecente:null, totalMinFala:0,
    evolucaoCompreensao:[], projecaoConclusao:'—',
    projecaoCEFR:'—', riscoAbandono:'baixo',
    pontosFortres:[], pontosFrageis:[],
    hrsAcumuladas:0, hrsEscutaUber:0,
    ritmoAcesos:0, ritmoTotal:0, trechosAcesos:0, ritmoPct:0, pausasSeguidas:0, encerradosAcesos:0, encerradosTotal:0,
    serieTrechos:0, maiorSerieTrechos:0,
  };

  /* ── Dias estudados e sequência ───────────────────── */
  /* "Sem estudo hoje" é um registro honesto, mas não é dia de estudo */
  const estudou = c => c.sessao !== 'zero';
  const diasEstudo = checkins.filter(estudou).map(c => c.dia);   // em ordem, sem repetição
  const diasEstudados = diasEstudo.length;
  const ultimoDia = checkins[total - 1].dia;
  const hojeDia = diaSugerido(lang);
  const diasPerdidos = Math.max(0, ultimoDia - diasEstudados);

  // sequência de dias com estudo (vai para o coach; o Painel mostra trechos seguidos)
  let streak = 0, maiorStreak = 0, corrida = 0;
  diasEstudo.forEach((d, i) => {
    corrida = i > 0 && d === diasEstudo[i - 1] + 1 ? corrida + 1 : 1;
    maiorStreak = Math.max(maiorStreak, corrida);
  });
  // sem estudo ontem nem hoje: a sequência atual terminou
  if (diasEstudados && diasEstudo[diasEstudados - 1] >= hojeDia - 1) streak = corrida;

  /* ── Consistência (%): dias com estudo nos últimos 7 e 30 dias, contados de hoje ── */
  const fimJanela = diasEstudo.includes(hojeDia) ? hojeDia : hojeDia - 1;   // hoje só entra se já estudou
  const naJanela = n => diasEstudo.filter(d => d > fimJanela - n && d <= fimJanela).length;
  const consistencia7d  = Math.round(naJanela(7)  / 7  * 100);
  const consistencia30d = Math.round(naJanela(30) / 30 * 100);

  /* ── Médias ──────────────────────────────────────── */
  const num = v => (v === '' || v == null ? null : Number(v));
  const comps   = checkins.map(c => num(c.compreensao)).filter(v => v != null && v > 0);
  const energias= checkins.map(c => num(c.energia)).filter(v => v != null && !isNaN(v));
  const falas   = checkins.map(c => Number(c.fala) || 0);
  const mediaCompreensao = comps.length    ? Math.round(comps.reduce((a,b)=>a+b,0)/comps.length) : 0;
  const mediaEnergia     = energias.length ? +(energias.reduce((a,b)=>a+b,0)/energias.length).toFixed(1) : 0;
  /* Energia recente: últimos 8 dias do programa, sem plantão (o cansaço do plantão
     é esperado). Com menos de 3 registros, não pesa no risco. */
  const recentes = checkins.filter(c => c.dia > hojeDia - 8 && c.tipoDia !== 'plantao')
    .map(c => num(c.energia)).filter(v => v != null && !isNaN(v));
  const energiaRecente = recentes.length >= 3 ? +(recentes.reduce((a,b)=>a+b,0)/recentes.length).toFixed(1) : null;
  const totalMinFala     = falas.reduce((a,b)=>a+b,0);

  /* ── Horas estimadas ─────────────────────────────── */
  /* "Sem estudo" vale 0. Só registro antigo, sem sessão informada, usa a estimativa de 50 min. */
  const minPorSessao = { completa:105, padrao:67, minima:28, zero:0 };
  const minutos = c => Object.prototype.hasOwnProperty.call(minPorSessao, c.sessao) ? minPorSessao[c.sessao] : 50;
  const hrsAcumuladas = +(checkins.reduce((acc, c) => acc + minutos(c), 0) / 60).toFixed(1);
  const hrsEscutaUber = +(checkins.filter(c => typeof c.escutaMorto === 'string' && c.escutaMorto.trim().length > 2).length * 0.6).toFixed(1);

  /* ── Evolução da compreensão (últimos 10 pontos) ──── */
  const evolucaoCompreensao = checkins
    .filter(c => Number(c.compreensao) > 0)
    .slice(-10)
    .map(c => ({ dia: c.dia, val: Number(c.compreensao) }));

  /* ── Projeção de conclusão ───────────────────────── */
  let projecaoConclusao = '—';
  if (diasEstudados >= 5 && mediaCompreensao > 0) {
    const ritmo = diasEstudados / ultimoDia; // dias estudados / dias decorridos
    const diasRestantes = p.totalDays - ultimoDia;
    const diasEstimados = Math.round(diasRestantes / Math.max(ritmo, 0.3));
    const dataFim = new Date();
    dataFim.setDate(dataFim.getDate() + diasEstimados);
    projecaoConclusao = dataFim.toLocaleDateString('pt-BR', { month:'short', year:'numeric' });
  }

  /* ── Projeção CEFR ───────────────────────────────── */
  const cefr = {
    es: [[40,'A1'],[55,'A2'],[65,'B1 inicial'],[75,'B1'],[82,'B2 inicial'],[100,'B2']],
    fr: [[40,'A1'],[50,'A2 inicial'],[60,'A2'],[68,'B1 inicial'],[75,'B1'],[100,'B1+']],
    zh: [[35,'HSK1'],[45,'HSK2'],[55,'HSK3'],[65,'HSK4'],[72,'HSK5'],[100,'HSK5+']],
  };
  const cefrMap = cefr[lang] || cefr.es;
  const projecaoCEFR = (cefrMap.find(([thr]) => mediaCompreensao <= thr) || cefrMap.slice(-1)[0])[1];

  /* ── Ritmo por trechos (regra de ciclos) ─────────── */
  /* A regularidade é medida em trechos de N dias, não na semana de 7:
     na escala 24/72, estudar só nas folgas mantém todos os trechos
     acesos. Conta a partir de hoje, então sumir também aparece aqui. */
  const j = calcJornada(lang);
  const { ritmoAcesos, ritmoTotal, trechosAcesos, pausasSeguidas, encerradosAcesos, encerradosTotal } = j;
  const ritmoPct = ritmoTotal ? Math.round(ritmoAcesos / ritmoTotal * 100) : 0;

  /* ── Risco de abandono ───────────────────────────── */
  /* Pausas seguidas e ritmo dos trechos; a energia só entra com dados recentes */
  const energiaBaixa = energiaRecente !== null && energiaRecente < 4;
  const energiaMedia = energiaRecente !== null && energiaRecente < 5.5;
  let riscoAbandono = 'baixo';
  if (pausasSeguidas >= 2 || (ritmoTotal >= 3 && ritmoPct < 30) || energiaBaixa) riscoAbandono = 'alto';
  else if ((ritmoTotal >= 3 && ritmoPct < 57) || energiaMedia) riscoAbandono = 'médio';

  /* ── Pontos fortes e fracos ──────────────────────── */
  const pontosFortres = [], pontosFrageis = [];
  if (ritmoTotal >= 3 && ritmoPct >= 85) pontosFortres.push((ritmoAcesos === ritmoTotal ? 'Ritmo cheio: ' : 'Ritmo firme: ') + ritmoAcesos + ' de ' + ritmoTotal + ' trechos acesos');
  if (diasEstudados > 0 && totalMinFala >= diasEstudados * 3) pontosFortres.push('Prática oral acima da meta');
  if (mediaCompreensao >= 60) pontosFortres.push('Compreensão auditiva em boa progressão');
  if (energiaRecente !== null && energiaRecente >= 7) pontosFortres.push('Energia e motivação elevadas');

  if (pausasSeguidas >= 2) pontosFrageis.push(pausasSeguidas + ' trechos seguidos em pausa — retome com sessão mínima');
  else if (ritmoTotal >= 3 && ritmoPct < 57) pontosFrageis.push('Ritmo baixo: ' + ritmoAcesos + ' de ' + ritmoTotal + ' trechos acesos');
  if (totalMinFala < diasEstudados * 2) pontosFrageis.push('Prática oral abaixo da meta');
  if (mediaCompreensao > 0 && mediaCompreensao < 40) pontosFrageis.push('Compreensão auditiva ainda baixa — aumentar input compreensível');
  if (energiaRecente !== null && energiaRecente < 5) pontosFrageis.push('Energia/motivação baixa nos últimos dias — considerar sessões mínimas até recuperar ritmo');

  /* ── Recomendação automática ─────────────────────── */
  let recomendacao = 'Mantenha o ritmo atual. Consistência acima de tudo.';
  if (j.voltou) recomendacao = 'Boa volta! ' + (j.cicloAtual.aceso
    ? 'Este trecho já acendeu. Siga no seu ritmo, sem tentar compensar o tempo parado.'
    : 'Mais ' + jornadaDias(j.falta) + ' de estudo e este trecho acende. Sessão mínima vale.');
  else if (riscoAbandono === 'alto') recomendacao = 'Risco de abandono detectado. Use apenas sessão mínima esta semana. O hábito vale mais que a intensidade.';
  else if (pontosFrageis.includes('Prática oral abaixo da meta')) recomendacao = 'Prioridade: adicionar 5 min extras de fala por dia. Shadowing em momentos ociosos conta.';
  else if (mediaCompreensao > 0 && mediaCompreensao < 40) recomendacao = 'Foque em input compreensível fácil. Reduzir dificuldade melhora a compreensão mais rápido que aumentar volume.';
  else if (ritmoTotal >= 4 && ritmoAcesos >= ritmoTotal - 1) recomendacao = 'Ritmo firme: ' + ritmoAcesos + ' de ' + ritmoTotal + ' trechos acesos. Considere avançar a dificuldade do input.';

  return {
    totalCheckins: total, diasEstudados, diasPerdidos, streak, maiorStreak,
    consistencia7d, consistencia30d, mediaCompreensao, mediaEnergia, energiaRecente,
    totalMinFala, evolucaoCompreensao, projecaoConclusao, projecaoCEFR,
    riscoAbandono, pontosFortres, pontosFrageis, recomendacao,
    hrsAcumuladas, hrsEscutaUber,
    ritmoAcesos, ritmoTotal, trechosAcesos, ritmoPct, pausasSeguidas, encerradosAcesos, encerradosTotal,
    serieTrechos: j.serieAtual, maiorSerieTrechos: j.maiorSerie,
  };
}

function jornadaFala(lang) {
  return JORNADA_FALAS[lang] || JORNADA_FALAS.es;
}

const JORNADA_ICONES = {
  sol:       '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  amanhecer: '<path d="M3 19h18M7 19a5 5 0 0 1 10 0M12 4v6M9 7l3-3 3 3M4.2 12.2l1.4 1.4M19.8 12.2l-1.4 1.4"/>',
  lua:       '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
  descanso:  '<path d="M4 9h5l-5 6h5M13 5h4l-4 5h4M16 14h4l-4 5h4"/>',
  selo:      '<circle cx="12" cy="6" r="3"/><path d="M10.5 9h3l1 5h-5zM5 14h14v3H5zM7 20h10"/>',
