<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#fcfcfe"/>
      <stop offset="0.5"  stop-color="#f3f3f9"/>
      <stop offset="1"    stop-color="#e9e9f3"/>
    </linearGradient>

    <linearGradient id="bub" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0"    stop-color="#8f7dff"/>
      <stop offset="0.45" stop-color="#6d5ef5"/>
      <stop offset="1"    stop-color="#4f8ef7"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.60"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3a2f8f" flood-opacity="0.28"/>
    </filter>

    <clipPath id="sq"><rect width="512" height="512" rx="114" ry="114"/></clipPath>
  </defs>

  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#bgL)"/>

    <!-- Auras neon nas 3 cores dos idiomas -->
    <circle cx="132" cy="150" r="104" fill="#e8c547" opacity="0.34" filter="url(#soft)"/>
    <circle cx="392" cy="176" r="100" fill="#4f8ef7" opacity="0.30" filter="url(#soft)"/>
    <circle cx="268" cy="404" r="112" fill="#e84c3d" opacity="0.26" filter="url(#soft)"/>

    <!-- ══ Balão único ══ -->
    <g filter="url(#drop)">
      <path d="M154 104 H358 a74 74 0 0 1 74 74 v116 a74 74 0 0 1 -74 74 h-92 l-78 66 8-66 h-42 a74 74 0 0 1 -74 -74 v-116 a74 74 0 0 1 74 -74 z"
            fill="url(#bub)"/>
      <path d="M154 104 H358 a74 74 0 0 1 74 74 v116 a74 74 0 0 1 -74 74 h-92 l-78 66 8-66 h-42 a74 74 0 0 1 -74 -74 v-116 a74 74 0 0 1 74 -74 z"
            fill="url(#sheen)"/>
    </g>

    <!-- Três pontos = três idiomas -->
    <circle cx="176" cy="236" r="27" fill="#f2cf52"/>
    <circle cx="176" cy="236" r="27" fill="url(#sheen)"/>

    <circle cx="256" cy="236" r="27" fill="#ffffff" opacity="0.97"/>

    <circle cx="336" cy="236" r="27" fill="#f0564a"/>
    <circle cx="336" cy="236" r="27" fill="url(#sheen)"/>

    <!-- Brilho glass superior -->
    <rect x="0" y="0" width="512" height="200" fill="url(#sheen)" opacity="0.45"/>
  </g>
</svg>
